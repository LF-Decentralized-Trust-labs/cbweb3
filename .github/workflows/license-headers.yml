# SPDX-License-Identifier: Apache-2.0
name: License Headers

permissions:
  contents: read

# Deliberately not path-filtered. The gate is cheap (a few seconds) and reports a
# status on every pull request, which is what makes it eligible as a required
# check under branch protection. A path-filtered gate that skips is indistinguishable
# from one that passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: license-headers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spdx-headers:
    name: SPDX header check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs first: proves the checker still fails on a header-less fixture.
      # Without it the gate can silently regress to reporting success without
      # verifying anything — which is exactly how it once printed OK while 94
      # files had no header.
      - name: Self-test the header checker (the fail path must fail)
        run: bash platform/tools/check-license-headers.test.sh

      # Scans the whole repository, not just platform/: Go, TypeScript and Python
      # first-party sources, with vendored and generated code excluded.
      - name: Verify SPDX-License-Identifier headers
        run: bash platform/tools/check-license-headers.sh "$GITHUB_WORKSPACE"
