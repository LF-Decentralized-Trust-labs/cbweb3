# SPDX-License-Identifier: Apache-2.0
name: Secret Scan

# Repository-wide secret-scan gate for the monorepo — Toolbox, docs and the
# imported platform/ tree alike. Adapted from the platform's own gate
# (platform/.github/workflows/gitleaks.yml, finding R2-11.3), which is inert
# where it sits: GitHub only discovers workflows in the ROOT .github/workflows.
#
# Deliberately NOT path-filtered: it runs and reports a status on every pull
# request, so it is eligible as a required status check under branch
# protection.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Pinned gitleaks release, same pin as the platform gate. The MIT-licensed
  # binary needs no GITLEAKS_LICENSE, unlike gitleaks-action@v2.
  GITLEAKS_VERSION: "8.28.0"
  # SHA-256 of gitleaks_8.28.0_linux_x64.tar.gz, from the release asset
  # gitleaks_8.28.0_checksums.txt. Pinning the version alone is not enough: a
  # release asset can be replaced. Bump both together when upgrading.
  GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is REQUIRED by the history-scan step below (`gitleaks
          # git` walks every commit). Do not lower this to 1: a shallow clone
          # makes the history scan silently cover almost nothing.
          fetch-depth: 0
          persist-credentials: false

      # Download the pinned, MIT-licensed gitleaks binary (linux x64) directly
      # from the official release. The checksum is verified before the archive
      # is unpacked, so a swapped release asset fails the job instead of
      # silently running as the scanner.
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # SCAN 1 of 2 — WORKING TREE. Catches a secret present in the source
      # right now; does not walk commit history (that is scan 2's job). The
      # root config extends platform/.gitleaks.toml, which extends the gitleaks
      # defaults — see both files for the documented exemptions.
      - name: Run gitleaks — working tree
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --exit-code 1

      # SCAN 2 of 2 — COMMIT HISTORY. Walks every commit reachable from the
      # checked-out ref, so it catches a secret committed and later deleted.
      # Pre-existing findings are suppressed by the root .gitleaksignore
      # (fingerprints commit:file:rule:line, regenerated after the monorepo
      # import because filter-repo changed every SHA and path). A fingerprint
      # pins a commit AND a line, so a NEW secret still fails — including one
      # added to a file that already has accepted entries.
      #
      # if: always() so a working-tree failure does not mask the history
      # result; the job still fails if either scan does.
      - name: Run gitleaks — commit history
        if: always()
        run: gitleaks git . --config .gitleaks.toml --redact --exit-code 1
