site_name: Hyperledger CBWeb3
repo_name: LF-Decentralized-Trust-labs/cbweb3
repo_url: https://github.com/LF-Decentralized-Trust-labs/cbweb3
theme:
  name: material
  custom_dir: overrides
  logo: assets/CBweb3Negros.png
  favicon: assets/CBweb3Negros.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
  - content.code.copy
  - navigation.expand
  - navigation.footer
  - navigation.instant
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - navigation.tracking
  - toc.follow
  - toc.integrate
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
plugins:
  - search
extra:
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
nav:
  - Introduction: index.md
  - Technical Blueprint: CBWeb3_Technical_Blueprint.md
  - CBWeb3 as a DPG:
    - DPG Assessment: dpg-assesment/CBWeb3_as_a_DPG.md
    - Privacy vs Confidentiality: dpg-assesment/Privacy vs Confidentiality.md
  - Research Papers: research-papers/index.md
