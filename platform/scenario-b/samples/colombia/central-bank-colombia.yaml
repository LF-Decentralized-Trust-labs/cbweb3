apiVersion: cbweb3b/v1
kind: ParticipantDeployment
metadata:
  name: central-bank-colombia
spec:
  scenario: "b"
  environment: local
  mode: found-spoke
  topology:
    role: central-bank
  displayName: "Banco de la República (Colombia)"
  spoke:
    id: spoke-cop
    chainId: 1340
    currency: COP
    # ERC-20 metadata of this spoke's own tokens (tCeBM reserve + fCeBM fiat).
    # Optional — absent, all four derive from `currency` (exactly the values
    # below). Declared explicitly so each sovereign token is auditable in config.
    # Symbols must keep the "<prefix>_<ISO>" shape: portals and the api-gateway
    # read the currency code from the segment after the last underscore.
    tokenName: Tokenized COP
    tokenSymbol: tCeBM_COP
    fiatTokenName: Fiat COP
    fiatTokenSymbol: fCeBM_COP
  hubBundleRef: ../bundles/hub.bundle.yaml
  # Opening a sovereign corridor is a runtime act (proposePair/confirmPair via each
  # CB's governance portal), not a provisioning step — there is no manifest field for it.
  node:
    advertisedHost: host.docker.internal
    rpc:  { port: 9445 }
    ws:   { port: 9455 }
    p2p:  { port: 30603 }
    dataDir: cbweb3-data/central-bank-colombia
  image: build
  keyProvider: kms://local-emulator
  certSource: self-signed
  relay:
    endpoint: http://localhost:7000
  # This CB's own api-gateway, host-mapped (RPC 9445 + 8000). Declared for the
  # credential-request hook the toolkit roadmap describes; NOTHING in the engine
  # reads it yet, which is how it went unnoticed that the old value (18945) carried
  # Scenario A's base AND Scenario A's +10000 gateway offset.
  cbEndpoint: http://host.docker.internal:17445
  frontendHost: localhost
  launcher: enable
  launcherPort: 5197
  adminUsers:
    - { role: GOVERNANCE, username: admin@colombia.governance.gov, password: colombia-governance-local }
    - { role: TREASURY,   username: admin@colombia.treasury.gov,   password: colombia-treasury-local }
    - { role: SUPERVISOR, username: admin@colombia.supervisor.gov, password: colombia-supervisor-local }
    - { role: ADMISSION,  username: admin@colombia.admission.gov, password: colombia-admission-local }
  # Reverse proxy off — these many-entity single-host samples are port-based via the
  # per-entity launcher. Test the proxy separately with proxy-smoke.sh (one entity per host).
  proxy: disable
