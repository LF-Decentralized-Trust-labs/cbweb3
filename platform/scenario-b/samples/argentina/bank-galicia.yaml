apiVersion: cbweb3b/v1
kind: ParticipantDeployment
metadata:
  name: bank-galicia
spec:
  scenario: "b"
  environment: local
  mode: join
  topology:
    role: commercial-bank
  bankId: bank-galicia
  displayName: "Banco Galicia"
  spoke:
    id: spoke-ars
    chainId: 1339
    currency: ARS
  joinBundleRef: ../bundles/spoke-ars.bundle.yaml
  node:
    advertisedHost: host.docker.internal
    rpc:  { port: 8746 }
    ws:   { port: 8756 }
    p2p:  { port: 31404 }
    dataDir: cbweb3-data/bank-galicia
    validator: false
  image: build
  keyProvider: kms://local-emulator
  certSource: ca://central-bank-argentina
  relay:
    endpoint: http://localhost:4000
  frontendHost: localhost
  launcher: enable
  launcherPort: 5195
  adminUsers:
    - { role: BANK, username: admin@galicia.argentina.com, password: galicia-bank-local }
