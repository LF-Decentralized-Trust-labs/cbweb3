apiVersion: cbweb3b/v1
kind: ParticipantDeployment
metadata:
  name: bank-macro
spec:
  scenario: "b"
  environment: local
  mode: join
  topology:
    role: commercial-bank
  bankId: bank-macro
  displayName: "Banco Macro"
  spoke:
    id: spoke-ars
    chainId: 1339
    currency: ARS
  joinBundleRef: ../bundles/spoke-ars.bundle.yaml
  node:
    advertisedHost: host.docker.internal
    rpc:  { port: 33747 }
    ws:   { port: 33757 }
    p2p:  { port: 56405 }
    dataDir: cbweb3-data/bank-macro
    validator: false
  image: build
  keyProvider: kms://local-emulator
  certSource: ca://central-bank-argentina
  relay:
    endpoint: http://localhost:7000
  frontendHost: localhost
  launcher: enable
  launcherPort: 5196
  adminUsers:
    - { role: BANK, username: admin@macro.argentina.com, password: macro-bank-local }
  # Reverse proxy off — these many-entity single-host samples are port-based via the
  # per-entity launcher. Test the proxy separately with proxy-smoke.sh (one entity per host).
  proxy: disable
