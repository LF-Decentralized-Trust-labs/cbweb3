apiVersion: cbweb3b/v1
kind: ParticipantDeployment
metadata:
  name: bank-itau
spec:
  scenario: "b"
  environment: local
  mode: join
  topology:
    role: commercial-bank
  bankId: bank-itau
  displayName: "Itaú"
  spoke:
    id: spoke-brl
    chainId: 1338
    currency: BRL
  joinBundleRef: ../bundles/spoke-brl.bundle.yaml
  node:
    advertisedHost: host.docker.internal
    rpc:  { port: 33646 }
    ws:   { port: 33656 }
    p2p:  { port: 56304 }
    dataDir: cbweb3-data/bank-itau
    validator: false               # non-validating full node
  image: build
  keyProvider: kms://local-emulator
  certSource: ca://central-bank-brazil
  relay:
    endpoint: http://localhost:7000
  frontendHost: localhost
  launcher: enable
  launcherPort: 5192
  adminUsers:
    - { role: BANK, username: admin@itau.brasil.com, password: itau-bank-local }
  # Reverse proxy off — these many-entity single-host samples are port-based via the
  # per-entity launcher. Test the proxy separately with proxy-smoke.sh (one entity per host).
  proxy: disable
