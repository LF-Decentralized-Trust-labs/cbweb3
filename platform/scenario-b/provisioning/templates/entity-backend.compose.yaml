# entity-backend template (TK-B4) — per-entity backend (API gateway et al.).
# Reaches the hub cross-stack via host-gateway. Stateless (no node state here;
# that lives in entity-besu). Parametrized; no secrets embedded.
services:
  api-gateway:
    image: "${BACKEND_IMAGE:-cbweb3b/api-gateway:local}"
    container_name: "${CONTAINER_PREFIX:?}-${ENTITY:?}-api-gateway"
    environment:
      ENTITY: "${ENTITY:?}"
      HUB_RPC_URL: "http://host.docker.internal:${HUB_RPC_PORT:?}"
      ENTITY_BESU_RPC_URL: "http://host.docker.internal:${ENTITY_RPC_PORT:?}"
      GATEWAY_PORT: "${GATEWAY_PORT:?}"
      # Compliance gRPC + internal-relay secret: set on the hub (spoke
      # self-registration endpoint); default to no-op values on other entities.
      COMPLIANCE_GRPC_ADDR: "${COMPLIANCE_GRPC_ADDR:-localhost:9093}"
      INTERNAL_RELAY_AUTH_SECRET: "${INTERNAL_RELAY_AUTH_SECRET:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GATEWAY_PORT:?}:8080"
    networks:
      - entity_net
    restart: always

networks:
  entity_net:
    name: "${ENTITY_NET_PREFIX:?}_net"
    external: true
