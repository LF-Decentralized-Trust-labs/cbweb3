# entity-infra template (TK-B4) — per-entity Postgres + Redis.
# Derived from deploy/local/compose.yml. Parametrized; DB state in a named
# volume; no secrets embedded (credentials come from ${...}).
services:
  postgres:
    image: "postgres:${POSTGRES_IMAGE_TAG:-17-alpine}"
    container_name: "${CONTAINER_PREFIX:?}-${ENTITY:?}-postgres"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
    ports:
      - "${POSTGRES_PORT:?}:5432"
    volumes:
      - entity_pg_data:/var/lib/postgresql/data
    networks:
      - entity_net
    restart: always

  redis:
    image: "redis:${REDIS_IMAGE_TAG:-7-alpine}"
    container_name: "${CONTAINER_PREFIX:?}-${ENTITY:?}-redis"
    # This Redis is not a cache. It holds the relay-auth replay guard
    # (relayauth:seen:, where SET NX admits each signature exactly once) and the
    # auth service's PKI login nonces (pki:nonce:). Anyone able to delete those
    # keys can re-arm a signature that was already spent, which is replay of a
    # signed internal call. So it takes a password, and it is not published.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    # No host port on purpose: every consumer reaches this by container name over
    # entity_net (REDIS_ADDR is "<prefix>-<entity>-redis:6379"), so publishing 6379
    # only widened the attack surface. Reach it for debugging with
    #   docker exec -it <prefix>-<entity>-redis redis-cli
    # which needs no published port, or add a temporary mapping deliberately.
    networks:
      - entity_net
    restart: always

networks:
  # Shared entity network, created by the entity's besu compose; joined here.
  entity_net:
    name: "${ENTITY_NET_PREFIX:?}_net"
    external: true

volumes:
  entity_pg_data:
    name: "${ENTITY_VOLUME_PREFIX:?}_pg_data"
