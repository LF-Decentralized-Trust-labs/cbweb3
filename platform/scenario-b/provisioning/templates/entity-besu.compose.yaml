# entity-besu template (TK-B4) — Besu (+Paladin) node of a spoke/bank.
# Home of node state (besu_data/genesis/config/tls/paladin_data) in named
# volumes. Only host bind mount is the bank pki/ (onboarding/KYC). Parametrized;
# no secrets embedded. Consumed at runtime by found-spoke/join (TK-B7/B8).
# Container log rotation, applied to every service in this file.
#
# Without it Docker's json-file driver has no size cap and no rotation: the
# Scenario A Paladin containers reached 96 GB (~2.4 GB/day) and a full disk takes
# the whole network down. 50m x 5 caps each service at 250 MB.
#
# Both options are load-bearing. max-size alone rotates into an unbounded number of
# files; max-file alone caps the count of files that each grow forever.
#
# The anchor is not brevity: without it a new service is added with no logging block
# and the ceiling silently fails to apply to that container. With it the omission is
# visible in review, and toolkit/engine/composetemplate fails the build.
x-logging: &cbweb3_logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  besu:
    logging: *cbweb3_logging
    image: "${BESU_IMAGE:-hyperledger/besu:25.8.0}"
    container_name: "${CONTAINER_PREFIX:?}-${ENTITY:?}-besu"
    command:
      - "--data-path=data"
      - "--genesis-file=genesis/genesis.json"
      - "--min-gas-price=0"
      - "--bootnodes=${BOOTNODE_ENODE:?}"
      - "--rpc-http-enabled"
      - "--rpc-http-api=ETH,NET,QBFT"
      - "--rpc-ws-enabled"
      - "--rpc-ws-api=ETH,NET,QBFT"
      - "--host-allowlist=*"
      - "--rpc-http-cors-origins=all"
      - "--rpc-http-host=0.0.0.0"
      - "--rpc-ws-host=0.0.0.0"
      - "--rpc-http-port=8545"
      - "--rpc-ws-port=8546"
      - "--p2p-port=30303"
    ports:
      - "${ENTITY_RPC_PORT:?}:8545"
      - "${ENTITY_WS_PORT:?}:8546"
      - "${ENTITY_P2P_PORT:?}:30303"
      - "${ENTITY_P2P_PORT:?}:30303/udp"
    volumes:
      - entity_besu_data:/opt/besu/data
      - entity_genesis:/opt/besu/genesis
      - entity_tls:/opt/besu/tls
      - "${PKI_DIR:?}:/opt/besu/pki"
    networks:
      - entity_besu_network
    restart: always

  paladin:
    logging: *cbweb3_logging
    image: "${PALADIN_IMAGE:-docker.io/lfdecentralizedtrust/paladin:v1.0.0}"
    container_name: "${CONTAINER_PREFIX:?}-${ENTITY:?}-paladin"
    depends_on:
      - besu
    ports:
      - "${ENTITY_PALADIN_PORT:?}:8548"
    volumes:
      - entity_paladin_data:/data
      - entity_config:/config
    networks:
      - entity_besu_network
    restart: always

networks:
  entity_besu_network:
    name: "${ENTITY_NET_PREFIX:?}_besu_network"

volumes:
  entity_besu_data:
    name: "${ENTITY_VOLUME_PREFIX:?}_besu_data"
  entity_genesis:
    name: "${ENTITY_VOLUME_PREFIX:?}_genesis"
  entity_config:
    name: "${ENTITY_VOLUME_PREFIX:?}_config"
  entity_tls:
    name: "${ENTITY_VOLUME_PREFIX:?}_tls"
  entity_paladin_data:
    name: "${ENTITY_VOLUME_PREFIX:?}_paladin_data"
