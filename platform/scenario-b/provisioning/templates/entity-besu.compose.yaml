# entity-besu template (TK-B4) — Besu (+Paladin) node of a spoke/bank.
# Home of node state (besu_data/genesis/config/tls/paladin_data) in named
# volumes. Only host bind mount is the bank pki/ (onboarding/KYC). Parametrized;
# no secrets embedded. Consumed at runtime by found-spoke/join (TK-B7/B8).
services:
  besu:
    image: "${BESU_IMAGE:-hyperledger/besu:25.8.0}"
    container_name: "${CONTAINER_PREFIX:?}-${ENTITY:?}-besu"
    command:
      - "--data-path=data"
      - "--genesis-file=genesis/genesis.json"
      - "--min-gas-price=0"
      - "--bootnodes=${BOOTNODE_ENODE:?}"
      - "--rpc-http-enabled"
      - "--rpc-http-api=ETH,NET,QBFT"
      - "--rpc-ws-enabled"
      - "--rpc-ws-api=ETH,NET,QBFT"
      - "--host-allowlist=*"
      - "--rpc-http-cors-origins=all"
      - "--rpc-http-host=0.0.0.0"
      - "--rpc-ws-host=0.0.0.0"
      - "--rpc-http-port=8545"
      - "--rpc-ws-port=8546"
      - "--p2p-port=30303"
    ports:
      - "${ENTITY_RPC_PORT:?}:8545"
      - "${ENTITY_WS_PORT:?}:8546"
      - "${ENTITY_P2P_PORT:?}:30303"
      - "${ENTITY_P2P_PORT:?}:30303/udp"
    volumes:
      - entity_besu_data:/opt/besu/data
      - entity_genesis:/opt/besu/genesis
      - entity_tls:/opt/besu/tls
      - "${PKI_DIR:?}:/opt/besu/pki"
    networks:
      - entity_besu_network
    restart: always

  paladin:
    image: "${PALADIN_IMAGE:-lfdt-labs/paladin:latest}"
    container_name: "${CONTAINER_PREFIX:?}-${ENTITY:?}-paladin"
    depends_on:
      - besu
    ports:
      - "${ENTITY_PALADIN_PORT:?}:8548"
    volumes:
      - entity_paladin_data:/data
      - entity_config:/config
    networks:
      - entity_besu_network
    restart: always

networks:
  entity_besu_network:
    name: "${ENTITY_NET_PREFIX:?}_besu_network"

volumes:
  entity_besu_data:
    name: "${ENTITY_VOLUME_PREFIX:?}_besu_data"
  entity_genesis:
    name: "${ENTITY_VOLUME_PREFIX:?}_genesis"
  entity_config:
    name: "${ENTITY_VOLUME_PREFIX:?}_config"
  entity_tls:
    name: "${ENTITY_VOLUME_PREFIX:?}_tls"
  entity_paladin_data:
    name: "${ENTITY_VOLUME_PREFIX:?}_paladin_data"
