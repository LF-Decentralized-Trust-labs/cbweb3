# entity-payment template — the payment-orchestrator for a COMMERCIAL BANK.
# Deployed only by join (a bank), NOT by found-spoke (a CB, which gets its
# orchestrator from entity-relayer as a bridge RelayerWorker instead).
#
# A bank runs the orchestrator purely to back the api-gateway's payment gRPC:
# the deposit/redeem/escrow HTTP routes only register when PAYMENT_GRPC_ADDR is
# set (see entity-backend). Deposits and the cross-currency bridge-in lock-mint
# are PROXIED to the bank's CB (only the CB holds CENTRAL_BANK_ROLE to mint), so
# this orchestrator does NOT run a Hub mint/burn relayer: HUB_BESU_RPC_URL and
# SIGNER_PRIVATE_KEY are intentionally left unset, which disables the relayer
# worker (it would have no work to do here).
#
# Interpolation vars come from the runner's process env (ComposeEnv). No secrets
# are baked into this file.
services:
  payment-orchestrator:
    image: "${PAYMENT_ORCHESTRATOR_IMAGE:-cbweb3b/payment-orchestrator:local}"
    container_name: "${CONTAINER_PREFIX:?}-${ENTITY:?}-payment-orchestrator"
    environment:
      PAYMENT_GRPC_PORT: "9094"
      # Required at boot: the Cacti relay endpoint (spoke legs are skipped locally,
      # but the process fails fast without it).
      CACTI_API_URL: "${CACTI_API_URL:-http://host.docker.internal:7000}"
      # FX-agreement persistence — shares the entity Postgres with the api-gateway.
      DATABASE_URL: "postgres://${POSTGRES_USER:-cbweb3}:${POSTGRES_PASSWORD:?}@${CONTAINER_PREFIX}-${ENTITY}-postgres:5432/${POSTGRES_DB:-keycloak}?sslmode=disable"
      SPOKE_CHAIN_ID: "${SPOKE_CHAIN_ID:-1337}"
      # Spoke token clients (READ path): the bank's fiat (fCeBM) and tCeBM balances
      # are read from its own spoke node — this is how the portal shows the FIAT the
      # CB tokenized after approving a deposit. The bank never MINTS (approval + mint
      # happen on the CB); the operator key is the bank's derived key, used only to
      # sign the From field of the read-only balance calls. Empty addresses disable.
      BESU_RPC_URL: "http://host.docker.internal:${ENTITY_RPC_PORT:?}"
      BESU_CHAIN_ID: "${SPOKE_CHAIN_ID:-1337}"
      BESU_OPERATOR_KEY: "${ENTITY_BESU_OPERATOR_KEY:?}"
      FIAT_TOKEN_ADDRESS: "${SPOKE_FCEBM_ADDRESS:-}"
      TOKEN_ADDRESS: "${SPOKE_TCEBM_ADDRESS:-}"
      # Local dev: no spoke reserve lock — bridge-in mints the mirrored asset on the
      # hub (which is the CB's job, delegated via CENTRAL_BANK_API_URL, not here).
      BRIDGE_SKIP_SPOKE_LOCK: "${BRIDGE_SKIP_SPOKE_LOCK:-true}"
      # Deployment profile for the flag above. The Hub mint that BRIDGE_SKIP_SPOKE_LOCK
      # permits has no spoke-side reserve behind it, so the orchestrator refuses it unless
      # the profile is explicitly "local" — and refuses to boot at all with the flag set
      # outside local.
      #
      # Defaulting to local is accurate rather than convenient: manifest validation still
      # rejects any spec.environment other than "local" (toolkit/engine/manifest/validate.go),
      # so every stack this template renders today IS a local lab, deploy-lnet included. When
      # staging/prod profiles are enabled (ADR-004), this must be threaded from
      # spec.environment through the compose env instead of defaulted here — otherwise the
      # guard has no teeth on the deployment that needs it most. Until then an operator can
      # harden a specific stack by exporting ENVIRONMENT and BRIDGE_SKIP_SPOKE_LOCK=false.
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      # R2-H-8 service-mesh mTLS — the orchestrator is a gRPC server (gateway→PO).
      # Opt-in via GRPC_MTLS_ENABLE (empty by default → plaintext, unchanged).
      GRPC_MTLS_CERT_FILE: "${GRPC_MTLS_ENABLE:+/svc-tls/payment-orchestrator.crt}"
      GRPC_MTLS_KEY_FILE: "${GRPC_MTLS_ENABLE:+/svc-tls/payment-orchestrator.key}"
      GRPC_MTLS_CA_FILE: "${GRPC_MTLS_ENABLE:+/svc-tls/svc-ca.crt}"
      GRPC_AUTHZ_ENFORCE: "${GRPC_AUTHZ_ENFORCE:-}"
    volumes:
      - "svc_tls:/svc-tls:ro"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - entity_net
    restart: always

networks:
  entity_net:
    name: "${ENTITY_NET_PREFIX:?}_net"
    external: true

volumes:
  # Service-mesh mTLS material shared with the entity backend (same named volume,
  # seeded by gen-svc-tls). Read-only; consumed only when GRPC_MTLS_ENABLE is set.
  svc_tls:
    name: "${SVC_TLS_VOLUME:?}"
