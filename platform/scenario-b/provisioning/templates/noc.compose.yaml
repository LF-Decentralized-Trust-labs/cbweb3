# noc template (TK-B4) — NOC hub stack (db/backend/portal) + a per-entity
# noc-agent parametrized by entity (no fixed spoke identifiers).
# Derived from deploy/local/compose.noc.yml. DB state in a named volume; no
# secrets embedded.
services:
  noc-db:
    image: "postgres:${NOC_DB_IMAGE_TAG:-15-alpine}"
    container_name: "${CONTAINER_PREFIX:?}-noc-db"
    environment:
      POSTGRES_USER: "${NOC_DB_USER:?}"
      POSTGRES_PASSWORD: "${NOC_DB_PASSWORD:?}"
      POSTGRES_DB: "${NOC_DB_NAME:-noc}"
    volumes:
      - noc_db_data:/var/lib/postgresql/data
    networks:
      - entity_net
    restart: always

  noc-backend:
    image: "${NOC_BACKEND_IMAGE:-cbweb3b/noc-backend:local}"
    container_name: "${CONTAINER_PREFIX:?}-noc-backend"
    depends_on:
      - noc-db
    environment:
      # Listen on 8080 to match the container-side of the port mapping below.
      NOC_BACKEND_PORT: "8080"
      DATABASE_URL: "postgres://${NOC_DB_USER}:${NOC_DB_PASSWORD}@${CONTAINER_PREFIX}-noc-db:5432/${NOC_DB_NAME:-noc}?sslmode=disable"
      # Local dev: no Keycloak NOC realm is provisioned by the toolkit, so bypass
      # JWT validation (NEVER in production).
      NOC_SKIP_AUTH: "true"
    ports:
      - "${NOC_BACKEND_PORT:?}:8080"
    networks:
      - entity_net
    restart: always

  noc-portal:
    image: "${NOC_PORTAL_IMAGE:-cbweb3b/noc-portal:local}"
    container_name: "${CONTAINER_PREFIX:?}-noc-portal"
    ports:
      - "${NOC_PORTAL_PORT:?}:80"
    networks:
      - entity_net
    restart: always

  noc-agent:
    image: "${NOC_AGENT_IMAGE:-cbweb3b/noc-agent:local}"
    container_name: "${CONTAINER_PREFIX:?}-noc-agent-${NOC_AGENT_ENTITY:?}"
    environment:
      AGENT_ENTITY: "${NOC_AGENT_ENTITY:?}"
      BESU_RPC_URL: "${NOC_AGENT_BESU_RPC:?}"
      # Env-based agent config (no agent.yaml is mounted in the toolkit deploy): the
      # agent pushes health to its entity's noc-backend with a local dev api key.
      NOC_BACKEND_URL: "http://${CONTAINER_PREFIX}-noc-backend:8080"
      AGENT_API_KEY: "${NOC_AGENT_API_KEY:-noc-agent-local-key}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - entity_net
    restart: always

networks:
  entity_net:
    name: "${ENTITY_NET_PREFIX:?}_net"
    external: true

volumes:
  noc_db_data:
    name: "${NOC_VOLUME_PREFIX:?}_noc_db_data"
