# JSON-Schema v1 (contrato de editor/CI) — ParticipantDeployment (cbweb3b/v1)
# Fonte de verdade das regras SEMÂNTICAS é a validação Go (engine/manifest);
# este schema cobre as regras ESTRUTURAIS para editores/CI. Nenhuma lib de
# JSON-Schema é usada em runtime pelo toolkit. As regras estruturais (enums de
# mode/role/environment e a matriz obrigatório/proibido por modo) são mantidas
# em paridade com o validador Go pelo teste schema_parity_test.go (SC-004).
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://cbweb3/scenario-b/schema/v1/participant-deployment.schema.yaml"
title: ParticipantDeployment
type: object
required: [apiVersion, kind, metadata, spec]
properties:
  apiVersion: { const: "cbweb3b/v1" }
  kind: { const: "ParticipantDeployment" }
  metadata:
    type: object
    required: [name]
    properties:
      name: { type: string, minLength: 1 }
  spec:
    type: object
    # node/image/keyProvider/certSource/relay são obrigatórios apenas nos modos
    # que sobem um nó Besu (found-hub/found-spoke/join) — ver allOf abaixo. O modo
    # observe (stack de observabilidade NOC) não sobe nó, então não os exige.
    required: [scenario, environment, mode, topology, frontendHost, adminUsers]
    properties:
      scenario: { const: "b" }
      environment: { enum: [local] }          # staging/prod rejeitados nesta fase
      mode: { enum: [found-hub, found-spoke, join, observe] }
      topology:
        type: object
        required: [role]
        properties:
          role: { enum: [hub, central-bank, commercial-bank, noc] }
      displayName: { type: string }
      hub:
        type: object
        required: [chainId, currency]
        properties:
          chainId: { type: integer }
          currency: { type: array, items: { type: string }, minItems: 1 }
      spoke:
        type: object
        required: [id, chainId, currency]
        properties:
          id: { type: string, minLength: 1 }
          chainId: { type: integer }
          currency: { type: string }
      hubBundleRef: { type: string }
      joinBundleRef: { type: string }
      nocBundleRef: { type: string }
      bankId: { type: string }
      pair:
        type: object
        required: [proposerCB, confirmerCB, symbolA, symbolB]
        properties:
          proposerCB: { type: string }
          confirmerCB: { type: string }
          symbolA: { type: string }
          symbolB: { type: string }
      node:
        type: object
        required: [advertisedHost, rpc, ws, p2p, dataDir]
        properties:
          advertisedHost: { type: string, minLength: 1 }
          rpc:  { type: object, required: [port], properties: { port: { type: integer } } }
          ws:   { type: object, required: [port], properties: { port: { type: integer } } }
          p2p:  { type: object, required: [port], properties: { port: { type: integer } } }
          dataDir: { type: string }
          validator: { type: boolean }        # join: true → warning (não erro)
      image: { type: string, minLength: 1 }
      keyProvider: { type: string, pattern: "^kms://" }
      certSource: { type: string, pattern: "^(self-signed(://.*)?|ca://.+)$" }
      relay:
        type: object
        required: [endpoint]
        properties:
          endpoint: { type: string }
          advertisedHost: { type: string }
      cbEndpoint: { type: string }
      # NOC bundle reference (obrigatório em observe; ver allOf).
      # Bloco NOC opcional em qualquer modo (nunca carrega segredos).
      noc:
        type: object
        properties:
          backendURL: { type: string }
          keycloakURL: { type: string }
          launcherURL: { type: string }
          pushIntervalSeconds: { type: integer, minimum: 0 }
          components: { type: array, items: { enum: [BESU, CACTI_RELAY, PALADIN] } }
      frontendHost: { type: string }
      adminUsers:
        type: array
        minItems: 1
        items:
          type: object
          required: [role, username, password]
          properties:
            role: { type: string }
            username: { type: string }
            password: { type: string }
      # Per-entity launcher (distributed A/B entry point). Optional.
      launcher: { type: string, enum: [enable, disable] }
      # Host port for this entity's launcher (one per host; distinct per entity).
      launcherPort: { type: integer, minimum: 1, maximum: 65535 }
    # Regras condicionais por modo (estruturais)
    allOf:
      # Campos de provisionamento de nó: obrigatórios apenas nos modos que sobem
      # um nó Besu. Guardado por `enum` (não `const`) de propósito — o teste de
      # paridade (schema_parity_test.go) só processa cláusulas com mode.const, e
      # a matriz obrigatório/proibido por modo lá é apenas dos campos que
      # DISCRIMINAM o modo, não destes campos estruturais.
      - if:  { properties: { mode: { enum: [found-hub, found-spoke, join] } } }
        then:
          required: [node, image, keyProvider, certSource, relay]
      - if:  { properties: { mode: { const: found-hub } } }
        then:
          required: [hub]
          not: { anyOf: [ {required: [spoke]}, {required: [hubBundleRef]}, {required: [joinBundleRef]}, {required: [bankId]}, {required: [pair]}, {required: [nocBundleRef]} ] }
      - if:  { properties: { mode: { const: found-spoke } } }
        then:
          required: [spoke, hubBundleRef]
          not: { anyOf: [ {required: [hub]}, {required: [joinBundleRef]}, {required: [bankId]}, {required: [nocBundleRef]} ] }
      - if:  { properties: { mode: { const: join } } }
        then:
          required: [spoke, joinBundleRef, bankId]
          not: { anyOf: [ {required: [hub]}, {required: [hubBundleRef]}, {required: [pair]}, {required: [cbEndpoint]}, {required: [nocBundleRef]} ] }
      - if:  { properties: { mode: { const: observe } } }
        then:
          required: [nocBundleRef]
          not: { anyOf: [ {required: [hub]}, {required: [spoke]}, {required: [hubBundleRef]}, {required: [joinBundleRef]}, {required: [bankId]}, {required: [pair]}, {required: [cbEndpoint]} ] }
