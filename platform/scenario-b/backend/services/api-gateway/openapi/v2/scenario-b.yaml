openapi: "3.1.0"
info:
  title: Scenario B Liquidity API
  version: "2.0.0"
  description: >
    API v2 for the Hub-and-Spoke liquidity pool scenario.
    Covers Exact-Output Swap, Bridging (Lock&Mint / Burn&Unlock),
    ZK Compliance, Liquidity Monitoring, Circuit Breaker (asymmetric
    1-of-N pause / 2-of-N resume), and Master Viewing Key oversight
    (2-of-3 quorum, 72h expiry).
servers:
  - url: /
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Keycloak JWT. Realm roles `central_bank` / `commercial_bank` are
        inspected from realm_access.roles by the api-gateway RBAC middleware
        (FR-030 / FR-056).
  schemas:
    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
          enum:
            - SLIPPAGE_LIMIT_EXCEEDED
            - INSUFFICIENT_POOL_LIQUIDITY
            - ZK_VALIDATION_FAILED
            - INSUFFICIENT_ROLE
            - CIRCUIT_BREAKER_HALTED
            - CIRCUIT_BREAKER_RESUME_DISPUTED
            - DISCLOSURE_EXPIRED
            - POSITION_NOT_FOUND
            - RELAYER_EXHAUSTED
            - VALIDATION_ERROR
            - INTERNAL_ERROR
        message:
          type: string
        trace_id:
          type: string
    PoolPair:
      type: string
      description: Canonical pool pair identifier, e.g. "BRL-USD".
      example: BRL-USD
    Amount:
      type: string
      description: Decimal string (no floating point) for cross-chain safety.
      example: "1000000"
    QuoteResponse:
      type: object
      required: [pair, amount_out, required_input, price_impact, quote_timestamp]
      properties:
        pair:
          $ref: '#/components/schemas/PoolPair'
        amount_out:
          $ref: '#/components/schemas/Amount'
        required_input:
          $ref: '#/components/schemas/Amount'
        price_impact:
          type: string
          example: "0.0032"
        quote_timestamp:
          type: integer
          format: int64
    SwapRequest:
      type: object
      required: [pair, amount_out, max_amount_in, payer_id, beneficiary_id, zk_pointer_payer, zk_pointer_beneficiary]
      properties:
        pair:
          $ref: '#/components/schemas/PoolPair'
        amount_out:
          $ref: '#/components/schemas/Amount'
        max_amount_in:
          $ref: '#/components/schemas/Amount'
        payer_id:
          type: string
        beneficiary_id:
          type: string
        zk_pointer_payer:
          type: string
        zk_pointer_beneficiary:
          type: string
    SwapResponse:
      type: object
      required: [order_id, state, amount_in_final, tx_hash]
      properties:
        order_id:
          type: string
        state:
          type: string
          enum: [PENDING, SUBMITTED, CONFIRMING, COMPLETED, FAILED]
        amount_in_final:
          $ref: '#/components/schemas/Amount'
        tx_hash:
          type: string
        submitted_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
    PoolStatusResponse:
      type: object
      required: [pair, reserve_a, reserve_b, current_ratio, imbalance_flag, updated_at]
      properties:
        pair:
          $ref: '#/components/schemas/PoolPair'
        reserve_a:
          $ref: '#/components/schemas/Amount'
        reserve_b:
          $ref: '#/components/schemas/Amount'
        current_ratio:
          type: string
        imbalance_flag:
          type: boolean
        updated_at:
          type: string
          format: date-time
    LiquidityAddRequest:
      type: object
      required: [pair, provider_bank_id, token_a_amount, token_b_amount]
      properties:
        pair:
          $ref: '#/components/schemas/PoolPair'
        provider_bank_id:
          type: string
        token_a_amount:
          $ref: '#/components/schemas/Amount'
        token_b_amount:
          $ref: '#/components/schemas/Amount'
    LiquidityRemoveRequest:
      type: object
      required: [pool_pair, provider_bank_id, lp_id]
      properties:
        pool_pair:
          $ref: '#/components/schemas/PoolPair'
        provider_bank_id:
          type: string
        lp_id:
          type: string
        fraction_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: >
            Fraction of the position to withdraw, in basis points (10000 = 100%).
            Omitted or 0 means a full withdrawal (the position is marked WITHDRAWN).
            A partial value (0 < fraction_bps < 10000) burns only that fraction of the
            recorded shares and leaves the position ACTIVE with the remainder; the
            response withdrawal_mode is then SHARES_HOME_CURRENCY_PARTIAL.
    LiquidityPositionResponse:
      type: object
      required: [lp_id, provider_bank_id, pool_pair, lp_shares]
      properties:
        lp_id:
          type: string
        provider_bank_id:
          type: string
        pool_pair:
          $ref: '#/components/schemas/PoolPair'
        token_a_contributed:
          $ref: '#/components/schemas/Amount'
        token_b_contributed:
          $ref: '#/components/schemas/Amount'
        lp_shares:
          $ref: '#/components/schemas/Amount'
        deposit_side:
          type: string
          enum: [A, B, BOTH]
          description: "A or B for cooperative single-sided positions; BOTH for legacy dual-sided."
        shares_percentage:
          type: number
          format: float
          description: "Dynamic LP share (0–100%). Null for legacy BOTH positions."
        withdrawal_mode:
          type: string
          enum: [LEGACY, PROPORTIONAL]
        fee_claim_paid:
          $ref: '#/components/schemas/Amount'
        added_at:
          type: string
          format: date-time
        withdrawn_at:
          type: string
          format: date-time
    # 005-cooperative-liquidity: commit-reveal schemas
    CommitSide:
      type: string
      enum: [A, B]
      description: "A = TOKEN_A (e.g. BRL); B = TOKEN_B (e.g. USD)"
    CommitStatus:
      type: string
      enum: [PENDING, MATCHED, EXECUTED, EXPIRED, RECONCILIATION_REQUIRED]
    PoolStatus:
      type: string
      enum: [EMPTY, PENDING_COUNTERPART, ACTIVE]
    LiquidityCommitRequest:
      type: object
      required: [pool_pair, provider_id, side, amount]
      properties:
        pool_pair:
          $ref: '#/components/schemas/PoolPair'
        provider_id:
          type: string
          description: "Identifier of the liquidity provider (CB or MLP)."
        side:
          $ref: '#/components/schemas/CommitSide'
        amount:
          $ref: '#/components/schemas/Amount'
    LiquidityCommitResponse:
      type: object
      properties:
        commit_id:
          type: string
          format: uuid
        pool_pair:
          $ref: '#/components/schemas/PoolPair'
        side:
          $ref: '#/components/schemas/CommitSide'
        amount:
          $ref: '#/components/schemas/Amount'
        status:
          $ref: '#/components/schemas/CommitStatus'
        expires_at:
          type: string
          format: date-time
    BridgeLockMintRequest:
      type: object
      required: [spoke_network, native_asset, amount, owner_bank_id]
      properties:
        spoke_network:
          type: string
          example: spoke-a
        native_asset:
          type: string
        amount:
          $ref: '#/components/schemas/Amount'
        owner_bank_id:
          type: string
        tx_id:
          type: string
          description: 32-byte hex identifier used for on-chain idempotency.
    BridgeBurnUnlockRequest:
      type: object
      required: [position_id]
      properties:
        position_id:
          type: string
    BridgedPositionResponse:
      type: object
      required: [position_id, owner_bank_id, spoke_network, bridge_state]
      properties:
        position_id:
          type: string
        owner_bank_id:
          type: string
        spoke_network:
          type: string
        native_asset:
          type: string
        mirrored_asset:
          type: string
        mirrored_amount:
          $ref: '#/components/schemas/Amount'
        bridge_state:
          type: string
          enum: [LOCKING, ACTIVE, BURNING, RELEASED, RECONCILIATION_REQUIRED]
        relayer_retries:
          type: integer
        first_attempt_at:
          type: string
          format: date-time
        last_attempt_at:
          type: string
          format: date-time
    CircuitBreakerPauseRequest:
      type: object
      required: [bank_id, reason_code, signature]
      properties:
        bank_id:
          type: string
        reason_code:
          type: string
        signature:
          type: string
          description: Hex-encoded signature produced by the central bank wallet.
    CircuitBreakerResumeRequest:
      type: object
      required: [bank_id, signature]
      properties:
        bank_id:
          type: string
        signature:
          type: string
    CircuitBreakerResumeSignRequest:
      type: object
      required: [request_id, bank_id, signature]
      properties:
        request_id:
          type: string
        bank_id:
          type: string
        signature:
          type: string
    CircuitBreakerStatus:
      type: object
      required: [pool_pair, circuit_breaker_state, resume_signatures_required]
      properties:
        pool_pair:
          $ref: '#/components/schemas/PoolPair'
        circuit_breaker_state:
          type: string
          enum: [LIVE, HALTED, RESUME_PENDING]
        resume_request_id:
          type: string
        resume_signatures_required:
          type: integer
        resume_signatures_collected:
          type: integer
        updated_at:
          type: string
          format: date-time
    DisclosureRequest:
      type: object
      required: [tx_ref, requestor_bank_id]
      properties:
        tx_ref:
          type: string
        requestor_bank_id:
          type: string
    DisclosureSignRequest:
      type: object
      required: [request_id, signer_bank_id, signature]
      properties:
        request_id:
          type: string
        signer_bank_id:
          type: string
        signature:
          type: string
    DisclosureResponse:
      type: object
      required: [request_id, state, quorum_required, quorum_reached, created_at, expires_at]
      properties:
        request_id:
          type: string
        tx_ref:
          type: string
        state:
          type: string
          enum: [PENDING, APPROVED, DENIED, EXPIRED]
        quorum_required:
          type: integer
        quorum_reached:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Input validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Caller lacks the required realm role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Business-rule violation (e.g. slippage, pool depletion, ZK invalid).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []

paths:
  # --------------------------- US1: AMM Quote / Swap / Pool --------------------------
  /api/v2/amm/quote/exact-output:
    get:
      operationId: getQuoteExactOutput
      summary: Quote required input for an exact-output swap
      description: >
        Returns the `required_input` amount needed to obtain exactly `amount_out`
        of the opposite token in the pool, including the estimated price impact.
        Public endpoint (no RBAC) — performance gate p95 <= 300ms (SC-021).
      tags: [US1 AMM]
      security: []
      parameters:
        - in: query
          name: pair
          required: true
          schema:
            $ref: '#/components/schemas/PoolPair'
        - in: query
          name: amount_out
          required: true
          schema:
            $ref: '#/components/schemas/Amount'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v2/amm/swap/exact-output:
    post:
      operationId: postSwapExactOutput
      summary: Execute an exact-output swap with slippage + ZK-Pointer gates
      description: >
        Executes an exact-output swap enforcing `max_amount_in` (slippage gate),
        ZK-Pointer validation (compliance gate) and Circuit Breaker state.
        Requires realm role `commercial_bank`. Performance gate p95 <= 6s (SC-022).
      tags: [US1 AMM]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapRequest'
      responses:
        "200":
          description: Swap executed (state COMPLETED/CONFIRMING).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          description: Business-rule violation. error_code SLIPPAGE_LIMIT_EXCEEDED, INSUFFICIENT_POOL_LIQUIDITY or ZK_VALIDATION_FAILED (FR-059).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/amm/pool/{pair}/status:
    get:
      operationId: getPoolStatus
      summary: Pool status (reserves, ratio, imbalance flag)
      description: >
        Returns the current reserves, the derived ratio and the 70/30
        imbalance flag used by the Liquidity Monitor.
      tags: [US1 AMM]
      security: []
      parameters:
        - in: path
          name: pair
          required: true
          schema:
            $ref: '#/components/schemas/PoolPair'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolStatusResponse'
        "404":
          $ref: '#/components/responses/NotFound'

  # --------------------------- US2: Liquidity Provision -----------------------------
  /api/v2/amm/liquidity/add:
    post:
      operationId: postAddLiquidity
      summary: Provide liquidity to a pool (LP role)
      tags: [US2 Liquidity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiquidityAddRequest'
      responses:
        "200":
          description: Position created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityPositionResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /api/v2/amm/liquidity/remove:
    post:
      operationId: postRemoveLiquidity
      summary: Withdraw liquidity from a pool (LP role)
      tags: [US2 Liquidity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiquidityRemoveRequest'
      responses:
        "200":
          description: Withdrawal executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiquidityPositionResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  # --------------------------- US2: Bridge Lock / Burn / Positions ------------------
  /api/v2/bridge/lock-mint:
    post:
      operationId: postLockMint
      summary: Lock native assets on a Spoke and mint the mirrored asset on the Hub
      description: >
        Creates a BridgedAssetPosition in LOCKING state and enqueues a
        Relayer item (FR-029/FR-031). Requires realm role `commercial_bank`.
      tags: [US2 Bridge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeLockMintRequest'
      responses:
        "202":
          description: Position created and relayer notification dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgedPositionResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /api/v2/bridge/burn-unlock:
    post:
      operationId: postBurnUnlock
      summary: Burn the mirrored asset on the Hub and unlock native on the Spoke
      tags: [US2 Bridge]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeBurnUnlockRequest'
      responses:
        "202":
          description: Burn registered; Unbridging dispatched to the Relayer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgedPositionResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/v2/bridge/positions:
    get:
      operationId: listBridgePositions
      summary: List BridgedAssetPositions (optionally filtered by state)
      tags: [US2 Bridge]
      parameters:
        - in: query
          name: state
          schema:
            type: string
            enum: [LOCKING, ACTIVE, BURNING, RELEASED, RECONCILIATION_REQUIRED]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BridgedPositionResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  # --------------------------- US3: Circuit Breaker (asymmetric) --------------------
  /api/v2/governance/circuit-breaker/pause:
    post:
      operationId: postCircuitBreakerPause
      summary: Emergency pause (1-of-N Central Bank)
      description: >
        Executes the asymmetric Circuit Breaker pause (FR-030/FR-044): a single
        authorized Central Bank halts the AMM. The ResumeProposal flow is
        required to resume. Requires realm role `central_bank`.
      tags: [US3 Governance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CircuitBreakerPauseRequest'
      responses:
        "200":
          description: Halted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircuitBreakerStatus'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /api/v2/governance/circuit-breaker/resume-request:
    post:
      operationId: postCircuitBreakerResumeRequest
      summary: Propose resume (1st signature, 2-of-N quorum required)
      tags: [US3 Governance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CircuitBreakerResumeRequest'
      responses:
        "200":
          description: Proposal registered (state RESUME_PENDING).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircuitBreakerStatus'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v2/governance/circuit-breaker/resume-sign:
    post:
      operationId: postCircuitBreakerResumeSign
      summary: Sign existing resume proposal (auto-resumes when quorum reached)
      description: >
        Adds a Central Bank signature to an existing resume proposal (Decision 22 / FR-030).
        When `resume_signatures_collected >= resume_signatures_required` (quorum 2-of-N),
        the AMM transitions automatically to `LIVE` in the same response — no separate
        `executeResume` endpoint exists. Partial signatures (quorum not yet reached) return
        `circuit_breaker_state: "RESUME_PENDING"`. Requires realm role `central_bank`.
      tags: [US3 Governance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CircuitBreakerResumeSignRequest'
      responses:
        "200":
          description: >
            Signature registered. Two possible outcomes encoded in `circuit_breaker_state`:
            - `"LIVE"` — quorum reached (`signatures_collected >= signatures_required`); AMM
              resumed automatically in this response (Decision 22 / FR-030).
            - `"RESUME_PENDING"` — quorum not yet reached; additional signatures required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircuitBreakerStatus'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          description: Signature rejected (e.g. duplicate signer). error_code CIRCUIT_BREAKER_RESUME_DISPUTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/governance/circuit-breaker/status:
    get:
      operationId: getCircuitBreakerStatus
      summary: Current Circuit Breaker state (LIVE / HALTED / RESUME_PENDING)
      tags: [US3 Governance]
      security: []
      parameters:
        - in: query
          name: pair
          required: true
          schema:
            $ref: '#/components/schemas/PoolPair'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircuitBreakerStatus'

  # --------------------------- US3: Master Viewing Key (Oversight) ------------------
  /api/v2/oversight/disclosure-request:
    post:
      operationId: postDisclosureRequest
      summary: Open a Master Viewing Key disclosure request (72h window)
      description: >
        Opens a new DisclosureRequest with `expires_at = now + 72h` (FR-035).
        Requires realm role `central_bank`.
      tags: [US3 Oversight]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisclosureRequest'
      responses:
        "200":
          description: Request created (state PENDING).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclosureResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /api/v2/oversight/disclosure-sign:
    post:
      operationId: postDisclosureSign
      summary: Sign disclosure (2-of-3 quorum triggers Paladin disclosure)
      tags: [US3 Oversight]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisclosureSignRequest'
      responses:
        "200":
          description: Signature added; once quorum is reached Paladin is invoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclosureResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "422":
          description: Request expired or other business-rule failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v2/oversight/disclosure-status/{requestID}:
    get:
      operationId: getDisclosureStatus
      summary: Disclosure status (PENDING / APPROVED / DENIED / EXPIRED)
      tags: [US3 Oversight]
      parameters:
        - in: path
          name: requestID
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclosureResponse'
        "404":
          $ref: '#/components/responses/NotFound'
