      summary: Confirm a proposed pair (Central Bank of tokenB)
      operationId: confirmPair
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Pair confirmed / activated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/governance/circuit-breaker/status:
    get:
      tags: [Circuit Breaker]
      summary: Circuit breaker status
      operationId: getV2CircuitBreakerStatus
      responses:
        "200":
          description: Circuit breaker state
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/v2/governance/circuit-breaker/pause:
    post:
      tags: [Circuit Breaker]
      summary: Pause the AMM (1-of-N, Central Bank)
      operationId: pauseCircuitBreaker
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Paused
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/governance/circuit-breaker/resume-request:
    post:
      tags: [Circuit Breaker]
      summary: Propose resume (2-of-N step 1, Central Bank)
      operationId: proposeResume
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Resume proposed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/governance/circuit-breaker/resume-sign:
    post:
      tags: [Circuit Breaker]
      summary: Sign resume (2-of-N step 2, Central Bank)
      operationId: signResume
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Resume signed / executed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/governance/transfer-limits:
    post:
      tags: [Transfer Limits]
      summary: Create a daily transfer limit (Central Bank)
      description: >
        Sets a configurable daily transfer limit for a participant and/or currency.
        Limits are matched by specificity: (participant_id + currency) > (participant_id) >
        (currency) > global. Only the CB that created the limit may list or delete it.
        Requires ROLE_CENTRAL_BANK_SCENARIO_B (cookie auth).
      operationId: createTransferLimit
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_amount]
              properties:
                participant_id:
                  type: string
                  description: >
                    Bank identifier to restrict (e.g. "bank-a"). Empty means "applies to all
                    participants on this spoke".
                  example: "bank-a"
                currency:
                  type: string
                  description: Currency symbol to restrict (e.g. "BRL"). Empty means "all currencies".
                  example: "BRL"
                max_amount:
                  type: string
                  description: Human-readable decimal daily maximum (e.g. "100000.00"). Converted to wei internally.
                  example: "100000.00"
      responses:
        "201":
          description: Transfer limit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferLimitRecord"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: Invalid max_amount value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [Transfer Limits]
      summary: List active transfer limits (Central Bank)
      description: >
        Returns all active transfer limits created by the authenticated CB.
        Requires ROLE_CENTRAL_BANK_SCENARIO_B (cookie auth).
      operationId: listTransferLimits
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Active transfer limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  limits:
                    type: array
                    items: { $ref: "#/components/schemas/TransferLimitRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v2/governance/transfer-limits/{id}:
    delete:
      tags: [Transfer Limits]
      summary: Delete a transfer limit (Central Bank)
      description: >
        Removes a transfer limit by ID. Only the CB that created the limit may delete it.
        Requires ROLE_CENTRAL_BANK_SCENARIO_B (cookie auth). Returns 204 on success.
      operationId: deleteTransferLimit
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Transfer limit ID (UUID)
      responses:
        "204":
          description: Transfer limit deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Limit exists but cannot be deleted (e.g. belongs to another CB)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v2/oversight/disclosure-request:
    post:
      tags: [Oversight]
      summary: Open a disclosure request (Central Bank)
      operationId: openDisclosure
      security:
        - CookieAuth: []
