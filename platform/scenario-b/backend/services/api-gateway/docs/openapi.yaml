  # ---------------------------------------------------------------------------
  # Internal V1 Payment Relay Endpoints (CB-side only)
  # Protected by X-Relay-Auth shared secret. Called by commercial bank gateways
  # via PaymentProxyHandler → Central Bank. Only registered on CB gateways
  # (PaymentHandler != nil, PaymentProxyHandler == nil).
  # ---------------------------------------------------------------------------

  /internal/v1/payments/deposits/exchange:
    post:
      tags: [AMM Internal]
      summary: Internal relay — fiat exchange (CB only)
      description: >
        Proxied by commercial bank gateways to execute fiat exchange on the Central
        Bank. Requires X-Relay-Auth header (shared secret).
      operationId: internalFiatExchange
      security:
        - RelayAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deposit_id]
              properties:
                deposit_id: { type: string }
      responses:
        "201":
          description: Fiat exchange completed — tCeBM minted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiatExchangeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
