            application/json:
              schema: { $ref: "#/components/schemas/ListDepositsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/v1/payments/escrows:
