[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.20"
evm_version = "paris"
gas_reports = ["*"]
optimizer = true
optimizer_runs = 200
via_ir = true
fuzz = { runs = 10000 }

[profile.ci]

[profile.besu]

[lint]
ignore = ["test/*"]

[dependencies]
forge-std = "1.15.0"
"@openzeppelin-contracts" = "5.0.2"

[rpc_endpoints]
besu = '${BESU_RPC_URL}'

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
