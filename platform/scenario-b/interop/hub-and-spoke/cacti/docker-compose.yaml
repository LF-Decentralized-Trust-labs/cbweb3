services:
  cacti-liquidity-relay:
    build:
      context: ../../..
      dockerfile: interop/hub-and-spoke/cacti/Dockerfile
    image: cbweb3/cacti-liquidity-relay:local
    pull_policy: build
    container_name: "cbweb3-cacti-liquidity-relay"
    env_file:
      - path: .env
        required: false  # populated by contracts.sync-addresses; uses inline defaults until then
    environment:
      # Spoke-A: Besu RPC
      SPOKE_A_BESU_RPC: "${SPOKE_A_BESU_RPC:-http://host.docker.internal:8645}"
      SPOKE_A_BESU_WS: "${SPOKE_A_BESU_WS:-ws://host.docker.internal:8655}"
      # Spoke-B: Besu RPC
      SPOKE_B_BESU_RPC: "${SPOKE_B_BESU_RPC:-http://host.docker.internal:8745}"
      SPOKE_B_BESU_WS: "${SPOKE_B_BESU_WS:-ws://host.docker.internal:8755}"
      # Cacti REST API port
      CACTI_API_PORT: "${CACTI_API_PORT:-4000}"
      # Poll interval in milliseconds
      POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-3000}"
      # LiquidityCommitWatcher configuration (Scenario B)
      LIQUIDITY_COMMIT_REGISTRY_ADDRESS: "${LIQUIDITY_COMMIT_REGISTRY_ADDRESS:-}"
      # Comma-separated list of gateway internal base URLs the watcher notifies on CommitMatched.
      # e.g. "http://host.docker.internal:38080,http://host.docker.internal:60080"
      GATEWAY_INTERNAL_URLS: "${GATEWAY_INTERNAL_URLS:-}"
      # Shared secret for X-Relay-Auth when calling internal gateway endpoints
      INTERNAL_RELAY_AUTH_SECRET: "${INTERNAL_RELAY_AUTH_SECRET:-cbweb3-relay-shared-secret}"
      HUB_BESU_RPC: "${HUB_BESU_RPC:-http://host.docker.internal:8645}"
      LCR_WATCHER_START_BLOCK: "${LCR_WATCHER_START_BLOCK:-0}"
      # 009-commercial-cross-currency-swap: CrossCurrencySwapRelay — CB-B gateway URL.
      # Set to the internal URL of CB-B's api-gateway so the relay can forward bridge-out
      # notifications from CB-A to CB-B.
      # e.g. "http://host.docker.internal:60080"
      CB_B_GATEWAY_URL: "${CB_B_GATEWAY_URL:-}"
    ports:
      - "${CACTI_API_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
