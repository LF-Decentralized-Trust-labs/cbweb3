services:
  cacti-liquidity-relay:
    build:
      context: ../../..
      dockerfile: interop/hub-and-spoke/cacti/Dockerfile
    image: cbweb3/cacti-liquidity-relay:local
    pull_policy: build
    container_name: "cbweb3-cacti-liquidity-relay"
    env_file:
      - path: .env
        required: false  # populated by contracts.sync-addresses; uses inline defaults until then
    environment:
      # TK-B5: dynamic N-spokes — the relay boots NEUTRAL (no fixed SPOKE_A/B).
      # Spokes register at runtime (POST /api/v1/spokes) and persist here.
      RELAY_STORE_PATH: "${RELAY_STORE_PATH:-/data/relay-spokes.json}"
      # Optional boot seed (JSON array); empty by default.
      SPOKES_JSON: "${SPOKES_JSON:-}"
      # Cacti REST API port
      CACTI_API_PORT: "${CACTI_API_PORT:-7000}"
      # Poll interval in milliseconds
      POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-3000}"
      # LiquidityCommitWatcher configuration (Scenario B)
      LIQUIDITY_COMMIT_REGISTRY_ADDRESS: "${LIQUIDITY_COMMIT_REGISTRY_ADDRESS:-}"
      # Comma-separated list of gateway internal base URLs the watcher notifies on CommitMatched.
      # e.g. "http://host.docker.internal:38080,http://host.docker.internal:60080"
      GATEWAY_INTERNAL_URLS: "${GATEWAY_INTERNAL_URLS:-}"
      # Shared secret for X-Relay-Auth when calling internal gateway endpoints
      INTERNAL_RELAY_AUTH_SECRET: "${INTERNAL_RELAY_AUTH_SECRET:-cbweb3-relay-shared-secret}"
      # Hub Besu RPC — the LiquidityCommitWatcher and the cross-currency bridge-out
      # circuit-breaker gate (isPaused() on the pair's AMM) read the HUB, not a spoke.
      # The sample hub listens on 33845 (Scenario B host ports shifted +25000
      # so both scenarios coexist on one host).
      HUB_BESU_RPC: "${HUB_BESU_RPC:-http://host.docker.internal:33845}"
      LCR_WATCHER_START_BLOCK: "${LCR_WATCHER_START_BLOCK:-0}"
      # Durable path for the watcher's block watermark + delivered-event set. MUST live on the
      # /data volume: on the ephemeral default (/tmp) a rebuild recreates the container, the
      # watermark is lost, and the watcher rescans from block 0 re-forwarding every historical
      # CommitMatched (duplicate liquidity execution — finding R2-H-11).
      LCR_WATCHER_STORE_PATH: "${LCR_WATCHER_STORE_PATH:-/data/lcr-watcher-store.json}"
      # Cross-currency bridge-out (TK-B5): destination resolved per request by
      # lookup of `spoke_out` in the dynamic registry — no fixed CB_B_GATEWAY_URL.
      # Before forwarding, the relay reads isPaused() on-chain on `amm_address`.
    ports:
      - "${CACTI_API_PORT:-7000}:${CACTI_API_PORT:-7000}"
    volumes:
      - relay_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  relay_data:
    name: "${RELAY_VOLUME_PREFIX:-cbweb3-relay}_data"
