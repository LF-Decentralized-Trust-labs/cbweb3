# yaml-language-server: $schema=../../provisioning/schema/v1/participant-deployment.schema.yaml
#
# Banco central do Brasil — funda o spoke brasileiro (spoke-brl).
# mode: found  → este nó é o bootnode, faz deploy dos contratos do spoke e
#                emite o join bundle (samples/bundles/spoke-brl.bundle.yaml).
apiVersion: cbweb3/v1
kind: ParticipantDeployment
metadata:
  name: central-bank-brazil
spec:
  scenario: a
  environment: local
  role: central-bank
  mode: found
  spoke:
    id: spoke-brl
    chainId: 1337
    currency: BRL
  node:
    advertisedHost: cbweb3-spoke-brl-besu.central-bank-brazil
    rpc:
      port: 8645
    ws:
      port: 8655
    p2p:
      port: 31303
    dataDir: /opt/cbweb3/data/central-bank-brazil
  image: build
  keyProvider: kms://local-emulator
  certSource: self-signed
  # Relay Cacti local (RL-1). O passo register-relay e obrigatorio (hard): o relay
  # precisa estar no ar ANTES do apply. Suba-o com provisioning/scripts/start-cacti.sh.
  # O toolkit roda no host, entao usa a porta publicada (localhost:4000).
  relay:
    endpoint: http://localhost:4000
  # Endpoint de credential-request do CB, embutido no join bundle para que os
  # bancos comerciais saibam onde submeter o CSR (mode: join).
  cbEndpoint: http://cbweb3-api-gateway.central-bank-brazil:8080/api/v1/onboarding/credential-request
  # Operadores humanos (login por papel via ROPC). Substituem o login por
  # client_credentials nos portais — o token passa a carregar identidade real
  # (auditoria). Obrigatório: um por papel hospedado pela entidade.
  # FUTURO: senha deve vir de um secret store (não do manifesto) em staging/prod.
  adminUsers:
    - role: ROLE_GOVERNANCE
      username: admin@brasil.governance.gov
      password: brasil-governance-local
    - role: ROLE_TREASURY
      username: admin@brasil.treasury.gov
      password: brasil-treasury-local
    - role: noc-admin
      username: admin@brasil.noc.gov
      password: brasil-noc-local
