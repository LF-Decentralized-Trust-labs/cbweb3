# yaml-language-server: $schema=../../provisioning/schema/v1/participant-deployment.schema.yaml
# Scenario A — NOC (Network Operations Center) DATA PLANE for spoke-brl.
#
# The NOC PORTAL is already built + deployed by central-bank-brazil's `found`
# (its 4th frontend, on http://localhost:32645, pointing VITE_NOC_BACKEND_URL at
# http://localhost:28645). This observe run adds only the control-plane DATA PLANE
# — Postgres + noc-backend on :28645 in its own docker network — plus the founding
# CB's noc-agent. It runs NO on-chain node.
#
# Login: the portal uses central-bank-brazil's cbweb3 Keycloak realm + cbweb3-noc
# client and the ROLE_NOC_ADMIN user provisioned by that CB's found
# (admin@brasil.noc.gov).
#
# Single-host note: the NOC backend port (28645) is fixed (one NOC per host), so
# these samples stand up ONE NOC (Brazil). central-bank-colombia's NOC portal
# (:32745) points at the same :28645 backend; a second, distinct NOC needs a
# separate host (see deploy-lnet/) or per-entity NOC ports.
#
# Because the session is a cookie, every one of those portals has to be named in
# spec.noc.portalOrigins below — sharing the backend is not enough on its own.
apiVersion: cbweb3/v1
kind: ParticipantDeployment
metadata:
  name: noc-brazil
spec:
  scenario: a
  environment: local
  role: noc
  mode: observe
  displayName: NOC — spoke-brl
  # NOC bundle emitted by central-bank-brazil (found) and copied into samples/bundles/
  # by deploy-all-with-noc.sh. Resolved relative to this manifest's directory.
  nocBundleRef: ../bundles/spoke-brl.noc.bundle.yaml
  # Optional tuning; the agent defaults to a 15s push cadence and all bundle
  # components. Scenario A's NOC bundle carries the CB Besu node only.
  noc:
    pushIntervalSeconds: 15
    components: [BESU]
    # Browser origins allowed to log in to this backend.
    #
    # Every CB portal on this host points at THIS backend (:28645), and the NOC session is
    # a cookie: a browser demands an exact origin match and refuses to send credentials to
    # a wildcard. An unlisted portal logs in and is then anonymous on every request, with
    # no error to explain it — so each portal any sample script may publish is named here,
    # not just Brazil's. Each is <CB Besu RPC port> + 24000 (see toolkit ports.go).
    portalOrigins:
      - http://localhost:32645   # central-bank-brazil     (8645) — deploy-all.sh, deploy-three.sh
      - http://localhost:32745   # central-bank-colombia   (8745) — deploy-three.sh
      - http://localhost:32845   # central-bank-argentina  (8845) — deploy-three.sh
      - http://localhost:32945   # central-bank-costa-rica (8945) — deploy-all.sh
    # Realm the BACKEND performs the password grant against (it moved off the browser when
    # the session became an HttpOnly cookie). central-bank-brazil's Keycloak: its Besu RPC
    # port + 16000. Unused while the stack runs with NOC_SKIP_AUTH=true (the default), and
    # what NOC_SKIP_AUTH=false needs in order to be reachable at all. The toolkit rewrites
    # "localhost" to host.docker.internal, because the grant now runs inside a container.
    keycloakURL: http://localhost:24645
