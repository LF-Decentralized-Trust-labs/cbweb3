# yaml-language-server: $schema=../../provisioning/schema/v1/participant-deployment.schema.yaml
#
# Segundo banco comercial brasileiro (ilustrativo) — junta-se ao spoke-brl.
# mode: join  → consome o mesmo join bundle do central-bank-brazil.
apiVersion: cbweb3/v1
kind: ParticipantDeployment
metadata:
  name: bank-bradesco
spec:
  scenario: a
  environment: local
  role: commercial-bank
  mode: join
  bankId: bank-bradesco
  displayName: Bradesco
  spoke:
    id: spoke-brl
    chainId: 1337
    currency: BRL
  joinBundleRef: ../bundles/spoke-brl.bundle.yaml
  node:
    advertisedHost: cbweb3-spoke-brl-besu.bank-bradesco
    rpc:
      port: 8647
    ws:
      port: 8657
    p2p:
      port: 31305
    dataDir: cbweb3-data/bank-bradesco
  image: build
  keyProvider: kms://local-emulator
  certSource: self-signed
  # frontendHost (opcional): hostname/IP embutido em VITE_API_URL e VITE_KEYCLOAK_URL
  # no build do frontend. Omitido → "localhost" (só funciona quando o browser roda na
  # mesma máquina do host Docker). Defina um IP/DNS roteável quando o frontend for
  # acessado de uma máquina remota (ex.: uma VM na nuvem com IP público 3.84.201.14).
  # frontendHost: 3.84.201.14
  # Operador do banco (login por papel via ROPC). O nome inclui o spoke (brasil).
  fxPartyRoster:
    - funded_operator@spoke-brl-cb
    - funded_operator@spoke-brl-bank-itau
    - funded_operator@spoke-brl-bank-bradesco
    - funded_operator@spoke-cop-cb
    - funded_operator@spoke-cop-bank-bancolombia
    - funded_operator@spoke-cop-bank-davivienda
  adminUsers:
    - role: ROLE_BANK
      username: admin@bradesco.brasil.com
      password: bradesco-bank-local
