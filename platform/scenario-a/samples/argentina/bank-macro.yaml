# yaml-language-server: $schema=../../provisioning/schema/v1/participant-deployment.schema.yaml
#
# Segundo banco comercial argentino (ilustrativo) — junta-se ao spoke-ars.
# mode: join  → consome o mesmo join bundle do central-bank-argentina.
apiVersion: cbweb3/v1
kind: ParticipantDeployment
metadata:
  name: bank-macro
spec:
  scenario: a
  environment: local
  role: commercial-bank
  mode: join
  bankId: bank-macro
  displayName: Banco Macro
  spoke:
    id: spoke-ars
    chainId: 1339
    currency: ARS
  joinBundleRef: ../bundles/spoke-ars.bundle.yaml
  node:
    advertisedHost: cbweb3-spoke-ars-besu.bank-macro
    rpc:
      port: 8847
    ws:
      port: 8857
    p2p:
      port: 31505
    dataDir: cbweb3-data/bank-macro
  image: build
  keyProvider: kms://local-emulator
  certSource: self-signed
  # frontendHost (opcional): hostname/IP embutido em VITE_API_URL e VITE_KEYCLOAK_URL
  # no build do frontend. Omitido → "localhost" (só funciona quando o browser roda na
  # mesma máquina do host Docker). Defina um IP/DNS roteável quando o frontend for
  # acessado de uma máquina remota (ex.: uma VM na nuvem com IP público 3.84.201.14).
  # frontendHost: 3.84.201.14
  # Operador do banco (login por papel via ROPC). O nome inclui o spoke (argentina).
  launcher: enable
  launcherPort: 5196
  adminUsers:
    - role: ROLE_BANK
      username: admin@macro.argentina.com
      password: macro-bank-local
  # Reverse proxy off — these many-entity single-host samples are port-based via the
  # per-entity launcher. Test the proxy separately with proxy-smoke.sh (one entity per host).
  proxy: disable
