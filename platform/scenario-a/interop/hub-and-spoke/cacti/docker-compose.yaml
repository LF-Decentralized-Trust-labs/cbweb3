# Container log rotation. Same 50m x 5 policy the provisioning templates use, and
# it is here for the same incident: Scenario A's Paladin containers reached 96 GB
# because Docker's json-file driver runs uncapped by default.
#
# This file is NOT under provisioning/templates, so the tree-walking half of
# provisioning_log_policy_test.go never saw it — the relay was the one service in a
# live stack still on the unbounded default after that fix. The guard now names this
# path explicitly instead of discovering it, so it cannot fall out of scope again.
#
# The relay is the worst service to leave uncapped: it polls both chains
# continuously, so it writes steadily rather than in bursts.
x-logging: &cbweb3_logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  cacti-htlc-relay:
    build:
      context: ../../..
      dockerfile: interop/hub-and-spoke/cacti/Dockerfile
    image: cbweb3/cacti-htlc-relay:local
    pull_policy: build
    container_name: "cbweb3-cacti-relay"
    env_file:
      - path: .env
        required: false  # populated by contracts.sync-addresses; uses inline defaults until then
    environment:
      # Spokes are NOT statically configured here. The relay is driven entirely by the dynamic
      # spoke registry (POST /api/v1/spokes): each founding central bank registers its spoke at
      # deploy time (toolkit register-relay step), and watchers are reconciled from the persisted
      # registry on startup. To pin static spokes for a standalone test, set CACTI_SPOKES_CONFIG
      # or the legacy SPOKE_A_*/SPOKE_B_* env vars (see spokes-config.ts).
      # Cacti REST API port (consumed by CactiRelay Go adapter)
      CACTI_API_PORT: "${CACTI_API_PORT:-4000}"
      # Shared secret for X-Relay-Auth when calling internal FX endpoints.
      INTERNAL_RELAY_AUTH_SECRET: "${INTERNAL_RELAY_AUTH_SECRET:-cbweb3-relay-shared-secret}"
      # Poll interval in milliseconds
      POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-3000}"
      # Entries retained per journal kind. Dropping one a consumer has not read loses a
      # settlement that only the destination leg's owner can make, so this is headroom for how
      # long an entity may be down. Raise it for heavier traffic rather than rely on the
      # trimmed-through report to catch the loss after the fact.
      JOURNAL_MAX_ENTRIES: "${JOURNAL_MAX_ENTRIES:-10000}"
      # Persistent store path — backed by a named volume so state survives container restarts
      RELAY_STORE_PATH: "/data/cacti-relay-store.json"
      # Dynamic spoke registry (RL-1) — persisted on the same volume
      CACTI_SPOKES_REGISTRY: "/data/cacti-spoke-registry.json"
    volumes:
      - cacti-relay-data:/data
    ports:
      - "${CACTI_API_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: *cbweb3_logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  cacti-relay-data:
