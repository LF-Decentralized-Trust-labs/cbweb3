# Paladin node compose template for a commercial bank (mode: join).
# Brought up by the mode:join engine (feature 033 US2) after the bank's Besu node
# is synced and the bank is registered on-chain. A single Paladin node attaches to
# the spoke's existing external Besu network.
#
# Variables injected by the engine at runtime:
#   SPOKE_ID                — spoke identifier (e.g. "spoke-brl")
#   BANK_ID                 — commercial bank id within the spoke (e.g. "bank-itau")
#   PALADIN_IMAGE           — Paladin Docker image
#   PALADIN_BANK_RPC_PORT   — host port for the bank Paladin HTTP RPC
#   PALADIN_BANK_WS_PORT    — host port for the bank Paladin WebSocket RPC
#   PALADIN_BANK_GRPC_PORT  — host port for the bank Paladin gRPC transport
#   SPOKE_NETWORK_NAME      — external Docker network shared with the spoke Besu stack
#
# STORAGE: config.yaml + tls.{crt,key} live on the named volume
# bank_paladin_config (seeded by step_render_config_join.go / step_gen_tls_join.go
# via engine/dockervolume) — no SPOKE_DATA_DIR bind mount. Mirrors the central-bank
# found-mode template; see the addendum in specs/032-commercial-bank-join/research.md.

# Container log rotation, applied to every service in this file.
#
# Without it Docker's json-file driver has no size cap and no rotation: the
# Scenario A Paladin containers reached 96 GB (~2.4 GB/day) and a full disk takes
# the whole network down. 50m x 5 caps each service at 250 MB.
x-logging: &cbweb3_logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  paladin-bank-data-init:
    logging: *cbweb3_logging
    image: alpine:3.23
    user: "0:0"
    volumes:
      - bank_data:/data/bank
    # Pre-create the Paladin key store directory on the volume and hand it to
    # uid 1000. BOTH halves are load-bearing:
    #   - mkdir: Paladin's filesystem key store does NOT create its own directory.
    #     It fails to boot with "PD020800: Path 'keystore' does not exist" and the
    #     start-paladin step then dies on a health-check timeout. This is what the
    #     removed `/data/keystore` tmpfs entry was silently providing besides the
    #     write permission, and missing it broke a full deploy on 2026-09-03.
    #   - the final chmod 600: the recursive 777 above is the legacy safety net for
    #     root-owned volume content, but the key store now lives inside that tree
    #     and `-seed.key` is private key material Paladin writes 0600. Restoring it
    #     keeps a world-readable seed from being re-created on every bring-up.
    command: ["sh", "-c", "mkdir -p /data/bank/keystore && chmod -R 777 /data/bank && find /data/bank/keystore -type f -exec chmod 600 {} +"]
    restart: "no"

  # Service key is fixed (Compose forbids ${...} in service names); the spoke and
  # bank ids are carried in container_name.
  paladin-bank:
    logging: *cbweb3_logging
    image: ${PALADIN_IMAGE}
    container_name: paladin-${SPOKE_ID}-${BANK_ID}
    user: "${PALADIN_UID:-1000}:${PALADIN_GID:-1000}"
    ports:
      - "${PALADIN_BANK_RPC_PORT}:8548"
      - "${PALADIN_BANK_WS_PORT}:8549"
      - "${PALADIN_BANK_GRPC_PORT}:9000"
    environment:
      - PALADIN_LOG_LEVEL=${PALADIN_LOG_LEVEL:-info}
    volumes:
      # Read-only in practice (Paladin only reads config.yaml/tls.{crt,key} at
      # startup); seeded root-owned 0644/0755 by writeVolumeFile, so no init
      # container is needed for uid 1000 to read it (unlike bank_data below).
      - bank_paladin_config:/etc/paladin
      - bank_data:/data
    tmpfs:
      # /app/jna ONLY — see the long note in the central-bank paladin-compose.yaml.
      # /data/keystore must never be added here: it holds the bip32 seed that
      # derives the salted Pente endorsement identities, a Pente group's endorser
      # set is immutable once written to the base ledger, and a seed regenerated
      # by any container start (a plain `docker restart` suffices) kills every
      # existing group with PenteInvalidEndorser, reported as PD012214.
      # paladin-bank-data-init both creates /data/bank/keystore and makes the tree
      # writable by uid 1000; the mkdir is not optional, because the tmpfs entry
      # was creating the directory too and Paladin's key store creates neither
      # (PD020800 → start-paladin health-check timeout).
      - /app/jna:exec,mode=1777
    networks:
      - spoke_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      paladin-bank-data-init:
        condition: service_completed_successfully
    command: ["/etc/paladin/config.yaml", "engine"]

networks:
  spoke_network:
    name: ${SPOKE_NETWORK_NAME}
    external: true

volumes:
  bank_data:
    name: ${SPOKE_ID}_${BANK_ID}_paladin_data
  bank_paladin_config:
    name: ${SPOKE_ID}_${BANK_ID}_paladin_config
