# Per-entity dedicated infrastructure (feature 034): Postgres + Redis.
# One instance PER ENTITY (not the shared deploy/local/compose.yml). Brought up by
# the start-infra step for both the central bank (found) and commercial banks (join).
# Keycloak is handled separately (strategy: shared | per-entity).
#
# REQUIRED env (set by the engine; no defaults for the discriminating values):
#   ENTITY_INFRA_PREFIX   container-name prefix, e.g. cbweb3-central-bank-brazil
#   ENTITY_NET_NAME       per-entity docker network name
#   POSTGRES_HOST_PORT    host port -> 5432
#   POSTGRES_DB           the entity's database name
#   SPOKE_DATA_DIR        host data dir (unused volume base; named volumes used)
#   POSTGRES_PASSWORD     no fallback; see the note on the service below
#   REDIS_PASSWORD        no fallback; Redis holds the auth service's login nonces
# OPTIONAL: POSTGRES_USER, POSTGRES_IMAGE_TAG, REDIS_IMAGE_TAG
#
# REDIS_HOST_PORT is gone: Redis is no longer published on a host port, since every
# consumer reaches it by container name over ENTITY_NET_NAME.
#
# The two credentials are generated per entity by the engine on first provisioning and
# read back afterwards, so they are not values an operator has to invent. Exporting
# either one overrides it, and an exported value is not written to disk.

services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-17-alpine}
    container_name: ${ENTITY_INFRA_PREFIX:?ENTITY_INFRA_PREFIX is required}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-default}
      # Required, with no fallback: a default ships one password to every deployment
      # that does not set it. `default` used to be that value for every entity.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT is required}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-default} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - entity_net

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    container_name: ${ENTITY_INFRA_PREFIX}-redis
    # The auth service CAN keep its PKI login nonces here — single-use, consumed by a
    # GET+DEL script — and reads REDIS_PASSWORD for it. Today nothing in this scenario
    # sets REDIS_ADDR, so the service falls back to its in-memory store and this
    # instance has no consumer: the password and the removed host port are prophylactic
    # here, not protecting live data. They are still worth setting, because the day
    # REDIS_ADDR is wired the credential must already be in place rather than
    # retrofitted onto a running network. Scenario B does use its Redis, for the
    # relay-auth replay guard as well as nonces.
    #
    # That in-memory fallback is a finding in its own right, not this file's business:
    # with more than one auth replica a nonce spent on one could be replayed against
    # another. Tracked separately.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      # redis-cli reads REDISCLI_AUTH from the environment. Passing --pass on the
      # command line instead would put the password in the container's process list,
      # where `docker top` and any process in the same namespace can read it.
      REDISCLI_AUTH: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    # No host port on purpose: consumers reach this by container name over entity_net.
    # Publishing 6379 only widened the attack surface. For debugging use
    #   docker exec -it <prefix>-redis redis-cli
    healthcheck:
      # Plain `redis-cli ping` answers NOAUTH once a password is set, so the probe has
      # to authenticate or the container never reports healthy.
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - entity_net

networks:
  entity_net:
    name: ${ENTITY_NET_NAME:?ENTITY_NET_NAME is required}
    driver: bridge

volumes:
  pg_data:
    name: ${ENTITY_INFRA_PREFIX}_pg_data
