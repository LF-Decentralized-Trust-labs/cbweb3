# noc-stack (Scenario A, mode:observe) — NOC control plane data plane: db + backend.
# The NOC PORTAL is deployed co-located by the CB's `found` (as a CB frontend); this
# stack adds only the data plane the portal reads from + the agents push to. Own
# network; DB state in a named volume; no secrets embedded.
# Container log rotation, applied to every service in this file.
#
# Without it Docker's json-file driver has no size cap and no rotation: the
# Scenario A Paladin containers reached 96 GB (~2.4 GB/day) and a full disk takes
# the whole network down. 50m x 5 caps each service at 250 MB.
x-logging: &cbweb3_logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  noc-db:
    logging: *cbweb3_logging
    image: "postgres:${NOC_DB_IMAGE_TAG:-15-alpine}"
    container_name: "${NOC_PREFIX:?}-noc-db"
    environment:
      POSTGRES_USER: "${NOC_DB_USER:?}"
      POSTGRES_PASSWORD: "${NOC_DB_PASSWORD:?}"
      POSTGRES_DB: "${NOC_DB_NAME:-noc}"
    volumes:
      - noc_db_data:/var/lib/postgresql/data
    networks:
      - noc_net
    restart: always

  noc-backend:
    logging: *cbweb3_logging
    image: "${NOC_BACKEND_IMAGE:-cbweb3/noc-backend:local}"
    container_name: "${NOC_PREFIX:?}-noc-backend"
    depends_on:
      - noc-db
    environment:
      # Listen on 8080 (container side of the port mapping below).
      NOC_BACKEND_PORT: "8080"
      DATABASE_URL: "postgres://${NOC_DB_USER}:${NOC_DB_PASSWORD}@${NOC_PREFIX}-noc-db:5432/${NOC_DB_NAME:-noc}?sslmode=disable"
      # Keycloak validation stays OFF on the toolkit's local stacks, and the reason is
      # narrower than "prod hardening": the realm is reachable under TWO names —
      # "localhost:<port>" from the host, where the toolkit runs, and
      # "host.docker.internal:<port>" from a container, where this backend runs. Keycloak
      # stamps the token's issuer from whichever name the caller used, and validation
      # compares it exactly, so the toolkit's own token is refused and provisioning fails.
      # Pinning the realm's hostname is the fix and is tracked separately, because it is
      # configuration every portal depends on.
      #
      # Set NOC_SKIP_AUTH=false to run with real validation: login, refresh, logout and the
      # cookie handling all work — only the toolkit's provisioning calls fail.
      NOC_SKIP_AUTH: "${NOC_SKIP_AUTH:-true}"
      KEYCLOAK_URL: "${NOC_KEYCLOAK_URL:-}"
      KEYCLOAK_REALM: "${NOC_KEYCLOAK_REALM:-cbweb3}"
      KEYCLOAK_CLIENT_ID: "${NOC_KEYCLOAK_CLIENT_ID:-noc-portal}"
      # Session cookies over plain HTTP locally. A browser SILENTLY DISCARDS a Secure cookie
      # on an insecure origin, which presents as a login that succeeds and a session that
      # never exists — so this must be false wherever the portal is served over http.
      COOKIE_SECURE: "${NOC_COOKIE_SECURE:-false}"
      # Keys the HMAC binding each CSRF token to its session. Stable per stack: a value that
      # changes on restart refuses every token issued before it, which looks like a browser
      # fault rather than a configuration one.
      CSRF_SECRET: "${NOC_CSRF_SECRET:-}"
      # Must name the portal exactly. NOT "*": a browser refuses to send credentials to a
      # wildcard origin, and the session is a cookie now — a wildcard would let the portal
      # log in and be anonymous on every request afterwards.
      NOC_FRONTEND_ORIGIN: "${NOC_FRONTEND_ORIGIN:?NOC_FRONTEND_ORIGIN must name the portal origin; a wildcard cannot carry credentials}"
    ports:
      - "${NOC_BACKEND_PORT:?}:8080"
    networks:
      - noc_net
    restart: always

networks:
  noc_net:
    name: "${NOC_NET_NAME:?}"

volumes:
  noc_db_data:
    name: "${NOC_VOLUME_PREFIX:?}_noc_db_data"
