services:
  besu-joiner:
    image: hyperledger/besu:25.8.0
    container_name: spk02-besu-joiner
    networks:
      - spk02_join_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_P2P_JOIN:-32306}:30303/tcp"
      - "${HOST_P2P_JOIN:-32306}:30303/udp"
      - "${HOST_RPC_JOIN:-9646}:8545"
      - "${HOST_WS_JOIN:-9656}:8546"
    volumes:
      - ../data/genesis.json:/opt/besu/genesis/genesis.json:ro
      - ../data/key3:/opt/besu/data/key:ro
      - besu_joiner_data:/opt/besu/data
    command:
      - --nat-method=DOCKER
      - --bootnodes=${BOOTNODE_ENODE}
      - --p2p-port=30303
      - --rpc-http-enabled=true
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,QBFT,ADMIN
      - --rpc-ws-enabled=true
      - --rpc-ws-port=8546
      - --rpc-http-host=0.0.0.0
      - --rpc-ws-host=0.0.0.0
      - --host-allowlist=*
      - --rpc-http-cors-origins=all
      - --genesis-file=/opt/besu/genesis/genesis.json
      - --data-path=/opt/besu/data
      - --node-private-key-file=/opt/besu/data/key
      - --min-gas-price=0

  paladin-bx-data-init:
    image: alpine:3.23
    user: "0:0"
    volumes:
      - paladin_bx_data:/data/bx
    # Pre-create the Paladin key store directory on the volume and hand it to
    # uid 1000. BOTH halves are load-bearing:
    #   - mkdir: Paladin's filesystem key store does NOT create its own directory.
    #     It fails to boot with "PD020800: Path 'keystore' does not exist" and the
    #     start-paladin step then dies on a health-check timeout. This is what the
    #     removed `/data/keystore` tmpfs entry was silently providing besides the
    #     write permission, and missing it broke a full deploy on 2026-09-03.
    #   - the final chmod 600: the recursive 777 above is the legacy safety net for
    #     root-owned volume content, but the key store now lives inside that tree
    #     and `-seed.key` is private key material Paladin writes 0600. Restoring it
    #     keeps a world-readable seed from being re-created on every bring-up.
    command: ["sh", "-c", "mkdir -p /data/bx/keystore && chmod -R 777 /data/bx && find /data/bx/keystore -type f -exec chmod 600 {} +"]
    restart: "no"

  paladin-bank-x:
    image: docker.io/lfdecentralizedtrust/paladin:v1.0.0
    container_name: spk02-paladin-bank-x
    networks:
      - spk02_join_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PALADIN_BX_RPC:-9650}:8548"
      - "${HOST_PALADIN_BX_GRPC:-9702}:9000"
    environment:
      - PALADIN_LOG_LEVEL=debug
    volumes:
      - ../data/paladin/bank-x/config.yaml:/etc/paladin/config.yaml:ro
      - ../data/paladin/bank-x/tls.crt:/etc/paladin/tls.crt:ro
      - ../data/paladin/bank-x/tls.key:/etc/paladin/tls.key:ro
      - paladin_bx_data:/data
    tmpfs:
      # /app/jna only. /data/keystore must NOT be mounted here: it holds the
      # bip32 seed that derives the salted Pente endorsement identities, and a
      # Pente group's endorser set is immutable once written to the base ledger.
      # A seed regenerated by a container recreation kills every existing group
      # with PenteInvalidEndorser (surfaced as PD012214). The data-init service
      # chmods the volume root 777, so uid 1000 creates /data/keystore there.
      - /app/jna:exec,mode=1777
    command: ["/etc/paladin/config.yaml", "engine"]
    depends_on:
      paladin-bx-data-init:
        condition: service_completed_successfully
      besu-joiner:
        condition: service_started

networks:
  spk02_join_net:
    name: spk02_join_net
    driver: bridge

volumes:
  besu_joiner_data:
  paladin_bx_data:
