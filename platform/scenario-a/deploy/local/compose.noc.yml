name: noc

services:
  noc-db:
    image: "postgres:15-alpine"
    container_name: "${NOC_DB_CONTAINER_NAME:-cbweb3-noc-db}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${NOC_DB_USER:-noc}"
      POSTGRES_PASSWORD: "${NOC_DB_PASSWORD:-noc}"
      POSTGRES_DB: "${NOC_DB_NAME:-cbweb3_noc}"
    volumes:
      - noc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOC_DB_USER:-noc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cbweb3_network

  noc-backend:
    container_name: "${NOC_BACKEND_CONTAINER_NAME:-cbweb3-noc-backend}"
    build:
      context: ../../backend/services/noc-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${NOC_DB_USER:-noc}:${NOC_DB_PASSWORD:-noc}@${NOC_DB_CONTAINER_NAME:-cbweb3-noc-db}:5432/${NOC_DB_NAME:-cbweb3_noc}?sslmode=disable"
      NOC_BACKEND_PORT: "${NOC_BACKEND_PORT:-8090}"
      KEYCLOAK_URL: "${KEYCLOAK_URL:-http://cbweb3-keycloak:8080}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM:-cbweb3}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID:-cbweb3-noc}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-}"
      NOC_FRONTEND_ORIGIN: "${NOC_FRONTEND_ORIGIN:-http://localhost:5900}"
      NOC_SKIP_AUTH: "${NOC_SKIP_AUTH:-false}"
      AGENT_GRACE_MULTIPLIER: "${AGENT_GRACE_MULTIPLIER:-3}"
    ports:
      - "${NOC_BACKEND_PORT:-8090}:${NOC_BACKEND_PORT:-8090}"
    depends_on:
      noc-db:
        condition: service_healthy
    networks:
      - cbweb3_network

  noc-portal:
    container_name: "${NOC_PORTAL_CONTAINER_NAME:-cbweb3-noc-portal}"
    build:
      context: ../../frontend
      dockerfile: apps/noc/Dockerfile
      args:
        VITE_NOC_BACKEND_URL: "${VITE_NOC_BACKEND_URL:-http://localhost:8090/api/v1}"
        VITE_KEYCLOAK_URL: "${VITE_KEYCLOAK_URL:-http://localhost:8081}"
        VITE_KEYCLOAK_REALM: "${VITE_KEYCLOAK_REALM:-cbweb3}"
        VITE_KEYCLOAK_CLIENT_ID: "${VITE_KEYCLOAK_CLIENT_ID:-cbweb3-noc}"
    restart: unless-stopped
    ports:
      - "${NOC_PORTAL_PORT:-5900}:80"
    depends_on:
      - noc-backend
    networks:
      - cbweb3_network

  noc-agent-spoke-a:
    container_name: "${NOC_AGENT_SPOKE_A_CONTAINER_NAME:-cbweb3-noc-agent-spoke-a}"
    build:
      context: ../../backend/services/noc-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    # Supplementary group for the read-only Docker socket below. The image is non-root
    # (uid 65532, finding R2-M-12) and the socket is root:docker mode 0660, so an
    # unprivileged uid outside that group is denied every log read — and the agent
    # discards that error, so the portal's Log Viewer simply goes empty with nothing in
    # the agent's own output. The toolkit and the NOC make targets compute
    # NOC_DOCKER_GID from the socket itself. The default is the agent's own gid, which
    # grants nothing: the agent then reports the problem at startup rather than
    # collecting no logs in silence.
    group_add:
      - "${NOC_DOCKER_GID:-65532}"
    volumes:
      - ../../interop/hub-and-spoke/noc/agent-configs/spoke-a/agent.yaml:/etc/noc-agent/agent.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - noc-backend
    networks:
      - cbweb3_network
      - spoke_a_besu_network
      - cacti_default

  noc-agent-spoke-b:
    container_name: "${NOC_AGENT_SPOKE_B_CONTAINER_NAME:-cbweb3-noc-agent-spoke-b}"
    build:
      context: ../../backend/services/noc-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    # Supplementary group for the read-only Docker socket below. The image is non-root
    # (uid 65532, finding R2-M-12) and the socket is root:docker mode 0660, so an
    # unprivileged uid outside that group is denied every log read — and the agent
    # discards that error, so the portal's Log Viewer simply goes empty with nothing in
    # the agent's own output. The toolkit and the NOC make targets compute
    # NOC_DOCKER_GID from the socket itself. The default is the agent's own gid, which
    # grants nothing: the agent then reports the problem at startup rather than
    # collecting no logs in silence.
    group_add:
      - "${NOC_DOCKER_GID:-65532}"
    volumes:
      - ../../interop/hub-and-spoke/noc/agent-configs/spoke-b/agent.yaml:/etc/noc-agent/agent.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - noc-backend
    networks:
      - cbweb3_network
      - spoke_b_besu_network
      - cacti_default

volumes:
  noc_db_data:

networks:
  cbweb3_network:
    external: true
  spoke_a_besu_network:
    external: true
  spoke_b_besu_network:
    external: true
  cacti_default:
    external: true
