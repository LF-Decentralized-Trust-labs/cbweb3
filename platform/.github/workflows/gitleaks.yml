name: Secret Scan — gitleaks

# Finding R2-11.3: secret-scan gate.
# Must live DIRECTLY under .github/workflows/ (not a subfolder) so GitHub
# Actions discovers it — see finding R2-11.2 / H-14.

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # Pinned gitleaks release. The MIT-licensed binary needs no GITLEAKS_LICENSE,
  # unlike gitleaks-action@v2, which mandates a license key for organizations.
  GITLEAKS_VERSION: "8.28.0"

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full checkout available if the scan scope is ever widened to history.
          fetch-depth: 0
          persist-credentials: false

      # Download the pinned, MIT-licensed gitleaks binary (linux x64) directly
      # from the official release. No license key required for organizations.
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The job FAILS (gate) when a secret is detected: --exit-code 1 makes
      # gitleaks return 1 on findings. Config (default ruleset + local-dev
      # allowlist) comes from .gitleaks.toml; --redact hides secret values.
      #
      # --no-git scans the checked-out working tree instead of walking the full
      # commit history. This mirrors the scope of the previous gitleaks-action
      # (which scanned only the PR/pushed changes, not all history) and keeps
      # the gate green on pre-existing historical fixtures while still catching
      # any real secret present in the current source.
      - name: Run gitleaks detect
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact --exit-code 1
