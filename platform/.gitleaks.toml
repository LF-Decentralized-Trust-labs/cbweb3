# -----------------------------------------------------------------------------
# Documentation prose misread as a credential.
#
# `generic-api-key` is an entropy heuristic and misfires on the architecture
# tree in scenario-b/README.md, reading the token after "OpenAPI specs," as a
# secret. Exempted by exact VALUE, anchored, so it suppresses one literal string
# and nothing else.
#
# Two narrower-looking forms were tried against gitleaks 8.28.0 and rejected
# because the tool accepts them silently and does not apply them:
#
#   targetRules = ["generic-api-key"]   ignored — the finding still fires.
#   condition = "AND" + paths + regexes ignored — degrades to OR, which blanket-
#                                       exempts the whole README from EVERY rule.
#                                       Verified: a planted AWS key in that file
#                                       went undetected under this form.
#
# Do not reintroduce either without re-running that planted-secret control.
#
# Deliberately NOT pinned by line number: a .gitleaksignore fingerprint is
# `file:rule:line` and would lapse the first time the README is edited, turning
# develop red again. If the prose changes this stops matching and the gate
# re-fires, which is the correct failure direction.
# -----------------------------------------------------------------------------
[[allowlists]]
description = "Docs prose misread as a secret by the generic entropy rule"
regexes = [
  '''^protobuf/gRPC$''',
]
