# gitleaks configuration — cbweb3-platform
#
# Finding R2-11.3 (NFR-OPS-003): secret-scan gate in CI.
# Consumed by .github/workflows/gitleaks.yml.

title = "cbweb3-platform gitleaks config"

[extend]
# Inherit gitleaks' built-in rules (AWS, GCP, Azure, PEM private keys, generic
# high-entropy secrets, etc.). Never replace them — the allowlists below only
# carve out documented exceptions.
useDefault = true

# -----------------------------------------------------------------------------
# Provenance of the exemptions — READ THIS BEFORE ADDING AN ENTRY
# -----------------------------------------------------------------------------
# Production key material is never committed. It is delivered at runtime (env or
# secret manager), and the provisioning toolkit mints per-entity keys in memory
# (KeyProvider / CertSource) without persisting them. Everything exempted below
# is either a well-known PUBLIC development key or a non-secret value that the
# generic high-entropy rule misreads.
#
# The deployed surface of this repository is three scripts:
#
#   scenario-a/samples/deploy-all.sh   single-host Scenario A samples (cbweb3 CLI)
#   scenario-b/samples/deploy-all.sh   single-host Scenario B samples (cbweb3b CLI)
#   deploy-lnet/deploy.sh              multi-host LNET deploy, both scenarios
#
# Each entry below is annotated LIVE or PROVISIONAL against that surface:
#
#   LIVE        the file is read by one of those three scripts, or by the
#               toolkit templates / test suites they invoke. The exemption is
#               settled and stays until the file itself changes.
#
#   PROVISIONAL nothing in the deployed surface reads the file. The exemption
#               keeps the gate green over an asset that is not load-bearing for
#               a deploy, not because the asset is worth keeping. Intended
#               resolution: DELETE the files and shrink this allowlist. A
#               committed private key that no live deploy path consumes is pure
#               liability.
#
#               The `make *.up` half of this backlog is DONE: deploy/local/ and
#               the make targets that referenced it were removed, and the six
#               Besu keys plus the configTemplate.json glob that only that tree
#               contained went with them. What remains below is provisional for
#               a different reason — read its own note.
#
# When you add an entry:
#   - prefer a value in `regexes` over a path glob. A glob exempts the file from
#     EVERY default rule (AWS, GCP, Azure, GitHub/Slack tokens, PEM keys); a
#     value exempts exactly one string.
#   - state which deploy path consumes the file, or state that none does.
#   - if none does, mark it PROVISIONAL and record the removal plan with it.
# -----------------------------------------------------------------------------

[[allowlists]]
description = "Public local-development keys and example env files (not real secrets)"

paths = [
  # PROVISIONAL — SPK-01/SPK-02 provisioning-spike genesis (local dev validators
  # under scenario-a/provisioning/spikes/). Not referenced by any deploy script,
  # but not dead either: the spikes' own genesis-once.sh / env-defaults.sh read
  # it. Removing it means retiring the spikes, which is a separate decision from
  # the deploy/local removal — the keys are local dev validators, not fleet keys.
  '''.*/genesis-config\.json$''',
  # LIVE — committed reference env files. The toolkit renders per-entity env from
  # provisioning/templates/, and these .example copies document that schema.
  # Their high-entropy values are EVM contract addresses and placeholders; the
  # scenario-b private keys were blanked separately (T-P1-26).
  '''.*\.env\.example$''',
  '''.*\.env\..*\.example$''',
  # LIVE — test fixtures. `forge build`/`forge test` and `go test` run against
  # these from the deploy scripts and CI; they deliberately embed fake or public
  # dev keys, JWTs and PEM blocks (e.g. a Foundry test asserting a key is
  # rejected). Inputs to tests, never credentials.
  '''.*_test\.go$''',
  '''.*\.t\.sol$''',
  # LIVE — this config lists the dev keys below as allowlist entries.
  '''\.gitleaks\.toml$''',
]

# Public dev private keys that appear across templates and compose files, listed
# by VALUE so the gate stays strict for every other 64-hex string in the same
# files. The first seven are canonical Besu dev-network keys.
#
# Shrunk when deploy/local/ was removed — the follow-up this file's preamble
# describes ("DELETE the files and shrink this allowlist", blocked only by the
# make targets, which went with it). Six Besu keys and the configTemplate.json
# path glob were dropped because nothing in the tree contains them any more; each
# was verified at 0 occurrences before removal, so this cannot turn the gate red.
# A dead exemption is not neutral: it would silently permit that key to reappear
# anywhere in the repository.
regexes = [
  '''0dbbe8e4ae425a6d2687f1a7e3ba17bc98c673636790f1b8ad91193c05875ef1''',
  '''5b02fc9b19facc6de72b514a03db7f7fbd9f46b6ad6ffb24b8df575593ae87f1''',
  '''8f2a55949038a9610f50fb23b5883af3b4ecb3c3bb792cbcefbd1542c692be63''',
  '''ae6ae8e5ccbfb04590405997ee2d52d2b330726137b875053c36d94e974d162f''',
  '''c87509a1c067bbde78beb793e6fa76530b6382a4c0241e5e4a9ec0a0f44dc0d3''',
  '''c88b703fb08cbea894b6aeff5a544fb92e78a18e19814cd85da83b71f772aa6f''',
  '''f8f8a2f43c8376ccb0871305060d7b27b0554d2cc72bccf41b2705608452f315''',
  # LIVE — well-known PUBLIC Anvil/Hardhat dev account #0 key, seeded into the
  # local KMS emulator so kms://local-emulator resolves to a stable address
  # (scenario-b/toolkit/engine/keyprovider/local.go). Documented there as
  # non-production. Protects no real asset.
  '''ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
]

# -----------------------------------------------------------------------------
# Documentation prose misread as a credential.
#
# `generic-api-key` is an entropy heuristic and misfires on the architecture
# tree in scenario-b/README.md, reading the token after "OpenAPI specs," as a
# secret. Exempted by exact VALUE, anchored, so it suppresses one literal string
# and nothing else.
#
# Two narrower-looking forms were tried against gitleaks 8.28.0 and rejected
# because the tool accepts them silently and does not apply them:
#
#   targetRules = ["generic-api-key"]   ignored — the finding still fires.
#   condition = "AND" + paths + regexes ignored — degrades to OR, which blanket-
#                                       exempts the whole README from EVERY rule.
#                                       Verified: a planted AWS key in that file
#                                       went undetected under this form.
#
# Do not reintroduce either without re-running that planted-secret control.
#
# Deliberately NOT pinned by line number: a .gitleaksignore fingerprint is
# `file:rule:line` and would lapse the first time the README is edited, turning
# develop red again. If the prose changes this stops matching and the gate
# re-fires, which is the correct failure direction.
# -----------------------------------------------------------------------------
[[allowlists]]
description = "Docs prose misread as a secret by the generic entropy rule"
regexes = [
  '''^protobuf/gRPC$''',
]
