services:
  redis:
    image: redis:7-alpine
    container_name: cbweb3-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cbweb3_backend

  postgres:
    image: postgres:17-alpine
    container_name: cbweb3-postgres
    restart: always
    environment:
      POSTGRES_USER: default
      POSTGRES_PASSWORD: default
      POSTGRES_DB: default
    ports:
      - "5432:5432"
    volumes:
      - cbweb3_postgres_data:/var/lib/postgresql/data
    networks:
      - cbweb3_backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: cbweb3-keycloak
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    networks:
      - cbweb3_backend

  compliance:
    image: golang:1.25-alpine
    container_name: cbweb3-compliance
    working_dir: /workspace/backend/services/compliance
    command: ["sh", "-c", "go run ./cmd/compliance"]
    environment:
      COMPLIANCE_GRPC_PORT: "9093"
      POSTGRES_DSN: "postgres://default:default@postgres:5432/default?sslmode=disable"
      # CA_CERT_FILE and CA_KEY_FILE must be mounted for certificate issuance:
      # CA_CERT_FILE: /certs/ca.crt
      # CA_KEY_FILE:  /certs/ca.key
    volumes:
      - ../:/workspace
    ports:
      - "9093:9093"
    depends_on:
      - postgres
    networks:
      - cbweb3_backend

  auth:
    image: golang:1.25-alpine
    container_name: cbweb3-auth
    working_dir: /workspace/backend/services/auth
    command: ["sh", "-c", "go run ./cmd/auth"]
    environment:
      AUTH_GRPC_PORT: "9091"
      KMS_PROVIDER: local
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: cbweb3
      KEYCLOAK_CLIENT_ID: cbweb3-auth
      KEYCLOAK_CLIENT_SECRET: change-me
      KEYCLOAK_JWKS_CACHE_TTL_SEC: "300"
      KEYCLOAK_REQUEST_TIMEOUT_SEC: "10"
      COMPLIANCE_GRPC_ADDR: compliance:9093
      COMPLIANCE_REQUEST_TIMEOUT_SEC: "5"
      REDIS_ADDR: redis:6379
    volumes:
      - ../:/workspace
    ports:
      - "9091:9091"
    depends_on:
      - compliance
      - keycloak
      - redis
    networks:
      - cbweb3_backend

  api-gateway:
    image: golang:1.25-alpine
    container_name: cbweb3-api-gateway
    working_dir: /workspace/backend/services/api-gateway
    command: ["sh", "-c", "go run ./cmd/api-gateway"]
    environment:
      APP_PORT: "8080"
      REQUEST_TIMEOUT_SEC: "5"
      AUTH_GRPC_ADDR: auth:9091
      COMPLIANCE_GRPC_ADDR: compliance:9093
    volumes:
      - ../:/workspace
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - compliance
    networks:
      - cbweb3_backend

volumes:
  cbweb3_postgres_data:

networks:
  cbweb3_backend:
