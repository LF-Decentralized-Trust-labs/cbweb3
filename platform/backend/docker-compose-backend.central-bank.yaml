services:
  compliance-central-bank:
    build:
      context: .
      dockerfile: services/compliance/Dockerfile
    image: cbweb3/compliance:local
    pull_policy: build
    container_name: "backend-compliance-central-bank"
    env_file:
      - path: ./config/.env.infra.central-bank
        required: true
    environment:
      COMPLIANCE_GRPC_PORT: "9093"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-default}:${POSTGRES_PASSWORD:-default}@postgres:5432/${DB_NAME:-cbweb3_central_bank}?sslmode=disable"
    volumes:
      - ./config/pki:/workspace/backend/config/pki
    ports:
      - "39093:9093"
    networks:
      - cbweb3_backend_central_bank
      - cbweb3_network

  auth-central-bank:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    image: cbweb3/auth:local
    pull_policy: build
    container_name: "backend-auth-central-bank"
    env_file:
      - path: ./config/.env.infra.central-bank
        required: true
    environment:
      AUTH_GRPC_PORT: "9091"
      KEYCLOAK_BASE_URL: "${KEYCLOAK_BASE_URL:-http://keycloak:8080}"
      KEYCLOAK_REALM: "${KC_REALM:-central-bank}"
      KEYCLOAK_CLIENT_ID: "${KC_CLIENT_ID:-central-bank-client}"
      KEYCLOAK_CLIENT_SECRET: "${KC_CLIENT_SECRET:-change-me}"
      KEYCLOAK_JWKS_CACHE_TTL_SEC: "3000"
      KEYCLOAK_REQUEST_TIMEOUT_SEC: "10"
      COMPLIANCE_GRPC_ADDR: compliance-central-bank:9093
      COMPLIANCE_REQUEST_TIMEOUT_SEC: "5"
      REDIS_ADDR: "${REDIS_CONTAINER_NAME:-cbweb3-redis}:6379"
      REDIS_DB: "2"
    ports:
      - "39091:9091"
    depends_on:
      - compliance-central-bank
    networks:
      - cbweb3_backend_central_bank
      - cbweb3_network

  api-gateway-central-bank:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: cbweb3/api-gateway:local
    pull_policy: build
    container_name: "backend-api-gateway-central-bank"
    env_file:
      - path: ./config/.env.infra.central-bank
        required: true
    environment:
      APP_PORT: "8080"
      REQUEST_TIMEOUT_SEC: "30"
      AUTH_GRPC_ADDR: auth-central-bank:9091
      COMPLIANCE_GRPC_ADDR: compliance-central-bank:9093
      PKI_DIR: /workspace/backend/config/pki
    volumes:
      - ./config/pki:/workspace/backend/config/pki
    ports:
      - "38080:8080"
    depends_on:
      - auth-central-bank
      - compliance-central-bank
    networks:
      - cbweb3_backend_central_bank
      - cbweb3_network

networks:
  cbweb3_backend_central_bank:
  cbweb3_network:
    external: true
