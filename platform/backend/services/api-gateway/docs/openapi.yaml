openapi: 3.0.3
info:
  title: CBWeb3 API Gateway
  version: 2.0.0
  description: >
    OpenAPI specification for the CBWeb3 platform API Gateway.
    Implements authentication, participant onboarding, KYC/AML compliance,
    and governance operations over the identity service (Keycloak + KMS).
    
    Security note: All /compliance write endpoints require CENTRAL_BANK role.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Health
    description: Service health endpoint
  - name: Authentication
    description: Login, refresh, logout and onboarding
  - name: Compliance
    description: KYC credential issuance, verification, AML screening, and governance
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate client credentials and obtain access + refresh tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Issue a new access token from a valid refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid or expired refresh token"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current access token (logout)
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "logged out successfully"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/onboarding:
    post:
      tags: [Authentication]
      summary: >
        Register a new participant. Enforces KYC gate for non-Central Bank actors.
        Central Bank actors bypass the KYC gate.
      operationId: onboarding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "201":
          description: Participant registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResponse"
        "202":
          description: Awaiting Central Bank KYC approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "awaiting central bank approval"
                  subject:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: KYC status is not eligible (FROZEN, REVOKED, REJECTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Participant already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/wallet/bind:
    post:
      tags: [Authentication]
      summary: "[REMOVED] Wallet bind endpoint"
      description: >
        This endpoint was removed. Wallet binding now happens internally during
        onboarding in the identity service.
      operationId: walletBind
      deprecated: true
      security:
        - BearerAuth: []
      responses:
        "410":
          description: Endpoint removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
              example:
                error: "wallet bind endpoint has been removed"
                code: "GONE"

  /compliance/kyc/status/{subject}:
    get:
      tags: [Compliance]
      summary: Get KYC lifecycle status for a subject
      operationId: getKycStatus
      security:
        - BearerAuth: []
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
          description: The userID or participant identifier
      responses:
        "200":
          description: KYC status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KYCStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /compliance/kyc/issue-credential:
    post:
      tags: [Compliance]
      summary: >
        Issue a Verifiable Credential (VC) for a participant.
        Currently not implemented.
      operationId: issueKycCredential
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueCredentialRequest"
      responses:
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
              example:
                error: "KYC credential issuance is not yet available"
                code: "NOT_IMPLEMENTED"

  /compliance/kyc/verify-proof:
    post:
      tags: [Compliance]
      summary: Verify a ZKP pointer
      operationId: verifyKycProof
      security:
        - BearerAuth: []
      responses:
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
              example:
                error: "KYC proof verification is not yet available"
                code: "NOT_IMPLEMENTED"

  /compliance/aml/screen:
    post:
      tags: [Compliance]
      summary: >
        AML/CFT screening gate — checks if a subject is sanctioned.
        Returns 403 if FROZEN, REVOKED, or REJECTED (REQ-COM-007).
      operationId: amlScreen
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject:
                  type: string
      responses:
        "200":
          description: Subject is not sanctioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AMLScreenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Subject is sanctioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AMLScreenResponse"

  /compliance/participants/provision:
    post:
      tags: [Compliance]
      summary: >
        Set KYC status for a participant (CENTRAL_BANK only).
        Used for initial approval, freeze, unfreeze, and revocation.
      operationId: provisionParticipant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionRequest"
      responses:
        "200":
          description: Participant provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /compliance/accounts/freeze:
    post:
      tags: [Compliance]
      summary: >
        Freeze an account (CENTRAL_BANK only — REQ-COM-003, UT-API-16).
        Sets KYC status to FROZEN — all operations are suspended.
      operationId: freezeAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject:
                  type: string
      responses:
        "200":
          description: Account frozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /compliance/accounts/unfreeze:
    post:
      tags: [Compliance]
      summary: Restore a frozen account to APPROVED status (CENTRAL_BANK only)
      operationId: unfreezeAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject:
                  type: string
      responses:
        "200":
          description: Account unfrozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by the identity service. Includes enriched claims:
        sub, roles, did, wallet, country, bank_id, privacy_group (D7 §7.4).

  responses:
    BadRequest:
      description: Invalid body or missing required fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions (requires CENTRAL_BANK role)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "insufficient permissions"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ErrorCodeResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    LoginRequest:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId:
          type: string
          example: bank-a
        clientSecret:
          type: string
          format: password
          example: secret-a

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 3600
        tokenType:
          type: string
          example: Bearer

    OnboardingRequest:
      type: object
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: BR
        bank_code:
          type: string
          example: "001"
        role:
          type: string
          enum: [CENTRAL_BANK, COMMERCIAL_BANK, MLP]
          example: COMMERCIAL_BANK
        institution_name:
          type: string
          example: "Banco do Brasil"

    OnboardingResponse:
      type: object
      required: [userId, did, walletAddress]
      properties:
        userId:
          type: string
        did:
          type: string
          example: "did:lac:openprotest:0x..."
        walletAddress:
          type: string
          example: "0x..."

    KYCStatusResponse:
      type: object
      required: [subject, status]
      properties:
        subject:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, FROZEN, REVOKED, REJECTED]

    IssueCredentialRequest:
      type: object
      required: [subject]
      properties:
        subject:
          type: string
          description: UserID of the participant to be credentialed
        institution_name:
          type: string
        country_code:
          type: string
          example: BR
        bank_code:
          type: string

    AMLScreenResponse:
      type: object
      required: [subject, status, sanctioned]
      properties:
        subject:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, FROZEN, REVOKED, REJECTED]
        sanctioned:
          type: boolean

    ProvisionRequest:
      type: object
      required: [subject, status]
      properties:
        subject:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, FROZEN, REVOKED]

    ProvisionResponse:
      type: object
      required: [subject, status]
      properties:
        subject:
          type: string
        status:
          type: string
