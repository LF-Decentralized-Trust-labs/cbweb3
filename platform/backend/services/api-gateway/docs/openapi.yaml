openapi: 3.0.3
info:
  title: CBWeb3 API Gateway
  version: 2.0.0
  description: >
    OpenAPI specification for the CBWeb3 platform API Gateway.
    Implements authentication, participant onboarding, KYC/AML compliance,
    and governance operations over the identity service (Keycloak + KMS).
    
    Security note: All /compliance write endpoints require CENTRAL_BANK role.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Health
    description: Service health endpoint
  - name: Authentication
    description: Login, refresh, logout and onboarding
  - name: Compliance
    description: KYC credential issuance, verification, AML screening, and governance
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate client credentials and obtain access + refresh tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Issue a new access token from a valid refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "invalid or expired refresh token"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current access token (logout)
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "logged out successfully"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/onboarding:
    post:
      tags: [Authentication]
      summary: >
        Register a new participant. Enforces KYC gate for non-Central Bank actors.
        Central Bank actors bypass the KYC gate.
      operationId: onboarding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
      responses:
        "201":
          description: Participant registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResponse"
        "202":
          description: Awaiting Central Bank KYC approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "awaiting central bank approval"
                  subject:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: KYC status is not eligible (FROZEN, REVOKED, REJECTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Participant already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/wallet/bind:
    post:
      tags: [Authentication]
      summary: Verify PKI login challenge and issue tokens
      description: >
        Step 2 of PKI authentication flow. The client submits:
        user_id, the ECDSA signature (DER hex) of the login nonce, and the
        participant X.509 certificate PEM issued by the Central Bank CA.
      operationId: walletBind
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, nonce_signature_hex, cert_pem]
              properties:
                user_id:
                  type: string
                nonce_signature_hex:
                  type: string
                  description: DER-encoded ECDSA signature in hex format
                cert_pem:
                  type: string
                  description: PEM-encoded participant certificate
      responses:
        "200":
          description: PKI verification successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: PKI verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "PKI verification failed"
        "501":
          description: PKI authentication not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "PKI authentication not configured"

  /api/v1/compliance/kyc/status/{subject}:
    get:
      tags: [Compliance]
      summary: Get KYC lifecycle status for a subject
      operationId: getKycStatus
      security:
        - BearerAuth: []
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            type: string
          description: The userID or participant identifier
      responses:
        "200":
          description: KYC status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KYCStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/compliance/approve-kyc:
    post:
      tags: [Compliance]
      summary: >
        Approve KYC for a participant (GOVERNANCE only).
        Sets status to ACTIVE in PostgreSQL and calls setParticipant(wallet, role, true)
        on the ParticipantRegistry contract (Hyperledger Besu).
      operationId: approveKyc
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject:
                  type: string
                  description: Keycloak user ID of the participant to approve
                reason:
                  type: string
                  description: Optional reason for audit log
      responses:
        "200":
          description: Participant approved — ACTIVE on-chain and off-chain
          content:
            application/json:
              schema:
                type: object
                required: [subject, status]
                properties:
                  subject:
                    type: string
                  status:
                    type: string
                    example: ACTIVE
                  tx_hash:
                    type: string
                    description: On-chain transaction hash (absent if Besu unavailable)
                    example: "0x1234..."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Participant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/compliance/aml/screen:
    post:
      tags: [Compliance]
      summary: >
        AML/CFT screening gate — checks if a subject is sanctioned.
        Returns 403 if FROZEN, REVOKED, or REJECTED (REQ-COM-007).
      operationId: amlScreen
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject:
                  type: string
      responses:
        "200":
          description: Subject is not sanctioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AMLScreenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Subject is sanctioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AMLScreenResponse"

  /api/v1/compliance/participants/provision:
    post:
      tags: [Compliance]
      summary: >
        Set KYC status for a participant (CENTRAL_BANK only).
        Used for initial approval, freeze, unfreeze, and revocation.
      operationId: provisionParticipant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionRequest"
      responses:
        "200":
          description: Participant provisioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/compliance/accounts/freeze:
    post:
      tags: [Compliance]
      summary: >
        Freeze an account (CENTRAL_BANK only — REQ-COM-003, UT-API-16).
        Sets KYC status to FROZEN — all operations are suspended.
      operationId: freezeAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject:
                  type: string
      responses:
        "200":
          description: Account frozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/compliance/accounts/unfreeze:
    post:
      tags: [Compliance]
      summary: Restore a frozen account to APPROVED status (CENTRAL_BANK only)
      operationId: unfreezeAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject:
                  type: string
      responses:
        "200":
          description: Account unfrozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/compliance/register:
    post:
      tags: [Compliance]
      summary: Register a new participant (Commercial Bank or Treasury user) — CENTRAL_BANK only
      description: >
        Called by Central Bank administrators to onboard new Commercial Banks and
        Treasury users. The identity service creates a Keycloak user, optionally
        generates a KMS key pair, and optionally registers the wallet address
        on-chain in the ParticipantRegistry smart contract (signed with CB_PRIVATE_KEY).
      operationId: registerParticipant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterParticipantRequest"
      responses:
        "201":
          description: Participant successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterParticipantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Participant already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued by the identity service. Includes enriched claims:
        sub, roles, did, wallet, country, bank_id, privacy_group (D7 §7.4).

  responses:
    BadRequest:
      description: Invalid body or missing required fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions (requires CENTRAL_BANK role)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "insufficient permissions"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ErrorCodeResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    LoginRequest:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId:
          type: string
          example: bank-a
        clientSecret:
          type: string
          format: password
          example: secret-a

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, expiresIn, tokenType]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 3600
        tokenType:
          type: string
          example: Bearer

    OnboardingRequest:
      type: object
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: BR
        bank_code:
          type: string
          example: "001"
        role:
          type: string
          enum: [CENTRAL_BANK, COMMERCIAL_BANK, MLP]
          example: COMMERCIAL_BANK
        institution_name:
          type: string
          example: "Banco do Brasil"

    OnboardingResponse:
      type: object
      required: [userId, did, walletAddress]
      properties:
        userId:
          type: string
        did:
          type: string
          example: "did:lac:openprotest:0x..."
        walletAddress:
          type: string
          example: "0x..."

    KYCStatusResponse:
      type: object
      required: [subject, status]
      properties:
        subject:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, FROZEN, REVOKED, REJECTED]

    AMLScreenResponse:
      type: object
      required: [subject, status, sanctioned]
      properties:
        subject:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, FROZEN, REVOKED, REJECTED]
        sanctioned:
          type: boolean

    ProvisionRequest:
      type: object
      required: [subject, status]
      properties:
        subject:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, FROZEN, REVOKED]

    ProvisionResponse:
      type: object
      required: [subject, status]
      properties:
        subject:
          type: string
        status:
          type: string

    RegisterParticipantRequest:
      type: object
      required: [username, email, role]
      properties:
        username:
          type: string
          description: Keycloak username / login identifier for the new participant
          example: "banco-brasil-admin"
        email:
          type: string
          format: email
          description: Email address of the new participant
          example: "admin@bancodobrasil.com.br"
        role:
          type: string
          description: >
            Prefixed role to assign. One of: ROLE_COMMERCIAL_BANK, ROLE_NOC,
            ROLE_SUPERVISOR, ROLE_TREASURY, ROLE_GOVERNANCE.
          enum:
            - ROLE_COMMERCIAL_BANK
            - ROLE_NOC
            - ROLE_SUPERVISOR
            - ROLE_TREASURY
            - ROLE_GOVERNANCE
          example: "ROLE_COMMERCIAL_BANK"
        institution_name:
          type: string
          description: Human-readable institution name
          example: "Banco do Brasil S.A."
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: "BR"
        bank_code:
          type: string
          description: Optional regulatory or internal bank identifier
          example: "001"

    RegisterParticipantResponse:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          description: Keycloak UUID of the newly created user
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        role:
          type: string
          example: "ROLE_COMMERCIAL_BANK"
        walletAddress:
          type: string
          description: EVM address generated by the KMS (present for ROLE_COMMERCIAL_BANK)
          example: "0xAbCd..."
        did:
          type: string
          description: Decentralized identifier derived from the wallet address
          example: "did:lac:openprotest:0xabcd..."
        txHash:
          type: string
          description: On-chain transaction hash from ParticipantRegistry.registerMember
          example: "0x1234..."
