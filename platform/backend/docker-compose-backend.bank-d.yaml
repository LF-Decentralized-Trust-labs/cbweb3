services:
  compliance-bank-d:
    build:
      context: .
      dockerfile: services/compliance/Dockerfile
    image: cbweb3/compliance:local
    pull_policy: build
    container_name: "backend-compliance-bank-d"
    env_file:
      - path: ./config/.env.infra.bank-d
        required: true
    environment:
      COMPLIANCE_GRPC_PORT: "9093"
      BANK_CODE: "bank-d"
      PKI_DIR: /workspace/backend/config/pki
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-default}:${POSTGRES_PASSWORD:-default}@postgres:5432/${DB_NAME:-cbweb3_bank_d}?sslmode=disable"
    volumes:
      - ./config/pki:/workspace/backend/config/pki
    ports:
      - "59093:9093"
    networks:
      - cbweb3_backend_bank_d
      - cbweb3_network

  auth-bank-d:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    image: cbweb3/auth:local
    pull_policy: build
    container_name: "backend-auth-bank-d"
    env_file:
      - path: ./config/.env.infra.bank-d
        required: true
    environment:
      AUTH_GRPC_PORT: "9091"
      KEYCLOAK_BASE_URL: "${KEYCLOAK_BASE_URL:-http://keycloak:8080}"
      KEYCLOAK_REALM: "${KC_REALM:-bank-d}"
      KEYCLOAK_CLIENT_ID: "${KC_CLIENT_ID:-bank-d-client}"
      KEYCLOAK_CLIENT_SECRET: "${KC_CLIENT_SECRET:-change-me}"
      KEYCLOAK_JWKS_CACHE_TTL_SEC: "3000"
      KEYCLOAK_REQUEST_TIMEOUT_SEC: "10"
      COMPLIANCE_GRPC_ADDR: compliance-bank-d:9093
      COMPLIANCE_REQUEST_TIMEOUT_SEC: "5"
      REDIS_ADDR: "${REDIS_CONTAINER_NAME:-cbweb3-redis}:6379"
      REDIS_DB: "4"
    ports:
      - "59091:9091"
    depends_on:
      - compliance-bank-d
    networks:
      - cbweb3_backend_bank_d
      - cbweb3_network

  payment-orchestrator-bank-d:
    build:
      context: .
      dockerfile: services/payment-orchestrator/Dockerfile
    image: cbweb3/payment-orchestrator:local
    pull_policy: build
    container_name: "backend-payment-orchestrator-bank-d"
    env_file:
      - path: ./config/.env.infra.bank-d
        required: true
      - path: ../deploy/local/paladin/spoke-b/.deployed-addrs.env
        required: false
    environment:
      PAYMENT_GRPC_PORT: "9094"
      PALADIN_URL: "http://host.docker.internal:31768"
      PALADIN_IDENTITY: "funded_operator@spoke-b-bank-d"
      BESU_OPERATOR_KEY: "5b02fc9b19facc6de72b514a03db7f7fbd9f46b6ad6ffb24b8df575593ae87f1"
      CACTI_API_URL: "http://host.docker.internal:4000"
    ports:
      - "59094:9094"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cbweb3_backend_bank_d
      - cbweb3_network

  api-gateway-bank-d:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: cbweb3/api-gateway:local
    pull_policy: build
    container_name: "backend-api-gateway-bank-d"
    env_file:
      - path: ./config/.env.infra.bank-d
        required: true
    environment:
      APP_PORT: "8080"
      REQUEST_TIMEOUT_SEC: "30"
      AUTH_GRPC_ADDR: auth-bank-d:9091
      COMPLIANCE_GRPC_ADDR: compliance-bank-d:9093
      PAYMENT_GRPC_ADDR: payment-orchestrator-bank-d:9094
      PKI_DIR: /workspace/backend/config/pki
      BANK_CODE: "bank-d"
      CENTRAL_BANK_API_URL: "http://api-gateway-central-bank-b:8080"
      ENTITY_BESU_ADDRESS: "0xA2ef7fAd3FB7705424b7Cc27d21526828dc08aE8"
      PALADIN_IDENTITY: "funded_operator@spoke-b-bank-d"
      CB_PALADIN_IDENTITY: "funded_operator@spoke-b-cb"
    volumes:
      - ./config/pki:/workspace/backend/config/pki
    ports:
      - "58080:8080"
    depends_on:
      - auth-bank-d
      - compliance-bank-d
      - payment-orchestrator-bank-d
    networks:
      - cbweb3_backend_bank_d
      - cbweb3_network

networks:
  cbweb3_backend_bank_d:
  cbweb3_network:
    external: true
