services:
  compliance-hub:
    image: golang:1.25-alpine
    working_dir: /workspace/backend/services/compliance
    command: ["sh", "-c", "go run ./cmd/compliance"]
    container_name: "backend-compliance-hub"
    env_file:
      - path: ./config/.env.infra.hub
        required: false     
    environment:
      COMPLIANCE_GRPC_PORT: "9093"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-default}:${POSTGRES_PASSWORD:-default}@postgres:5432/${DB_NAME:-cbweb3_hub}?sslmode=disable"
    volumes:
      - ../:/workspace
    ports:
      - "39093:9093"
    networks:
      - cbweb3_backend_hub
      - cbweb3_network

  auth-hub:
    image: golang:1.25-alpine
    working_dir: /workspace/backend/services/auth
    command: ["sh", "-c", "go run ./cmd/auth"]
    container_name: "backend-auth-hub"
    env_file:
      - path: ./config/.env.infra.hub
        required: false
      - path: ./config/.env.infra.hub.example
        required: false
    environment:
      AUTH_GRPC_PORT: "9091"
      KEYCLOAK_BASE_URL: "${KEYCLOAK_BASE_URL:-http://keycloak:8080}"
      KEYCLOAK_REALM: "${KC_REALM:-cbweb3}"
      KEYCLOAK_CLIENT_ID: "${KC_CLIENT_ID:-cbweb3-auth}"
      KEYCLOAK_CLIENT_SECRET: "${KC_CLIENT_SECRET:-change-me}"
      KEYCLOAK_JWKS_CACHE_TTL_SEC: "300"
      KEYCLOAK_REQUEST_TIMEOUT_SEC: "10"
      COMPLIANCE_GRPC_ADDR: compliance-hub:9093
      COMPLIANCE_REQUEST_TIMEOUT_SEC: "5"
      REDIS_ADDR: "${REDIS_CONTAINER_NAME:-cbweb3-redis}:6379"
    volumes:
      - ../:/workspace
    ports:
      - "39091:9091"
    depends_on:
      - compliance-hub
    networks:
      - cbweb3_backend_hub
      - cbweb3_network

  api-gateway-hub:
    image: golang:1.25-alpine
    working_dir: /workspace/backend/services/api-gateway
    command: ["sh", "-c", "go run ./cmd/api-gateway"]
    container_name: "backend-api-gateway-hub"
    env_file:
      - path: ./config/.env.infra.hub
        required: false
      - path: ./config/.env.infra.hub.example
        required: false
    environment:
      APP_PORT: "8080"
      REQUEST_TIMEOUT_SEC: "30"
      AUTH_GRPC_ADDR: auth-hub:9091
      COMPLIANCE_GRPC_ADDR: compliance-hub:9093
    volumes:
      - ../:/workspace
    ports:
      - "38080:8080"
    depends_on:
      - auth-hub
      - compliance-hub
    networks:
      - cbweb3_backend_hub

networks:
  cbweb3_backend_hub:
  cbweb3_network:
    external: true
