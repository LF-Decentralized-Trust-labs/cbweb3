services:
  compliance-hub:
    build:
      context: .
      dockerfile: services/compliance/Dockerfile
    image: cbweb3/compliance:local
    pull_policy: build
    container_name: "backend-compliance-hub"
    env_file:
      - path: ./config/.env.infra.hub
        required: true
    environment:
      COMPLIANCE_GRPC_PORT: "9093"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-default}:${POSTGRES_PASSWORD:-default}@postgres:5432/${DB_NAME:-cbweb3_hub}?sslmode=disable"
    ports:
      - "39093:9093"
    networks:
      - cbweb3_backend_hub
      - cbweb3_network

  auth-hub:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    image: cbweb3/auth:local
    pull_policy: build
    container_name: "backend-auth-hub"
    env_file:
      - path: ./config/.env.infra.hub
        required: true
    environment:
      AUTH_GRPC_PORT: "9091"
      KEYCLOAK_BASE_URL: "${KEYCLOAK_BASE_URL:-http://keycloak:8080}"
      KEYCLOAK_REALM: "${KC_REALM:-cbweb3}"
      KEYCLOAK_CLIENT_ID: "${KC_CLIENT_ID:-cbweb3-auth}"
      KEYCLOAK_CLIENT_SECRET: "${KC_CLIENT_SECRET:-change-me}"
      KEYCLOAK_JWKS_CACHE_TTL_SEC: "3000"
      KEYCLOAK_REQUEST_TIMEOUT_SEC: "10"
      COMPLIANCE_GRPC_ADDR: compliance-hub:9093
      COMPLIANCE_REQUEST_TIMEOUT_SEC: "5"
      REDIS_ADDR: "${REDIS_CONTAINER_NAME:-cbweb3-redis}:6379"
    ports:
      - "39091:9091"
    depends_on:
      - compliance-hub
    networks:
      - cbweb3_backend_hub
      - cbweb3_network

  api-gateway-hub:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: cbweb3/api-gateway:local
    pull_policy: build
    container_name: "backend-api-gateway-hub"
    env_file:
      - path: ./config/.env.infra.hub
        required: true
    environment:
      APP_PORT: "8080"
      REQUEST_TIMEOUT_SEC: "30"
      AUTH_GRPC_ADDR: auth-hub:9091
      COMPLIANCE_GRPC_ADDR: compliance-hub:9093
    ports:
      - "38080:8080"
    depends_on:
      - auth-hub
      - compliance-hub
    networks:
      - cbweb3_backend_hub

networks:
  cbweb3_backend_hub:
  cbweb3_network:
    external: true
