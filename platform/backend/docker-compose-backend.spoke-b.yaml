services:
  compliance-spoke-b:
    image: golang:1.25-alpine
    working_dir: /workspace/backend/services/compliance
    command: ["sh", "-c", "go run ./cmd/compliance"]
    container_name: "backend-compliance-spoke-b"
    env_file:
      - path: ./config/.env.infra.spoke-b
        required: false
      - path: ./config/.env.infra.spoke-b.example
        required: false
    environment:
      COMPLIANCE_GRPC_PORT: "9093"
      POSTGRES_DSN: "postgres://${POSTGRES_USER:-default}:${POSTGRES_PASSWORD:-default}@postgres:5432/${DB_NAME:-cbweb3_spoke_b}?sslmode=disable"
    volumes:
      - ../:/workspace
    ports:
      - "29093:9093"
    networks:
      - cbweb3_backend_spoke_b
      - cbweb3_network

  auth-spoke-b:
    image: golang:1.25-alpine
    working_dir: /workspace/backend/services/auth
    command: ["sh", "-c", "go run ./cmd/auth"]
    container_name: "backend-auth-spoke-b"
    env_file:
      - path: ./config/.env.infra.spoke-b
        required: false
      - path: ./config/.env.infra.spoke-b.example
        required: false
    environment:
      AUTH_GRPC_PORT: "9091"
      KEYCLOAK_BASE_URL: "${KEYCLOAK_BASE_URL:-http://keycloak:8080}"
      KEYCLOAK_REALM: "${KC_REALM:-cbweb3-spoke-b}"
      KEYCLOAK_CLIENT_ID: "${KC_CLIENT_ID:-cbweb3-spoke-b-client}"
      KEYCLOAK_CLIENT_SECRET: "${KC_CLIENT_SECRET:-change-me}"
      KEYCLOAK_JWKS_CACHE_TTL_SEC: "300"
      KEYCLOAK_REQUEST_TIMEOUT_SEC: "10"
      COMPLIANCE_GRPC_ADDR: compliance-spoke-b:9093
      COMPLIANCE_REQUEST_TIMEOUT_SEC: "5"
      REDIS_ADDR: "${REDIS_CONTAINER_NAME:-cbweb3-redis}:6379"
    volumes:
      - ../:/workspace
    ports:
      - "29091:9091"
    depends_on:
      - compliance-spoke-b
    networks:
      - cbweb3_backend_spoke_b
      - cbweb3_network

  api-gateway-spoke-b:
    image: golang:1.25-alpine
    working_dir: /workspace/backend/services/api-gateway
    command: ["sh", "-c", "go run ./cmd/api-gateway"]
    container_name: "backend-api-gateway-spoke-b"
    env_file:
      - path: ./config/.env.infra.spoke-b
        required: false
      - path: ./config/.env.infra.spoke-b.example
        required: false
    environment:
      APP_PORT: "8080"
      REQUEST_TIMEOUT_SEC: "30"
      AUTH_GRPC_ADDR: auth-spoke-b:9091
      COMPLIANCE_GRPC_ADDR: compliance-spoke-b:9093
    volumes:
      - ../:/workspace
    ports:
      - "28080:8080"
    depends_on:
      - auth-spoke-b
      - compliance-spoke-b
    networks:
      - cbweb3_backend_spoke_b

networks:
  cbweb3_backend_spoke_b:
  cbweb3_network:
    external: true
