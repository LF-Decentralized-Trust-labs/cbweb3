services:
  htlc-relay:
    build:
      context: ../../..
      dockerfile: interop/hub-and-spoke/relay/Dockerfile
    image: cbweb3/htlc-relay:local
    pull_policy: build
    container_name: "cbweb3-htlc-relay"
    environment:
      # Spoke-A Besu + HTLC
      SPOKE_A_BESU_RPC: "http://host.docker.internal:8645"
      SPOKE_A_HTLC_ADDRESS: "${SPOKE_A_HTLC_ADDRESS:-0x9a3dbca554e9f6b9257aaa24010da8377c57c17e}"
      # Spoke-B Besu + HTLC
      SPOKE_B_BESU_RPC: "http://host.docker.internal:8745"
      SPOKE_B_HTLC_ADDRESS: "${SPOKE_B_HTLC_ADDRESS:-0x9a3dbca554e9f6b9257aaa24010da8377c57c17e}"
      # gRPC endpoints for payment-orchestrator (counterpart settle targets)
      SPOKE_A_PAYMENT_GRPC: "host.docker.internal:19094"
      SPOKE_B_PAYMENT_GRPC: "host.docker.internal:29094"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-3}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
