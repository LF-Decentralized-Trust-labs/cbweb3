# NOC Agent Configuration — Spoke B
# spoke_id and api_key must be filled after provisioning via the admin API.

spoke_id: "REPLACE_WITH_SPOKE_UUID"
noc_backend_url: "http://noc-backend:8090"
api_key: "REPLACE_WITH_PROVISIONED_KEY"
push_interval_seconds: 15

components:
  - name: "besu-central-bank-b"
    type: "BESU"
    endpoint: "http://cbweb3-spoke-b-besu.central-bank-b:8545"
    container_name: "cbweb3-spoke-b-besu.central-bank-b"

  - name: "cacti-relay"
    type: "CACTI_RELAY"
    endpoint: "http://cbweb3-cacti-relay:4000"
    container_name: "cbweb3-cacti-relay"

  - name: "paladin-cb"
    type: "PALADIN"
    endpoint: "http://paladin-spoke-b-cb:8548"
    container_name: "paladin-spoke-b-cb"
