server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Per-scenario config fragments are mounted at runtime (one per scenario); never
  # cache them so a newly written/removed fragment is picked up on the next reload.
  location /configs/ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
