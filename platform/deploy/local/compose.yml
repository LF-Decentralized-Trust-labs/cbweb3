services:
  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: "${KEYCLOAK_CONTAINER_NAME:-keycloak}"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      KEYCLOAK_ENV_OUTPUT_FILE: "${KEYCLOAK_ENV_OUTPUT_FILE:-/opt/keycloak/host/.env.keycloak}"
      KEYCLOAK_PORT: "${KEYCLOAK_PORT:-8081}"
    volumes:
      - ./keycloak/init.sh:/opt/keycloak/init.sh
      - ./:/opt/keycloak/host
    entrypoint: ["bash", "/opt/keycloak/init.sh"]
    networks:
      - cbweb3_network
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"

  postgres:
    image: "postgres:${POSTGRES_IMAGE_TAG:-17-alpine}"
    container_name: "${POSTGRES_CONTAINER_NAME:-postgres}"
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-default}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-default}"
      POSTGRES_DB: "${POSTGRES_DB:-default}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cbweb3_network

volumes:
  postgres_data:

networks:
  cbweb3_network:
    external: true
