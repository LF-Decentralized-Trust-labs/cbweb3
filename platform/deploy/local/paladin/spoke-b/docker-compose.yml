version: '3.8'

services:
  # Init container: ensures all data volumes are writable by the Paladin user.
  # Named volumes are created owned by root (0755); this service runs as root
  # and makes them world-writable before the Paladin nodes start.
  paladin-data-init:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - paladin_spoke_b_cb_data:/data/cb
      - paladin_spoke_b_bank_b_data:/data/bank-b
      - paladin_spoke_b_bank_d_data:/data/bank-d
    command: ["sh", "-c", "chmod 777 /data/cb /data/bank-b /data/bank-d"]
    restart: "no"

  # Paladin Central Bank Node — wired to Besu bootnode (RPC :8745, WS :8755)
  paladin-spoke-b-cb:
    image: docker.io/lfdecentralizedtrust/paladin:v0.15.0-rc.1
    container_name: paladin-spoke-b-cb
    user: "${PALADIN_UID}:${PALADIN_GID}"
    ports:
      - "31748:8548"  # HTTP RPC
      - "31749:8549"  # WebSocket RPC
      - "9021:9000"   # gRPC Transport
    environment:
      - PALADIN_LOG_LEVEL=debug
    volumes:
      - ./config/central-bank:/etc/paladin
      - paladin_spoke_b_cb_data:/data
    tmpfs:
      - /app/jna:exec,mode=1777
      - /data/keystore:mode=0777
    networks:
      - spoke_b_besu_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      paladin-data-init:
        condition: service_completed_successfully
    command: ["/etc/paladin/config.yaml", "engine"]

  # Paladin Bank B Node — wired to Besu node-1 (RPC :8747, WS :8757)
  paladin-spoke-b-bank-b:
    image: docker.io/lfdecentralizedtrust/paladin:v0.15.0-rc.1
    container_name: paladin-spoke-b-bank-b
    user: "${PALADIN_UID}:${PALADIN_GID}"
    ports:
      - "31758:8548"  # HTTP RPC
      - "31759:8549"  # WebSocket RPC
      - "9022:9000"   # gRPC Transport
    environment:
      - PALADIN_LOG_LEVEL=debug
    volumes:
      - ./config/bank-b:/etc/paladin
      - paladin_spoke_b_bank_b_data:/data
    tmpfs:
      - /app/jna:exec,mode=1777
      - /data/keystore:mode=0777
    networks:
      - spoke_b_besu_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      paladin-data-init:
        condition: service_completed_successfully
    command: ["/etc/paladin/config.yaml", "engine"]

  # Paladin Bank D Node — wired to Besu node-2 (RPC :8748, WS :8758)
  paladin-spoke-b-bank-d:
    image: docker.io/lfdecentralizedtrust/paladin:v0.15.0-rc.1
    container_name: paladin-spoke-b-bank-d
    user: "${PALADIN_UID}:${PALADIN_GID}"
    ports:
      - "31768:8548"  # HTTP RPC
      - "31769:8549"  # WebSocket RPC
      - "9023:9000"   # gRPC Transport
    environment:
      - PALADIN_LOG_LEVEL=debug
    volumes:
      - ./config/bank-d:/etc/paladin
      - paladin_spoke_b_bank_d_data:/data
    tmpfs:
      - /app/jna:exec,mode=1777
      - /data/keystore:mode=0777
    networks:
      - spoke_b_besu_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      paladin-data-init:
        condition: service_completed_successfully
    command: ["/etc/paladin/config.yaml", "engine"]

volumes:
  paladin_spoke_b_cb_data:
  paladin_spoke_b_bank_b_data:
  paladin_spoke_b_bank_d_data:

networks:
  spoke_b_besu_network:
    external: true
