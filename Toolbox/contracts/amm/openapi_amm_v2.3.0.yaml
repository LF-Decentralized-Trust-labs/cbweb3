                    requester_id: "bank-b"
                    requester_besu_address: "0x9876fedc..."
                    amount: "5000000"
                    status: "APPROVED"
                    mint_tx_hash: "0x1234..."
                    created_at: "2026-06-18T11:00:00Z"
                total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/payments/redeems/approve:
    post:
      tags: [Escrow]
      summary: Approve a redeem — mint fCeBM to the requester (Central Bank only)
      description: |
        The Central Bank verifies the inbound Zeto transfer of tCeBM was received, then
        mints the equivalent fCeBM (ERC-20) to the requester's Besu address.
      operationId: approveRedeem
      security:
