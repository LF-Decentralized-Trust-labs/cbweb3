        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Escrow]
      summary: List redeem requests
      description: Returns redeem requests, optionally filtered by requester. No pagination.
      operationId: listRedeems
      security:
        - CookieAuth: []
      parameters:
