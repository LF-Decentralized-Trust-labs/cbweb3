          type: string
          description: Currency the payer is debited in.
          example: "BRL"
        target_currency:
          type: string
          description: Currency the beneficiary is credited in.
          example: "ARS"
        pool_pair:
          type: string
          description: Pair identifier from `GET /api/v2/amm/pairs`. Opaque — do not construct it.
          example: "W-tCeBM_BRL/W-tCeBM_ARS"
        amount_out:
          type: string
          description: Exact output delivered on the target side, base units.
          example: "1000000000000000000000"
        max_amount_in:
          type: string
          description: |
