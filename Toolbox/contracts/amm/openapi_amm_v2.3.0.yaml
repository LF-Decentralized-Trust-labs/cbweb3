  # ===========================================================================
  # AMM — quotes and swaps
  # ===========================================================================

  /api/v2/amm/quote/exact-output:
    get:
      tags: [AMM Swap]
      summary: Quote the input required for a fixed output on one pair
      description: |
        Single-pair, intra-Hub quote: how much input is needed to receive exactly
        `amount_out`. Public — no credentials required.

        `Spec divergence (blocking):` the platform document declares the amount
        parameter as **`amountOut`** (camelCase). The delivered handler reads
        **`amount_out`** (snake_case). A client written strictly against the published
        document always receives
        `400 {"error": "pair and amount_out are required query parameters",
        "error_code": "INVALID_REQUEST"}`. **This contract documents `amount_out`,** the
        name that works and the name used everywhere else in the surface.

        `Undocumented status code:` the handler answers **422**
        `INSUFFICIENT_POOL_LIQUIDITY` when the pool cannot source the requested output.
      operationId: getExactOutputQuote
      security: []
      parameters:
        - name: pair
          in: query
          required: true
          description: |
            Trading pair identifier. Treat as opaque and obtain it from
            `GET /api/v2/amm/pairs`; the platform's own example here
            (`tCeBM_BRL-tCeBM_ARS`) uses a different convention from the one its
            `pool_pair` fields use (`W-tCeBM_BRL/W-tCeBM_ARS`).
          schema:
            type: string
          example: "tCeBM_BRL-tCeBM_ARS"
        - name: amount_out
          in: query
          required: true
          description: |
            Desired output amount (stringified integer/decimal, base units). Named
            `amountOut` in the platform document; the delivered handler only accepts
            `amount_out`.
          schema:
            type: string
          example: "1000000000000000000000"
      responses:
        "200":
          description: Quote computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExactOutputQuote"
              example:
                required_input: "1176470588235294117647"
                price_impact: "0.0032"
                quote_timestamp: "2026-06-18T10:00:00Z"
        "400":
          $ref: "#/components/responses/AmmBadRequest"
        "422":
          description: |
            Insufficient pool liquidity (`INSUFFICIENT_POOL_LIQUIDITY`). Not declared in
            the platform document; observed in the delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmmErrorResponse"
              example:
                error: "insufficient pool liquidity"
                error_code: "INSUFFICIENT_POOL_LIQUIDITY"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/amm/quote/cross-currency:
    get:
      tags: [AMM Swap]
      summary: Quote an orchestrated cross-currency swap (15-second TTL)
      description: |
        Generates a short-lived quote for a full cross-border settlement. Public — no
        credentials required.

        **The quote lives for 15 seconds.** `quote_id` is optional on the swap request,
        but when supplied the orchestrator validates it and fails the swap if
        `now > valid_until`. A test that pauses between quoting and swapping will flake.

        `Spec divergence (blocking):` the platform document declares **zero parameters**
        for this operation, while the handler requires three (`source_currency`,
        `target_currency`, `amount_out`) and accepts two more. Following the document
        literally always yields 400. The parameters below are recovered from the
        delivered handler and from the platform's own end-to-end test, which calls
        `/api/v2/amm/quote/cross-currency?source_currency=BRL&target_currency=ARS&amount_out=<n>`.

        `Undocumented status code:` **422** `INSUFFICIENT_POOL_LIQUIDITY`.

        Note that `created_at` and `valid_until` in the response are **Unix integers**,
        not RFC 3339 strings — unlike almost every other timestamp in this surface.
      operationId: getCrossCurrencyQuote
      security: []
      parameters:
        - name: source_currency
          in: query
          required: true
          description: Currency the payer is debited in. Required by the handler; undeclared upstream.
          schema:
            type: string
          example: "BRL"
        - name: target_currency
          in: query
          required: true
          description: Currency the beneficiary is credited in. Required by the handler; undeclared upstream.
          schema:
            type: string
          example: "ARS"
        - name: amount_out
          in: query
          required: true
          description: Exact output amount on the target side, base units. Required by the handler; undeclared upstream.
          schema:
            type: string
          example: "1000000000000000000000"
        - name: pool_pair
          in: query
          required: false
          description: |
            Exact pair identifier to quote against, from `GET /api/v2/amm/pairs`.
            Optional; the service resolves a pair from the currency couple when omitted.
          schema:
            type: string
          example: "W-tCeBM_BRL/W-tCeBM_ARS"
        - name: max_slippage_pct
          in: query
          required: false
          description: Slippage tolerance as a fraction. Handler default is 0.01 (1%).
          schema:
            type: number
            format: float
            default: 0.01
          example: 0.01
      responses:
        "200":
          description: Quote computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossCurrencyQuote"
              example:
                quote_id: "q-7f3a91c2"
                pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
                amount_out: "1000000000000000000000"
                amount_in: "1176470588235294117647"
                effective_rate: 0.85
                fee_bps: 30
                max_slippage_pct: 0.01
                reserve_a_snapshot: "50000000000000000000000"
                reserve_b_snapshot: "42500000000000000000000"
                created_at: 1711500000
                valid_until: 1711500015
                time_remaining_seconds: 15
        "400":
          $ref: "#/components/responses/AmmBadRequest"
        "422":
          description: |
            Insufficient pool liquidity (`INSUFFICIENT_POOL_LIQUIDITY`). Not declared in
            the platform document; observed in the delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmmErrorResponse"
              example:
                error: "insufficient pool liquidity"
                error_code: "INSUFFICIENT_POOL_LIQUIDITY"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/amm/swap/exact-output:
    post:
      tags: [AMM Swap]
      summary: Execute a single-pair exact-output swap on the Hub AMM
      description: |
        The intra-Hub leg: swap on one pair, receiving exactly `amount_out` and spending
        at most `max_amount_in`. **This is not the cross-border flow** — for that use
        `POST /api/v2/amm/swap/cross-currency`.

        Router gate: cookie auth **only** (no bearer) plus the `commercial_bank` realm
        role. The platform's shared 403 response text claiming "requires CENTRAL_BANK
        role" is inaccurate for this operation.

        `payer_id` may appear in older client code; it is **deprecated and ignored** —
        the payer is derived from the session `bankId` claim.

        `Undocumented status code:` **422** carrying a swap-execution `error_code`, or
        `ZK_VALIDATION_FAILED` when a supplied ZK pointer does not validate.
      operationId: swapExactOutput
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExactOutputSwapRequest"
            example:
              pair: "W-tCeBM_BRL/W-tCeBM_ARS"
              amount_out: "1000000000000000000000"
              max_amount_in: "1200000000000000000000"
              beneficiary_id: "bank-galicia"
      responses:
        "200":
          description: Swap executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapResult"
              example:
                order_id: "ord-4c2b8e10"
                tx_hash: "0xabcd1234..."
                amount_in: "1176470588235294117647"
                state: "CONFIRMED"
                confirmed_at: "2026-06-18T10:00:07Z"
                hub_sender_address: "0x5678ef01..."
        "400":
          $ref: "#/components/responses/AmmBadRequest"
        "401":
          $ref: "#/components/responses/AmmUnauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            Swap refused at execution time. Not declared in the platform document;
            observed in the delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmmErrorResponse"
              example:
                error: "zk pointer validation failed"
                error_code: "ZK_VALIDATION_FAILED"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/amm/swap/cross-currency:
    post:
      tags: [AMM Swap]
      summary: Initiate an orchestrated cross-currency swap — THE cross-border settlement call
      description: |
        The one call a third-party integrator makes to move value across borders.
        Orchestrates **bridge-in** (the payer's issuing Central Bank locks the payer's
        spoke tCeBM and mints its Hub W-token) → **Hub AMM swap** (signed by that same
        CB) → **bridge-out** (the *beneficiary's* CB burns the W-token and delivers on
        its spoke) → **residue return**. Returns a `swap_id` to poll.

        The commercial bank never holds a W-token and never signs on the Hub. That is
        why a single POST produces asynchronous state across two Central Bank gateways,
        and why partial failure is expressible: `BRIDGE_OUT_FAILED` means the swap
        succeeded but delivery did not, and requires manual intervention.

        **`max_amount_in` is bridged in full.** The unspent remainder returns to the
        payer as a separate `RESIDUE` bridge position. Check `residue_status` before
        concluding the payer was correctly debited — see the contract description.

        Preconditions a client should check first: the payer bank holds tCeBM (Reserve
        Tokenisation complete), the pool is `ACTIVE`, and the circuit breaker is not
        halted.

        Router gate: cookie auth **only** plus the `commercial_bank` realm role.
        `payer_bank_id` is deprecated and ignored.

        `Undocumented status codes:` **422** with `error_code` in
        `TRANSFER_LIMIT_EXCEEDED`, `POOL_NOT_ACTIVE`, `CIRCUIT_BREAKER_HALTED`,
        `BRIDGE_IN_FAILED`, `SWAP_FAILED` — each accompanied by a
        `recommended_action` string. None of these is in the platform document.
      operationId: swapCrossCurrency
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrossCurrencySwapRequest"
            example:
              source_currency: "BRL"
              target_currency: "ARS"
              pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
              amount_out: "1000000000000000000000"
              max_amount_in: "1200000000000000000000"
              beneficiary_bank_id: "bank-galicia"
              quote_id: "q-7f3a91c2"
      responses:
        "200":
          description: Swap initiated (poll for terminal status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossCurrencySwapResponse"
              example:
                swap_id: "swp-1a2b3c4d"
                correlation_id: "5f2a1c88-9d34-4f6a-b0e1-7c3d9a2b5e10"
                status: "BRIDGE_IN_PROGRESS"
                amount_in: "1176470588235294117647"
                amount_out: "1000000000000000000000"
                effective_rate: 0.85
                bridge_in_position_id: "9e1c4b77-2f10-4a8d-9c31-6b4e7d2a1f05"
                created_at: "2026-06-18T10:00:00Z"
        "400":
          $ref: "#/components/responses/AmmBadRequest"
        "401":
          $ref: "#/components/responses/AmmUnauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            The request was well-formed but the network refused it — daily transfer limit
            exhausted, pool not active, circuit breaker halted, or the bridge-in / swap
            leg failed. Not declared in the platform document; observed in the delivered
            handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmmErrorResponse"
              examples:
                transferLimit:
                  summary: Daily transfer limit exhausted
                  value:
                    error: "daily transfer limit exceeded"
                    error_code: "TRANSFER_LIMIT_EXCEEDED"
                    recommended_action: "retry after the daily window resets or request a higher limit from your central bank"
                breakerHalted:
                  summary: Hub AMM paused by a Central Bank
                  value:
                    error: "circuit breaker is halted"
                    error_code: "CIRCUIT_BREAKER_HALTED"
                    recommended_action: "wait for 2-of-N resume"
        "500":
          description: |
            Internal failure. Note the distinct `BRIDGE_OUT_FAILED` code: the Hub swap
            **succeeded** and the beneficiary delivery did not. This is not a no-op —
            reconcile before any retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmmErrorResponse"
              example:
                error: "bridge-out delivery failed"
                error_code: "BRIDGE_OUT_FAILED"
                recommended_action: "do not retry; reconcile the bridge-out position with the beneficiary central bank"

    get:
      tags: [AMM Swap]
      summary: List the authenticated bank's own cross-currency swaps
      description: |
        Paginated, date-filtered history **scoped to the bank resolved from the session**
        (`bankId` claim) — a bank can never list another bank's swaps, and there is no
        parameter that would let it try.

        This is the only paginated endpoint in the Scenario B surface. `page_size` above
        100 is silently **clamped** to 100 rather than rejected.
      operationId: listCrossCurrencySwaps
      security:
        - CookieAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive lower bound (YYYY-MM-DD).
          schema:
            type: string
            format: date
          example: "2026-06-01"
        - name: to
          in: query
          required: false
          description: Inclusive upper bound (YYYY-MM-DD).
          schema:
            type: string
            format: date
          example: "2026-06-30"
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
        - name: page_size
          in: query
          required: false
          description: Page size. Values above 100 are clamped to 100.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          example: 20
      responses:
        "200":
          description: Swap history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossCurrencySwapHistory"
              example:
                operations:
                  - swap_id: "swp-1a2b3c4d"
                    status: "COMPLETED"
                    source_currency: "BRL"
                    target_currency: "ARS"
                    pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
                    amount_in: "1176470588235294117647"
                    amount_out: "1000000000000000000000"
                    effective_rate: 0.85
                    swap_tx_hash: "0xabcd1234..."
                    beneficiary_bank_id: "bank-galicia"
                    residue_amount: "23529411764705882353"
                    residue_status: "RETURNED"
                    residue_position_id: "b1d3f6a2-44c8-4e91-8f2a-3c7e5b1d90aa"
                    created_at: "2026-06-18T10:00:00Z"
                    completed_at: "2026-06-18T10:00:41Z"
                page: 1
                page_size: 20
                total: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: |
            Swap history is not available on this gateway (no history reader wired). A
            deployment-shape signal, not a client error.

            Note the platform reuses `SovereignSeedError` as the body type here, which
            has nothing to do with sovereign seeding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SovereignSeedError"
              example:
                error: "swap history not available on this gateway"
                error_code: "NOT_CONFIGURED"
                hint: "point the client at a gateway with a swap history reader wired"

  /api/v2/amm/swap/cross-currency/{id}:
    get:
      tags: [AMM Swap]
      summary: Poll the status of one cross-currency swap
      description: |
        Poll until `status` is `COMPLETED` or `FAILED`. Intermediate values are
        `QUOTING`, `BRIDGE_IN_PROGRESS`, `SWAP_IN_PROGRESS`, `BRIDGE_OUT_PROGRESS`.

        `Spec gap:` that status vocabulary is **not in the platform OpenAPI document at
        all** — it is recovered from `internal/domain`. It is published here as an
        enum-less string with the observed values documented, because the upstream
        document makes no commitment to them.

        Do not treat `COMPLETED` as the end of verification: check `residue_status` too.
        `RETURN_FAILED` means the payer's slippage buffer is still stranded.
      operationId: getCrossCurrencySwapStatus
      security:
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Swap identifier returned by `swapCrossCurrency`.
          schema:
            type: string
          example: "swp-1a2b3c4d"
      responses:
        "200":
          description: Current swap status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossCurrencySwapStatus"
              example:
                swap_id: "swp-1a2b3c4d"
                correlation_id: "5f2a1c88-9d34-4f6a-b0e1-7c3d9a2b5e10"
                status: "COMPLETED"
                amount_in: "1176470588235294117647"
                amount_out: "1000000000000000000000"
                effective_rate: 0.85
                bridge_in_position_id: "9e1c4b77-2f10-4a8d-9c31-6b4e7d2a1f05"
                swap_tx_hash: "0xabcd1234..."
                bridge_out_position_id: "c4a9e7b1-5d2f-4c80-91ab-2e6f8d3a7c11"
                residue_amount: "23529411764705882353"
                residue_position_id: "b1d3f6a2-44c8-4e91-8f2a-3c7e5b1d90aa"
                residue_status: "RETURNED"
                created_at: "2026-06-18T10:00:00Z"
                completed_at: "2026-06-18T10:00:41Z"
        "400":
          $ref: "#/components/responses/AmmBadRequest"
        "401":
          $ref: "#/components/responses/AmmUnauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No swap with that identifier is visible to the calling bank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmmErrorResponse"
              example:
                error: "swap not found"
                error_code: "SWAP_NOT_FOUND"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/amm/pool/{pair}/status:
    get:
      tags: [AMM Swap]
      summary: Pool reserves and status for a pair
      description: |
        The liveness gate a client checks before swapping: `pool_status` must be
        `ACTIVE`. `EMPTY` means no side has been seeded; `PENDING_COUNTERPART` means one
        Central Bank has committed and the other has not. Public — no credentials
        required.

        `Spec divergence:` the platform document declares **404** for an unavailable
        pool; the delivered handler answers **422** with
        `error_code: POOL_STATUS_UNAVAILABLE`. Both are declared below so that a client
        handles whichever it receives.
      operationId: getPoolStatus
      security: []
      parameters:
        - name: pair
          in: path
          required: true
          description: Pair identifier from `GET /api/v2/amm/pairs`. Opaque — do not construct it.
          schema:
            type: string
          example: "W-tCeBM_BRL/W-tCeBM_ARS"
      responses:
        "200":
          description: Pool status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolStatusResponse"
              example:
                pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
                pool_status: "ACTIVE"
                reserve_a: "50000000000000000000000"
                reserve_b: "42500000000000000000000"
                current_ratio: 0.85
                imbalance_flag: false
                fee_rate_bps: 30
                total_lp_count: 2
                pending_commits: []
                updated_at: "2026-06-18T09:58:00Z"
        "404":
          description: |
            Pool not found. Declared by the platform document; in practice the delivered
            handler returns 422 (below) for an unavailable pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "not found"
        "422":
          description: |
            Pool status unavailable (`POOL_STATUS_UNAVAILABLE`). Observed in the
            delivered handler where the platform document declares 404.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmmErrorResponse"
              example:
                error: "pool status unavailable"
                error_code: "POOL_STATUS_UNAVAILABLE"

  /api/v2/amm/hub-liquidity-config:
    get:
      tags: [AMM Swap]
      summary: Sovereign Hub AMM configuration for swap clients
      description: |
        Central Bank gateways expose the Hub AMM configuration that commercial-bank swap
        clients need. Public — no credentials required.

        `Spec gap:` the platform declares the 200 body as a free-form object. The shape
        below is the delivered `HubLiquidityConfig` struct the handler serialises, and is
        marked `x-cbweb3-source: implementation-observed`.

        Every field is read from the gateway's environment, so this endpoint reports **one
        gateway's deployment**, not network state. Only a Central Bank gateway with
        `SOVEREIGN_AMM_ADDRESS` set answers 200 at all.

        `Undocumented status code:` **404** `HUB_LIQUIDITY_NOT_CONFIGURED` on a gateway
        without `SOVEREIGN_AMM_ADDRESS` set.
      operationId: getHubLiquidityConfig
      security: []
      responses:
        "200":
          description: Hub liquidity configuration for this gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubLiquidityConfig"
              example:
                sovereign_amm_address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
                sovereign_hub_token_a_address: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
                sovereign_hub_token_b_address: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
                default_sovereign_pool_pair: "W-BRL-ARS"
        "404":
          description: |
            Hub liquidity is not configured on this gateway
            (`HUB_LIQUIDITY_NOT_CONFIGURED`). Not declared in the platform document.
          x-cbweb3-source: implementation-observed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmmErrorResponse"
              example:
                error: "sovereign hub liquidity is not configured on this gateway"
                error_code: "HUB_LIQUIDITY_NOT_CONFIGURED"

  /api/v2/amm/hub-config:
    get:
      tags: [AMM Swap]
      summary: Hub contract discovery metadata
      description: |
        Hub contract addresses (AMM, PairRegistry, CurrencyRegistry) read from the
        gateway environment. **Registered on every gateway** regardless of which AMM
        services are wired, and unauthenticated — the addresses are public on-chain.

        Together with `GET /api/v2/hub/currencies`, `GET /api/v2/amm/pairs` and
        `GET /api/v2/amm/pool/{pair}/status`, this is the credential-free entry point
        for discovering a CBWeb3 network.
      operationId: getHubContractsConfig
      security: []
      responses:
        "200":
          description: Hub contract addresses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HubContractsConfig"
              example:
                amm_address: "0x1234abcd..."
                pair_registry: "0x5678ef01..."
                currency_registry: "0x9abc2345..."

  # ===========================================================================
  # Bridge — spoke tCeBM <-> Hub W-tCeBM
  # ===========================================================================

  /api/v2/bridge/lock-mint:
    post:
      tags: [AMM Bridge]
      summary: Lock spoke tCeBM and mint Hub W-tCeBM
      description: |
        Moves value from a spoke to the Hub: the spoke tCeBM is locked and the mirrored
        Hub token `W-tCeBM_<CUR>` is minted against it. Used directly by Central Banks
        to seed liquidity; used indirectly (via the relay, never by the client) as step 1
        of a cross-currency swap.

        The request needs only `{amount}`. `owner_bank_id` comes from the session
        `bankId` claim and `spoke_network` / `native_asset` / `mirrored_asset` come from
        gateway configuration — all four exist in the request struct but are
        **deprecated** and used only if configuration is unset.

        Router gate: cookie **or** bearer auth, plus `commercial_bank` or `central_bank`.

        This is one of the two chokepoints where the Central Bank's daily transfer limit
        is checked and atomically deducted before value moves.

        `Spec divergence:` the platform document declares **200**; the delivered handler
        returns **201**. This contract documents 201.

        `Undocumented status code:` **422** `TRANSFER_LIMIT_EXCEEDED` when the CB's daily
        limit relay refuses.
      operationId: bridgeLockMint
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeLockMintRequest"
            example:
              amount: "1000000000000000000000"
      responses:
        "201":
          description: |
            Bridge position created (lock + mint enqueued). Poll
            `GET /api/v2/bridge/positions` until `bridge_state` reads `ACTIVE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgePositionResult"
              example:
                position_id: "9e1c4b77-2f10-4a8d-9c31-6b4e7d2a1f05"
                owner_bank_id: "central_bank_a"
                spoke_network: "spoke-brl"
                native_asset: "tCeBM_BRL"
                mirrored_asset: "W-tCeBM_BRL"
                mirrored_amount: "1000000000000000000000"
                bridge_state: "LOCKING"
                relayer_retries: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            Daily transfer limit exceeded, or the lock-and-enqueue step failed.

            **Only the limit branch carries `error_code`.** The enqueue-failure branch
            returns a bare `{error}` body, so a client must not require the code. Not
            declared in the platform document; observed in the delivered handler.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AmmErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              examples:
                limitExceeded:
                  summary: Coded — daily transfer limit relay refused
                  value:
                    error: "daily transfer limit exceeded"
                    error_code: "TRANSFER_LIMIT_EXCEEDED"
                enqueueFailed:
                  summary: Uncoded — lock-and-enqueue failed
                  value:
                    error: "lock and enqueue: execution reverted"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/bridge/burn-unlock:
    post:
      tags: [AMM Bridge]
      summary: Burn Hub W-tCeBM and unlock spoke tCeBM
      description: |
        The inverse of lock-mint, for an existing position: the Hub mirrored token is
        burned and the spoke tCeBM it was backing is unlocked.

        Router gate: cookie **or** bearer auth, plus `commercial_bank` or `central_bank`.
      operationId: bridgeBurnUnlock
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeBurnUnlockRequest"
            example:
              position_id: "9e1c4b77-2f10-4a8d-9c31-6b4e7d2a1f05"
      responses:
        "200":
          description: Burn + unlock enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgePositionResult"
              example:
                position_id: "9e1c4b77-2f10-4a8d-9c31-6b4e7d2a1f05"
                owner_bank_id: "central_bank_a"
                spoke_network: "spoke-brl"
                native_asset: "tCeBM_BRL"
                mirrored_asset: "W-tCeBM_BRL"
                mirrored_amount: "1000000000000000000000"
                bridge_state: "BURNING"
                relayer_retries: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            Burn-and-enqueue failed. Not declared in the platform document; observed in
            the delivered handler, which returns a bare `{error}` body here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "burn and enqueue failed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/bridge/positions:
    get:
      tags: [AMM Bridge]
      summary: List bridge positions held by this gateway
      description: |
        Poll this after `bridgeLockMint` until the position reads `bridge_state: ACTIVE`,
        and after a cross-currency swap to confirm the bridge-out position reached
        `BURNED` or `RELEASED`.

        `Spec divergence (two of them):`

        1. The platform document declares the 200 body as a **bare JSON array**; the
           delivered handler returns a wrapped object `{"positions": [...]}`. A client
           deserialising into an array per the document fails. This contract documents
           the wrapped object.
        2. The `state` query parameter's example reads `PENDING, ACTIVE, CLOSED`.
           **`PENDING` and `CLOSED` do not exist.** The real bridge-state vocabulary is
           `LOCKING`, `ACTIVE`, `BURNING`, `BURNED`, `RELEASED`,
           `RECONCILIATION_REQUIRED`, recovered from `internal/domain` and absent from
           the platform document entirely. Do not copy the upstream example.

        Router gate: cookie **or** bearer auth, plus `commercial_bank` or `central_bank`.
      operationId: listBridgePositions
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: state
          in: query
          required: false
          description: |
            Optional bridge-state filter. Observed values: `LOCKING`, `ACTIVE`,
            `BURNING`, `BURNED`, `RELEASED`, `RECONCILIATION_REQUIRED`. Left as a free
            string rather than an enum because the platform document makes no commitment
            to this vocabulary.
          schema:
            type: string
          example: "ACTIVE"
      responses:
        "200":
          description: Bridge positions, wrapped in a `positions` key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBridgePositionsResponse"
              example:
                positions:
                  - position_id: "9e1c4b77-2f10-4a8d-9c31-6b4e7d2a1f05"
                    owner_bank_id: "central_bank_a"
                    spoke_network: "spoke-brl"
                    native_asset: "tCeBM_BRL"
                    mirrored_asset: "W-tCeBM_BRL"
                    mirrored_amount: "1000000000000000000000"
                    bridge_state: "ACTIVE"
                    relayer_retries: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: |
            Position listing failed. Not declared in the platform document; observed in
            the delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "failed to list positions"

  # ===========================================================================
  # Liquidity provisioning and reconciliation
  # ===========================================================================

  /api/v2/amm/hub-reconciliation:
    get:
      tags: [AMM Liquidity]
      summary: Reconcile this Central Bank's Hub W-token balance against its records
      description: |
        Treasury-facing. Reports the Central Bank's omnibus Hub balance, what in-flight
        payments legitimately still hold, and the part it cannot attribute.

        **`unexplained` is the number that matters; at rest it should be zero**, and
        `balanced` is true exactly when it is. `stranded_total` is context, not a
        deduction. `unattributed` covers settled positions whose trade cost was never
        recorded — deliberately excluded from `expected_in_flight` because on-chain they
        hold nothing.

        A read failure is an error (500), never an empty report — a fabricated zero on a
        reconciliation endpoint would be worse than no answer.

        Router gate: cookie **or** bearer auth, plus the `central_bank` realm role.
      operationId: getHubReconciliation
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Reconciliation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReport"
              example:
                w_token: "0x1234abcd..."
                holder_address: "0x5678ef01..."
                on_chain_balance: "1000000000000000000000"
                expected_in_flight: "1000000000000000000000"
                unexplained: "0"
                stranded_total: "0"
                per_bank:
                  - owner_bank_id: "bank-itau"
                    amount: "1000000000000000000000"
                    positions: 1
                stranded: []
                unattributed: []
                balanced: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Reconciliation failed — the cause is logged, not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "reconciliation failed"
        "503":
          description: |
            Not configured on this gateway (needs `HUB_BESU_RPC_URL`, `W_TOKEN_ADDRESS`
            and this Central Bank's hub address).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "hub reconciliation not configured"

  /api/v2/amm/liquidity/deposit-side:
    post:
      tags: [AMM Liquidity]
      summary: Deposit this Central Bank's own side of a pair into escrow
      description: |
        Sovereign seeding, the alternative to commit-reveal. Mints the caller Central
        Bank's own W-token, approves the pool's AMM, and escrows **that side only**.

        **The side is auto-resolved on-chain from the pair — there is no picker.** This
        replaced an earlier dual-sided `/api/v2/amm/liquidity/add` that let one Central
        Bank supply both sides of a corridor; that was a sovereignty breach and the
        endpoint no longer exists.

        Router gate: cookie auth plus the liquidity-provider roles (`central_bank` or
        `mlp`).
      operationId: depositLiquiditySide
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositSideRequest"
            example:
              pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
              amount: "1000000000000000000000"
      responses:
        "201":
          description: Side escrowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositSideResponse"
              example:
                pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
                side: "A"
                amount: "1000000000000000000000"
                status: "DEPOSITED"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Mint/approve failed (MINT_APPROVE_FAILED) or the escrow deposit reverted (DEPOSIT_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SovereignSeedError"
              example:
                error: "escrow deposit reverted"
                error_code: "DEPOSIT_FAILED"
                hint: "verify the AMM allowance and retry"

  /api/v2/amm/liquidity/finalize:
    post:
      tags: [AMM Liquidity]
      summary: Finalize a pool once both sides are escrowed
      description: |
        Funds both reserves atomically, making the pool tradeable. Returns **409**
        (`FINALIZE_INCOMPLETE`) while the counterpart Central Bank's side is still
        pending — neither CB can force the corridor open alone.
      operationId: finalizeLiquidityCommit
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolPairRequest"
            example:
              pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
      responses:
        "200":
          description: Pool funded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeResponse"
              example:
                pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
                status: "FINALIZED"
                shares_a: "500000000000000000000"
                shares_b: "500000000000000000000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Both sides must be deposited before finalize
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SovereignSeedError"
              example:
                error: "counterpart side not yet deposited"
                error_code: "FINALIZE_INCOMPLETE"
                hint: "poll GET /api/v2/amm/liquidity/escrow until side_b_deposited is true"

  /api/v2/amm/liquidity/reclaim-side:
    post:
      tags: [AMM Liquidity]
      summary: Reclaim this Central Bank's own pending escrowed side
      description: |
        Pulls back the caller's escrowed side **before** finalize — the escape hatch when
        a counterpart never commits. A Central Bank can only ever reclaim its own side.
      operationId: reclaimLiquiditySide
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolPairRequest"
            example:
              pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
      responses:
        "200":
          description: Side reclaimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclaimSideResponse"
              example:
                pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
                side: "A"
                status: "RECLAIMED"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Reclaim failed (RECLAIM_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SovereignSeedError"
              example:
                error: "reclaim reverted"
                error_code: "RECLAIM_FAILED"
                hint: "the pool may already be finalized"

  /api/v2/amm/liquidity/escrow:
    get:
      tags: [AMM Liquidity]
      summary: Per-side escrow commit state for a pool
      description: |
        Current per-side escrow state, polled by the governance portal between
        `deposit-side` and `finalize`. `side_a_deposited` / `side_b_deposited` tell each
        Central Bank whether its counterpart has committed yet.
      operationId: getLiquidityEscrowState
      security:
        - CookieAuth: []
      parameters:
        - name: pool_pair
          in: query
          required: true
          description: Pool pair identifier, e.g. W-tCeBM_BRL/W-tCeBM_ARS.
          schema:
            type: string
          example: "W-tCeBM_BRL/W-tCeBM_ARS"
      responses:
        "200":
          description: Escrow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscrowStatus"
              example:
                side_a_deposited: true
                side_b_deposited: false
                amount_a: "1000000000000000000000"
                amount_b: "0"
                finalized: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/amm/liquidity/commit:
    post:
      tags: [AMM Liquidity]
      summary: Register a liquidity commit (cooperative commit-reveal)
      description: |
        The path the platform's own end-to-end test uses to make a pool `ACTIVE`. Each
        Central Bank commits its own side; a Cacti watcher observes `CommitMatched` and
        the relay executes both commits together. Poll
        `GET /api/v2/amm/liquidity/commits/{commit_id}` until `status` is `EXECUTED`.

        Router gate: cookie **or** bearer auth, plus the liquidity-provider roles
        (`central_bank` or `mlp`).

        `Spec divergence:` the platform document declares **200**; the delivered handler
        returns **201 Created**. This contract documents 201.

        `Undocumented status codes:` **409** (`COMMIT_ALREADY_EXISTS`,
        `SAME_PROVIDER_BOTH_SIDES` and the other `CommitError` codes), **403**
        (`NOT_AUTHORIZED_LP` — the same `CommitError` envelope, keyed `error_code`),
        **422** (`COMMIT_SIDE_NOT_CONFIGURED`, `BRIDGE_POSITION_NOT_ACTIVE`,
        `INSUFFICIENT_BALANCE`, `ON_CHAIN_COMMIT_FAILED` — keyed `code`, not
        `error_code`) and **500**.
      operationId: commitLiquidity
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiquidityCommitRequest"
            example:
              pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
              provider_id: "central_bank_a"
              side: "A"
              amount: "1000000000000000000000"
      responses:
        "201":
          description: |
            Commit registered. Poll `GET /api/v2/amm/liquidity/commits/{commit_id}`
            until `status` reads `EXECUTED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiquidityCommitResponse"
              example:
                commit_id: "cmt-3f8a2b19"
                pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
                side: "A"
                amount: "1000000000000000000000"
                status: "PENDING"
                expires_at: "2026-06-18T10:58:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The caller is not an authorised liquidity provider for this pool
            (`NOT_AUTHORIZED_LP`). Not declared in the platform document; observed in
            the delivered handler, which uses the `error_code` envelope here rather
            than the router's plain 403.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmmErrorResponse"
              example:
                error: "provider is not an authorised liquidity provider"
                error_code: "NOT_AUTHORIZED_LP"
        "409":
          description: |
            The commit conflicts with an existing one — for example a duplicate commit
            for the same (pool, provider, side), or the same provider attempting to
            hold both sides. Not declared in the platform document; observed in the
            delivered handler, which returns the service's `CommitError` code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmmErrorResponse"
              example:
                error: "a pending commit already exists for this provider and side"
                error_code: "COMMIT_ALREADY_EXISTS"
        "422":
          description: |
            The commit cannot be accepted. Not declared in the platform document;
            observed in the delivered handler, which keys the machine-readable value
            `code` here (not `error_code`):

            - `COMMIT_SIDE_NOT_CONFIGURED` — the side could not be resolved from the
              pair, the gateway configuration or the body.
            - `BRIDGE_POSITION_NOT_ACTIVE` — sovereign pair with no confirmed bridge
              position for this side yet; wait for the Relayer.
            - `INSUFFICIENT_BALANCE` — the Hub signer holds less W-tCeBM than the
              commit amount; lock-mint more first.
            - `ON_CHAIN_COMMIT_FAILED` — `LiquidityCommitRegistry.registerCommit`
              reverted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryErrorResponse"
              example:
                error: "insufficient W-tCeBM balance — lock-mint at least the commit amount before committing"
                code: "INSUFFICIENT_BALANCE"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/amm/liquidity/commits:
    get:
      tags: [AMM Liquidity]
      summary: List liquidity commits
      description: |
        Lists this gateway's commits for one pool, optionally narrowed by status.

        `Spec divergence:` the platform document declares an optional query parameter
        named `pool` and a bare JSON array response. The delivered handler reads
        **`pool_pair`**, rejects the call with **400** when it is absent, and wraps the
        result as `{commits, count}`. This contract documents the delivered behaviour.

        `Spec divergence:` the item type (`domain.PoolCommit`) carries GORM column tags
        but **no JSON tags**, so Go marshals it with its Go field names — `CommitID`,
        `PoolPair`, … in PascalCase — not the snake_case used everywhere else on this
        surface. The delivered governance front end consumes exactly those keys
        (`frontend/apps/governance/src/types/liquidity.types.ts`, `CommitListItem`).
      operationId: listLiquidityCommits
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: pool_pair
          in: query
          required: true
          description: |
            Pool pair to list commits for. Mandatory: the delivered handler answers
            **400** when it is missing. Take the value verbatim from `listPairs`.
          schema:
            type: string
          example: "W-tCeBM_BRL/W-tCeBM_ARS"
        - name: status
          in: query
          required: false
          description: Filter by commit status, e.g. PENDING or EXECUTED.
          schema:
            type: string
          example: "EXECUTED"
      responses:
        "200":
          description: Commits for the requested pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiquidityCommitListResponse"
              example:
                commits:
                  - CommitID: "cmt-3f8a2b19"
                    PoolPair: "W-tCeBM_BRL/W-tCeBM_ARS"
                    ProviderID: "central_bank_a"
                    Side: "A"
                    Amount: "1000000000000000000000"
                    Status: "EXECUTED"
                    CounterpartCommitID: "cmt-7d2e5c41"
                    OnChainCommitID: "3q2+7w=="
                    CreatedAt: "2026-06-18T09:58:00Z"
                    ExpiresAt: "2026-06-18T10:58:00Z"
                count: 1
        "400":
          description: |
            `pool_pair` was not supplied. Not declared in the platform document;
            observed in the delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "pool_pair query parameter required"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/amm/liquidity/commits/{commit_id}:
    get:
      tags: [AMM Liquidity]
      summary: Get a single liquidity commit (status polling)
      description: |
        Poll until `Status` reads `EXECUTED`, which means the Cacti watcher matched both
        Central Banks' commits and the relay funded the pool.

        `Spec divergence:` the delivered handler returns the persisted
        `domain.PoolCommit` record, which has no JSON tags and therefore marshals with
        **PascalCase** Go field names — the same shape `listLiquidityCommits` puts in
        its `commits` array, and not the snake_case body `commitLiquidity` returns.
      operationId: getLiquidityCommit
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommitId"
      responses:
        "200":
          description: Commit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiquidityCommit"
              example:
                CommitID: "cmt-3f8a2b19"
                PoolPair: "W-tCeBM_BRL/W-tCeBM_ARS"
                ProviderID: "central_bank_a"
                Side: "A"
                Amount: "1000000000000000000000"
                Status: "EXECUTED"
                CounterpartCommitID: "cmt-7d2e5c41"
                OnChainCommitID: "3q2+7w=="
                CreatedAt: "2026-06-18T09:58:00Z"
                ExpiresAt: "2026-06-18T10:58:00Z"
        "400":
          description: |
            `commit_id` was empty. Not declared in the platform document; observed in
            the delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "commit_id required"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [AMM Liquidity]
      summary: Cancel a liquidity commit
      description: |
        Withdraws a commit that has not yet been matched and executed. The platform
        declares no response body for this operation.
      operationId: cancelLiquidityCommit
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommitId"
      responses:
        "200":
          description: Commit cancelled. No response body is declared by the platform.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/amm/liquidity/positions:
    get:
      tags: [AMM Liquidity]
      summary: List this gateway's LP positions
      description: |
        Public — each Central Bank gateway reports only its own positions, from its own
        database. There is no network-wide view, by design. Only `ACTIVE` positions are
        returned.

        `Spec divergence:` the platform document declares no query parameters and a bare
        JSON array. The delivered handler **requires** `pool_pair` (400 without it),
        additionally accepts an optional `provider_id` filter, and wraps the result as
        `{pool_pair, positions, count}`. This contract documents the delivered
        behaviour; the delivered governance front end consumes exactly that envelope
        (`frontend/apps/governance/src/types/liquidity.types.ts`, `LpPositionsResponse`).
      operationId: listLiquidityPositions
      security: []
      parameters:
        - name: pool_pair
          in: query
          required: true
          description: |
            Pool pair to list positions for. Mandatory: the delivered handler answers
            **400** `INVALID_REQUEST` when it is missing. Take the value verbatim from
            `listPairs`.
          schema:
            type: string
          example: "W-tCeBM_BRL/W-tCeBM_ARS"
        - name: provider_id
          in: query
          required: false
          description: |
            Optional filter, narrowing the result to one provider bank. Not declared in
            the platform document; observed in the delivered handler.
          schema:
            type: string
          example: "central_bank_a"
      responses:
        "200":
          description: LP positions held by this gateway for the requested pool.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiquidityPositionListResponse"
              example:
                pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
                positions:
                  - lp_id: "lp-9c1e4a20"
                    provider_bank_id: "central_bank_a"
                    pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
                    token_a_contributed: "1000000000000000000000"
                    token_b_contributed: "0"
                    lp_shares: "500000000000000000000"
                    status: "ACTIVE"
                    deposit_side: "A"
                    added_at: "2026-06-18T09:58:00Z"
                    commit_id: "cmt-3f8a2b19"
                count: 1
        "400":
          description: |
            `pool_pair` was not supplied. Not declared in the platform document;
            observed in the delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryErrorResponse"
              example:
                error: "pool_pair query parameter is required"
                code: "INVALID_REQUEST"
        "500":
          description: |
            The position store could not be read. Not declared in the platform
            document; observed in the delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryErrorResponse"
              example:
                error: "failed to retrieve LP positions"
                code: "DATABASE_ERROR"
        "501":
          description: |
            This gateway has no LP position repository wired, so it cannot answer.
            Not declared in the platform document; observed in the delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryErrorResponse"
              example:
                error: "LP position listing not enabled"
                code: "NOT_IMPLEMENTED"

  /api/v2/amm/lp-balance:
    get:
      tags: [AMM Liquidity]
      summary: On-chain CBW3-LP share balance for this gateway's signer
      description: |
        Public. Answers only when the LP balance reader is wired; a gateway built
        without one returns **501**, and a gateway that never registers the route at
        all returns 404.

        `Spec gap:` the platform declares the body as a free-form object. The four keys
        below are the ones the delivered handler emits, and the ones the delivered
        governance front end reads (`LpBalanceResponse` in
        `frontend/apps/governance/src/types/liquidity.types.ts`).
      operationId: getLPBalance
      security: []
      responses:
        "200":
          description: LP-share balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LPBalanceResponse"
              example:
                lp_shares: "500000000000000000000"
                lp_total_supply: "1000000000000000000000"
                share_percentage: 50
                holder: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
        "501":
          description: |
            No LP balance reader is configured on this gateway (the AMM client is
            unavailable). Not declared in the platform document; observed in the
            delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "lp-balance reader not configured (AMM client unavailable)"
        "502":
          description: |
            The on-chain read failed — `read LP balance: ...` or
            `read LP total supply: ...`. Not declared in the platform document;
            observed in the delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "read LP balance: connection refused"

  /api/v2/amm/liquidity/remove:
    post:
      tags: [AMM Liquidity]
      summary: Remove liquidity (sovereign Central Bank withdrawal)
      description: |
        Withdraws a Central Bank's liquidity, supporting partial exit by fraction:
        `fraction_bps` is in basis points, so `4000` means 40%.

        Router gate: cookie **or** bearer auth, plus the liquidity-provider roles.
      operationId: removeLiquidity
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveLiquidityRequest"
            example:
              pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
              provider_bank_id: "central_bank_a"
              lp_id: "lp-9c1e4a20"
              fraction_bps: 4000
      responses:
        "200":
          description: Liquidity removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveLiquidityResponse"
              example:
                token_a_amount: "200000000000000000000"
                token_b_amount: "170000000000000000000"
                lp_shares: "200000000000000000000"
                withdrawal_mode: "SHARES_HOME_CURRENCY_PARTIAL"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/amm/liquidity/sovereign-add:
    post:
      tags: [AMM Liquidity]
      summary: Sovereign Central Bank direct liquidity top-up
      description: |
        Direct sovereign top-up into an **already ACTIVE** sovereign pair — no bridge
        gate and no commit-reveal. It exists for deposits after the initial bilateral
        match; it cannot be used to open a pool.

        The depositing Central Bank is taken from the session, never from the body, and
        the on-chain holder is the gateway's configured Hub signer. The Central Bank must
        already hold enough Hub W-token: the handler runs a pre-flight balance check and
        refuses **before** any on-chain transaction.

        `Spec gap:` the platform declares both the request and the response as free-form
        objects. The shapes below were recovered from the delivered handler and are
        marked `x-cbweb3-source: implementation-observed`.

        `Spec divergence:` the platform document declares a 200; the handler returns
        **201**. Several failure codes are undeclared upstream and are declared here.

        Router gate: cookie **or** bearer auth, plus the liquidity-provider roles.
      operationId: sovereignAddLiquidity
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SovereignAddLiquidityRequest"
            example:
              pool_pair: "W-BRL-ARS"
              amount: "1000000000000000000"
              is_token_a: true
      responses:
        "201":
          description: Sovereign liquidity added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SovereignAddLiquidityResponse"
              example:
                status: "ok"
                pool_pair: "W-BRL-ARS"
                amount: "1000000000000000000"
                side: "A"
        "400":
          description: |
            Malformed body, missing `pool_pair` / `amount`, an `amount` that is not a
            base-10 integer string, or a pair that is not a sovereign pair
            (`NOT_SOVEREIGN_PAIR`). The last case is undeclared upstream.

            **Only the not-a-sovereign-pair branch carries `code`.** The three
            validation branches return a bare `{error}` body, so a client must not
            require the code.
          x-cbweb3-source: implementation-observed
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/RegistryErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingFields:
                  summary: Uncoded — validation failure
                  value:
                    error: "pool_pair and amount required"
                notSovereignPair:
                  summary: Coded — the pair is not sovereign
                  value:
                    error: "pool_pair is not a sovereign pair"
                    code: "NOT_SOVEREIGN_PAIR"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: |
            The Central Bank does not hold enough Hub W-token for the requested side
            (`INSUFFICIENT_BALANCE`), or the deposit failed on chain. Undeclared
            upstream.

            **Only the balance branch carries `code`.** The on-chain execution failure
            returns a bare `{error}` body.
          x-cbweb3-source: implementation-observed
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/RegistryErrorResponse"
                  - $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficientBalance:
                  summary: Coded — pre-flight balance check refused
                  value:
                    error: "insufficient W-tCeBM balance for direct deposit"
                    code: "INSUFFICIENT_BALANCE"
                executionFailed:
                  summary: Uncoded — the deposit reverted on chain
                  value:
                    error: "execute matched commit: execution reverted"
        "500":
          description: |
            The pre-flight balance read itself failed (a bare `{error}` body carrying
            the underlying cause). Undeclared upstream; observed in the delivered
            handler.
          x-cbweb3-source: implementation-observed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "read W-tCeBM balance: connection refused"
        "501":
          description: |
            Sovereign liquidity is not wired on this gateway. Undeclared upstream, and a
            deployment fact rather than a client error — treat it as "not applicable to
            this node", not as non-conformance.
          x-cbweb3-source: implementation-observed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "sovereign liquidity service not configured"

  # ===========================================================================
  # AMM token preparation
  # ===========================================================================

  /api/v2/amm/token/mint-and-approve:
    post:
      tags: [AMM Token]
      summary: Mint this Central Bank's Hub W-token and approve the AMM
      description: |
        Prepares a Central Bank to seed liquidity: mints its own Hub W-token and grants
        the AMM an allowance over it. Enforces the anti-cross guard when the CB checker
        is wired, so a Central Bank cannot mint a currency that is not its own.

        Router gate: cookie **or** bearer auth, plus the `central_bank` realm role.
      operationId: mintAndApprove
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintAndApproveRequest"
            examples:
              seedOwnSide:
                summary: Central Bank seeding its own side (no recipient)
                value:
                  amount: "1000000000000000000000"
              mintToParticipant:
                summary: Mint to a named recipient (anti-cross guard applies)
                value:
                  amount: "1000000000000000000000"
                  recipient: "0x4a3b8f21c0d95e7a6b1f2c3d4e5f60718293a4b5"
                  pool_pair: "W-tCeBM_BRL/W-tCeBM_ARS"
                  side: "A"
      responses:
        "200":
          description: Mint + approve submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintAndApproveResponse"
              example:
                status: "ok"
                amount: "1000000000000000000000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Insufficient role, **or** the anti-cross guard rejected the mint: minting to
            another Central Bank's address is prohibited and answers
            `code: CROSS_CB_MINT_PROHIBITED`.

            `Spec divergence:` the platform document declares only the shared 403
            ("insufficient permissions"); this second, policy-driven 403 is emitted by
            the delivered handler.
          x-cbweb3-source: implementation-observed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryErrorResponse"
              examples:
                insufficientRole:
                  value:
                    error: "insufficient permissions"
                    code: "FORBIDDEN"
                crossCentralBankMint:
                  value:
                    error: "minting to another Central Bank address is prohibited (anti-G5-cross policy)"
                    code: "CROSS_CB_MINT_PROHIBITED"

  /api/v2/amm/token/approve-amm:
    post:
      tags: [AMM Token]
      summary: Grant an AMM allowance (Central or commercial bank)
      description: |
        Grants the AMM an allowance without minting.

        `Spec gap:` request and response are declared free-form upstream with no field
        list. The shapes below were recovered from the delivered handler and are marked
        `x-cbweb3-source: implementation-observed`; nothing beyond what that handler
        reads and writes is declared.

        `side` is derived server-side from the gateway's `BANK_CODE` when one is
        configured, in which case any `side` in the body is **ignored entirely**. A
        commercial-bank gateway with no `BANK_CODE` answers **400**
        `COMMIT_SIDE_NOT_CONFIGURED`.

        Router gate: cookie **or** bearer auth, plus `central_bank` or `commercial_bank`.
      operationId: approveAMM
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveAMMRequest"
            example:
              amount: "1000000000000000000000"
      responses:
        "200":
          description: Allowance granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveAMMResponse"
              example:
                status: "ok"
                amount: "1000000000000000000000"
                side: "A"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ===========================================================================
  # Hub currency registry and AMM pair registry
  # ===========================================================================

  /api/v2/hub/token/supply:
    get:
      tags: [Hub Currency Registry]
      summary: Outstanding supply of this Central Bank's wrapped token
      description: |
        How much of this Central Bank's domestic reserves are currently bridged to the
        hub, as `W-tCeBM_<CUR>`. **Deliberately scoped to one currency**: a network-wide
        total would mix currencies and double-count the same backing.

        Read-only public on-chain state, so unauthenticated. A hub RPC failure is a
        **502**, never a fabricated zero.
      operationId: getSovereignTokenSupply
      security: []
      responses:
        "200":
          description: Sovereign wrapped-token supply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SovereignSupply"
              example:
                symbol: "W-tCeBM_BRL"
                token_address: "0x1234abcd..."
                total_supply: "1000000000000000000000"
                decimals: 18
        "502":
          description: Hub RPC read failed (ONCHAIN_ERROR); the cause is logged, not returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "failed to read token supply"

  /api/v2/hub/currencies:
    get:
      tags: [Hub Currency Registry]
      summary: List registered hub currencies
      description: |
        Maps each fiat symbol to its Hub W-token address and the Central Bank that
        proposed it. Unauthenticated — one of the four credential-free discovery calls.

        `Spec divergence:` the platform document declares the 200 body as a **bare JSON
        array**; the delivered handler returns `{"currencies": [...]}`. This contract
        documents the wrapped object, which is what a client actually receives.
      operationId: listHubCurrencies
      security: []
      responses:
        "200":
          description: Registered currencies, wrapped in a `currencies` key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListHubCurrenciesResponse"
              example:
                currencies:
                  - symbol: "W-tCeBM_BRL"
                    country_name: "Brazil"
                    token_address: "0x1234abcd..."
                    proposer_cb: "central_bank_a"
                  - symbol: "W-tCeBM_ARS"
                    country_name: "Argentina"
                    token_address: "0x5678ef01..."
                    proposer_cb: "central_bank_b"
        "500":
          description: |
            Currency listing failed (`ONCHAIN_ERROR`). Not declared in the platform
            document; observed in the delivered handler, which uses the `code` key
            rather than `error_code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryErrorResponse"
              example:
                error: "failed to list currencies"
                code: "ONCHAIN_ERROR"

    post:
      tags: [Hub Currency Registry]
      summary: Register a hub currency (Central Bank)
      description: |
        A Central Bank registers its own currency on the hub, which deploys and records
        the corresponding W-token. Step 0 of opening a corridor.

        `Spec divergence:` the platform document declares **200** with no schema; the
        delivered handler returns **201** with the service result. This contract
        documents 201.

        `Undocumented status code:` **409** with `code` `CURRENCY_ALREADY_EXISTS` or
        `TOKEN_ALREADY_REGISTERED`.

        Router gate: cookie auth plus the `central_bank` realm role. Note the 403 carries
        `code: UNAUTHORIZED`.
      operationId: registerHubCurrency
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterHubCurrencyRequest"
            example:
              symbol: "W-tCeBM_BRL"
              country_name: "Brazil"
              token_address: "0x1234abcd..."
              proposer_cb: "central_bank_a"
      responses:
        "201":
          description: |
            Currency registered. The body is the service result — **two fields**, not
            the registry record; `country_name`, `token_address` and `proposer_cb` are
            not echoed back. Read the full record from `listHubCurrencies`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterHubCurrencyResult"
              example:
                symbol: "W-tCeBM_BRL"
                tx_hash: "0x4a1f7c3e9b5d2a8f6c0e4d1b7a3f9c5e2d8b6a0f4c1e7d3b9a5f2c8e6d0b4a1f"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The currency symbol or the token address is already registered. Not declared
            in the platform document; observed in the delivered handler.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryErrorResponse"
              examples:
                currencyExists:
                  value:
                    error: "currency already exists"
                    code: "CURRENCY_ALREADY_EXISTS"
                tokenExists:
                  value:
                    error: "token already registered"
                    code: "TOKEN_ALREADY_REGISTERED"
        "500":
          description: On-chain registration failed (`ONCHAIN_ERROR`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryErrorResponse"
              example:
                error: "failed to register currency"
                code: "ONCHAIN_ERROR"

  /api/v2/hub/currencies/{symbol}:
    delete:
      tags: [Hub Currency Registry]
      summary: Remove a hub currency (Central Bank)
      description: |
        Removes a currency from the hub registry. Only the Central Bank that registered
