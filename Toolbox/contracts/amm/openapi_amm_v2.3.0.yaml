                    besu_address: "0x1234abcd..."
                    deposit_id: "dep-a1b2c3d4"
                    amount: "5000000"
                    status: "APPROVED"
                    burn_tx_hash: "0x1234..."
                    mint_tx_hash: "0x5678..."
                    created_at: "2026-06-18T10:05:00Z"
                total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/payments/escrows/approve:
    post:
      tags: [Escrow]
      summary: Approve an escrow — burn fCeBM, mint tCeBM (Central Bank only)
      description: |
        Burns the requester's fCeBM on Besu and mints the equivalent tCeBM via
        Zeto/Paladin to the requester's Paladin identity. Returns both transaction
        hashes: `burn_tx_hash` (Besu) and `mint_tx_hash` (Paladin).

        After this succeeds, poll `GET /api/v1/token/balance` until the tCeBM balance is
        non-zero — that is the signal that the payer bank is ready to settle.
      operationId: approveEscrow
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscrowIdRequest"
            example:
              escrow_id: "esc-a1b2c3d4"
      responses:
        "201":
          description: Escrow approved — fCeBM burned, tCeBM minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveEscrowResponse"
              example:
                burn_tx_hash: "0x1234..."
                mint_tx_hash: "0x5678..."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/payments/escrows/reject:
    post:
      tags: [Escrow]
      summary: Reject an escrow request (Central Bank only)
      description: Terminal rejection of a pending tokenisation escrow, with an optional reason.
      operationId: rejectEscrow
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscrowRejectRequest"
            example:
              escrow_id: "esc-a1b2c3d4"
              reason: "deposit not settled"
      responses:
        "200":
          description: Escrow rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReasonAcknowledgement"
