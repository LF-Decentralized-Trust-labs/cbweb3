openapi: 3.0.3

info:
  title: CBWeb3 Toolbox — Hub-and-Spoke Settlement Contract (Scenario B)
  version: 2.3.0
  description: |
    Normative interface contract for **cross-border settlement over the International
    Hub** on CBWeb3 **Scenario B** (hub-and-spoke), as delivered in **CBWeb3 API
    Gateway v2.3.0**.

    > **Scenario B has no HTLC endpoints and no FX agreement surface.** Not one of the
    > gateway's 100 paths contains `htlc`, and there is no `/fx/agreement` anywhere. A
    > grep of the whole Go tree finds a single stale comment and no handler, route or
    > service. The eight `LockHTLC*` / `HTLCLock` component schemas that appear in the
    > Scenario B platform document are unreferenced copy-paste residue from Scenario A
    > and are deliberately **not** published here. Atomic-swap settlement lives in
    > `Toolbox/contracts/pvp/` (Scenario A).

    Scenario B settles a cross-currency payment as: **Reserve Tokenisation → bridge-in
    (lock spoke tCeBM, mint Hub W-token) → Hub AMM swap → bridge-out (burn W-token,
    deliver on the target spoke) → residue return.**

    ## The settlement flow this contract describes

    Actors: **CB-A** (issuer of BRL, spoke-a), **CB-B** (issuer of ARS, spoke-b),
    **Bank-A** (payer, commercial, on spoke-a), **Bank-B** (beneficiary, on spoke-b).

    **Part 0 — corridor provisioning (Central Banks, once per corridor).**
    Each CB registers its currency (`POST /api/v2/hub/currencies`), which deploys its
    Hub W-token; the CB of tokenA proposes the pair
    (`POST /api/v2/amm/pairs/propose`) and the CB of tokenB confirms it
    (`POST /api/v2/amm/pairs/confirm`), activating the corridor. Two Central Banks are
    required — by design, one CB can never open a corridor alone.

    **Part 1 — make the pool ACTIVE (Central Banks).**
    Each CB bridges its own reserves (`POST /api/v2/bridge/lock-mint`), waits for
    `bridge_state` `ACTIVE`, mints and approves
    (`POST /api/v2/amm/token/mint-and-approve`), then supplies **only its own side** of
    the pool. Two provisioning paths exist and they are not interchangeable:

    * *Cooperative commit-reveal* — `POST /api/v2/amm/liquidity/commit` by each CB,
      matched off-chain by a Cacti watcher; poll
      `GET /api/v2/amm/liquidity/commits/{commit_id}` until `EXECUTED`. This is the
      path the platform's own end-to-end test uses.
    * *Sovereign escrow-and-finalize* — `deposit-side` / `finalize` / `reclaim-side`,
      where the side is auto-resolved on-chain and cannot be chosen by the caller.

    Both replaced an earlier dual-sided `/api/v2/amm/liquidity/add` that let one CB
    supply both sides; that was removed as a sovereignty breach and does not exist.

    **Part 2 — the payer bank obtains tokenised reserves. This step is mandatory.**
    Bank-A registers a fiat deposit (`POST /api/v1/payments/deposits`), CB-A approves
    it (minting fCeBM, the ERC-20 fiat token on Besu), then Bank-A requests a
    tokenisation escrow (`POST /api/v1/payments/escrows`) and CB-A approves it — burning
    fCeBM and minting **tCeBM** (the Zeto privacy token on Paladin). This is what the
    platform calls **Reserve Tokenisation**.

    It is a hard precondition, not an optional privacy step: the cross-currency
    bridge-in handler refuses a swap from a bank that does not already hold sufficient
    tCeBM — *"insufficient tokenized reserves: bank %s holds %s tCeBM, need %s — complete
    Reserve Tokenisation first"*. Note that enforcement is **disabled** when the gateway
    runs without `PAYMENT_GRPC_ADDR`, so a sandbox can silently accept a swap that
    production would refuse. Conformance runs must include the escrow step.

    **Part 3 — the cross-border payment (Bank-A driving). This is the only part a
    third-party integrator writes code for.**
    Discover the corridor (`GET /api/v2/amm/pairs`, `GET /api/v2/hub/currencies`),
    check the pool is `ACTIVE` (`GET /api/v2/amm/pool/{pair}/status`) and the breaker is
    not halted (`GET /api/v2/governance/circuit-breaker/status`), take a quote
    (`GET /api/v2/amm/quote/cross-currency`, **15-second TTL**), then
    `POST /api/v2/amm/swap/cross-currency` and poll
    `GET /api/v2/amm/swap/cross-currency/{id}` until `COMPLETED` or `FAILED`.

    **Part 4 — settlement verification.** Bank-A's tCeBM balance should have decreased by
    `amount_in`, **not** by `max_amount_in`; Bank-B's balance should be non-zero; the
    CB treasury's `GET /api/v2/amm/hub-reconciliation` should report
    `balanced: true` / `unexplained: "0"` at rest.

    ## The slippage buffer and the residue leg — read this before setting max_amount_in

    A cross-currency swap is exact-**output**: you name `amount_out` and a ceiling
    `max_amount_in`. Because the realised input is unknown until the AMM executes, the
    orchestrator **bridges in the full `max_amount_in`** first. The unspent remainder is
    then burned on the Hub and returned to the payer on its source spoke as a *separate*
    bridge position with `leg = RESIDUE`.

    The payer's true net debit is `amount_in`, not `max_amount_in`. `residue_status` is
    the field that makes an over-debit visible: `RETURN_FAILED` means the residue is
    still stranded on the Hub swap signer and **the payer has not been made whole**. A
    tutorial that sets a generous `max_amount_in` must explain this, and a conformance
    test should assert residue reconciliation, not merely `status == COMPLETED`.

    ## Why one POST produces asynchronous multi-Central-Bank state

    The cross-currency swap is **sovereign-delegated**. The commercial bank never holds
    a W-token and never signs on the Hub. Behind the single public POST, four relay-only
    steps run on Central Bank gateways: the payer's issuing CB performs the bridge-in
    (only it may mint `W-<source>`), that same CB signs the Hub AMM leg, the
    **beneficiary's** CB performs the bridge-out (CB-A burning CB-B's tokens would be a
    sovereignty breach), and the issuing CB returns the residue.

    Those four `/internal/amm/*` endpoints are **out of scope for this contract** — see
    below — but an integrator needs to know they exist to understand why the swap is
    asynchronous and why a failure can surface as `BRIDGE_OUT_FAILED` (the swap
    succeeded, the delivery did not, and manual intervention is required).

    ## Authentication and roles

    Cookie-based; see `Toolbox/contracts/auth/openapi_auth_v2.3.0.yaml`. Commercial banks
    must complete the two-step PKI nonce flow.

    `BearerAuth` is declared here — unlike in the Scenario A contract — because Scenario B
    genuinely supports it, but **only** on the `/api/v2` routes guarded by
    `RequireAnyAuth`, which the platform describes as "primarily machine-to-machine
    Central Bank sovereign flows". The swap endpoints are **cookie-only**.

    Scenario B's `/api/v2` surface uses a **separate role namespace** from `/api/v1`:
    lowercase, unprefixed Keycloak realm roles `central_bank`, `commercial_bank`, `mlp`.

    > **Naming trap.** The platform document writes "Requires ROLE_CENTRAL_BANK_SCENARIO_B"
    > on the transfer-limit endpoints. That string is the name of a **Go constant**, not a
    > role. A JWT will never contain a claim `ROLE_CENTRAL_BANK_SCENARIO_B`; the real
    > realm role is `central_bank`. The same applies to `commercial_bank` and `mlp`.

    Note also that the platform's shared 403 response is described as "requires
    CENTRAL_BANK role" and is referenced by the swap and bridge endpoints — which the
    router actually gates on `commercial_bank` (swaps) and `commercial_bank` **or**
    `central_bank` (bridge). The per-operation descriptions below state the real gate.

    ## Sixteen endpoints need no credentials at all

    The quote, pool-status, hub-config, currency-registry-read, pair-registry-read,
    supply, breaker-status, LP-position and LP-balance endpoints are all
    `security: []`. They are the natural entry point for a "discover the network"
    tutorial that needs no onboarding.

    ## No single gateway exposes this whole surface

    Route registration is conditional on per-gateway dependency injection:

    * `POST /api/v1/payments/{deposits,escrows,redeems}` are registered **only** on
      commercial-bank gateways (which proxy to their Central Bank).
    * The corresponding `approve` / `reject` / `exchange` operations are registered
      **only** on Central Bank gateways.
    * `/api/v2` groups appear only when their backing service is wired.

    So the create half and the approve half of the escrow lifecycle live on **different
    hosts**, and a 404 may mean "this gateway is not that kind of node" rather than
    "non-conformant". Every conformance suite must declare a gateway profile
    (commercial bank / central bank / hub) before it can assert anything.

    ## What is deliberately not here

    All `/internal/*` routes: the Cacti relay endpoints under `/internal/amm`
    (matched-commit execution, cross-currency bridge-in / hub-swap / bridge-out /
    residue-return), the payment relay under `/internal/v1/payments`, spoke
    self-registration under `/internal/v1/spokes`, and the transfer-limit pre-auth relay
    under `/internal/v2/transfer-limits`. They are authenticated by a relay credential,
    are Central-Bank-gateway-only, and must never be exposed publicly.

    They are also mid-migration in a way the platform document does not state: it
    presents relay auth as a plain `X-Relay-Auth` shared secret, while the delivered
    middleware prefers per-CB ECDSA signatures (`X-Relay-Key-Id`, `X-Relay-Timestamp`,
    `X-Relay-Signature`) with replay protection and falls back to the shared secret only
    while signatures are not mandatory. Documenting them as a bare shared secret would
    understate the security model, which is a further reason to keep them out of the
    community surface.

    Also out of scope: compliance, onboarding, governance-portal and identity endpoints
    that live on the same gateway but belong to other Toolbox domains.

    ## Source of truth, and how implementation-observed material is marked

    Derived from the delivered Scenario B gateway document
    `scenario-b/backend/services/api-gateway/docs/openapi.yaml`
    (`openapi: 3.0.3`, `info.title: CBWeb3 API Gateway`, `info.version: 2.3.0`),
    cross-checked against `internal/http/router/`, `internal/http/handlers/`,
    `internal/services/`, `internal/domain/` and the shipped end-to-end test
    `tests/integration/happy_path_test.go`.

    **The `/api/v2` surface is deliberately under-specified upstream.** A block comment
    in the platform document states: *"Schemas below are intentionally permissive
    (free-form objects) where the handler request/response shape is service-defined; see
    the handler packages for exact field contracts."* Roughly thirty `/api/v2` operations
    declare `{type: object, additionalProperties: true}` for their request and/or
    response.

    Publishing those as bare untyped objects would make this contract useless to the
    external implementers it exists for. So where the real shape was recovered from the
    delivered Go handlers or the platform's own executable end-to-end test, it is
    published here — and **every such schema carries `x-cbweb3-source:
    implementation-observed`** plus a note in its description. Schemas without that
    marker are transcribed from the platform's OpenAPI document.

    The distinction matters: the vendor is free to change an implementation-observed
    shape without touching its OpenAPI. Nothing here was invented — anything not present
    in either the document or the delivered code is called out as absent rather than
    guessed.

    Where the delivered implementation and the platform document **disagree**, this
    contract documents what a client actually observes and marks the discrepancy inline
    with a `Spec divergence:` paragraph. There are nine such divergences; they are
    listed in this directory's `README.md`.

    ## Conventions reproduced verbatim from the platform

    * **Amounts are strings, never numbers** — but the *unit is not uniform*. The
      `/api/v1` token and escrow surface says "big integer as string"; the `/api/v2` AMM
      surface says "base units (decimal string)"; `TransferLimitRecord.max_amount` is
      **wei** while the `max_amount` you *send* to create that same limit is
      **human-decimal** (`"100000.00"`). No decimals count is stated anywhere for
      tCeBM/fCeBM — 18 is implied by "wei" but never asserted. Do not assume a scale
      factor; use literal strings.
    * **Timestamps are mixed**: `format: date-time` RFC 3339 strings on database record
      metadata, plain `YYYY-MM-DD` on the swap-history date filters, and raw Unix
      **integers** on quote `created_at` / `valid_until`.
    * **Pair identifiers are opaque.** Five incompatible conventions appear in the
      delivered artefacts — `tCeBM_BRL-tCeBM_ARS`, `W-tCeBM_BRL/W-tCeBM_ARS`,
      `W-BRL-ARS`, the quote-style `W-BRL-W-ARS` (normalised to the sovereign form by
      `normalizeSovereignPoolPair`) and the circuit breaker's `BRL-USD` fallback. No
      canonical form is documented. **Always obtain a pair identifier from
      `GET /api/v2/amm/pairs` (`pair_id`); never construct one.**
    * **Caller identity is never taken from the request body.** `payer_bank_id`,
      `payer_id` and `owner_bank_id` exist in some request structs but are deprecated
      and ignored; the handlers derive identity from the session `bankId` claim with a
      configured `BANK_CODE` fallback, and fail closed with 401 if neither resolves. Do
      not teach clients to send them.
    * **There is no pagination** except on the swap history (`page` + `page_size`,
      clamped at 100). Every other list returns an unbounded array.
    * **No `pattern` constraint exists** on any identifier in the platform document.
