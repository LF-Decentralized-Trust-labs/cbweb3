    CrossCurrencySwapRequest:
      type: object
      description: |
        `Spec gap:` the platform declares this request as a free-form object. The fields
        below are read by the delivered cross-currency swap handler; required-ness
        reflects what the handler rejects with 400.

        **`max_amount_in` is bridged in full** before the Hub swap executes; the unspent
