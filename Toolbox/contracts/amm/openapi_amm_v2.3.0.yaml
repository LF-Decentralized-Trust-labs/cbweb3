        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/payments/redeems:
    post:
      tags: [Escrow]
      summary: Request redemption (tCeBM → fCeBM)
      description: |
        The unwind of Reserve Tokenisation. The commercial bank first initiates a Zeto
        transfer of tCeBM to the Central Bank, then proxies the redemption request. On
        approval the Central Bank verifies the transfer arrived and mints fCeBM back to
        the requester's Besu address.

        `Spec divergence:` the platform summary reads "(tCeBM → tCeBM)", identical on
        both sides. The real conversion is tCeBM (Zeto/Paladin) → fCeBM (ERC-20/Besu).
      operationId: requestRedeem
      security:
        - CookieAuth: []
      requestBody:
        required: true
