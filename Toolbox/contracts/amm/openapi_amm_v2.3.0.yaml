servers:
  - url: http://localhost:8080
    description: Local development gateway — the platform's own and only declared server
  - url: http://127.0.0.1:4011
    description: >-
      Local Prism mock of this contract. The Toolbox convention is one Prism
      instance per contract — 4010 pvp, 4011 amm, 4012 auth — so all three can run
      side by side: npx @stoplight/prism-cli mock
      Toolbox/contracts/amm/openapi_amm_v2.3.0.yaml --port 4011

tags:
  - name: Token
    description: |
      Balance queries for tCeBM (Zeto privacy token on Paladin) and fCeBM (the fiat
      ERC-20 token on Besu). Both are scoped to the calling bank's own identity — no
      identity or address parameter is accepted. Available when the payment orchestrator
      is configured.
  - name: Escrow
    description: |
      Deposit → Reserve Tokenisation → redeem lifecycle: converting fiat central bank
      money (fCeBM, ERC-20 on Besu) into tokenised central bank money (tCeBM, Zeto
      privacy token on Paladin) and back.

      Commercial bank gateways register deposit / escrow / redeem requests; Central Bank
      gateways process approve / reject / exchange. **The two halves are registered on
      different hosts.**

      `Spec divergence:` the platform's own summary lines read "tokenization escrow
      (tCeBM → tCeBM)" and "redemption (tCeBM → tCeBM)" — identical on both sides, and
      therefore meaningless. The delivered code and the platform's integration test call
      the ERC-20 side **fCeBM**. This contract writes fCeBM ↔ tCeBM throughout.
  - name: AMM Swap
    description: |
      Quotes and swaps on the Hub AMM. `swapExactOutput` is the intra-Hub single-pair
      leg; `swapCrossCurrency` is the actual cross-border settlement call, orchestrating
      bridge-in → Hub swap → bridge-out → residue return. Served under `/api/v2/amm`.
  - name: AMM Bridge
    description: |
      Lock-mint and burn-unlock bridging between a spoke (tCeBM) and the Hub
      (W-tCeBM mirrored asset), plus bridge position listing. Implements the Scenario B
      atomicity rule: lock → mint, burn → unlock. Served under `/api/v2/bridge`.
  - name: AMM Liquidity
    description: |
      Liquidity provisioning for the Hub AMM: cooperative commit-reveal, sovereign
      seeding by escrow-and-finalize (each Central Bank supplies only its own side),
      sovereign top-up and withdrawal, on-chain LP-share balance, position listing, and
      hub reconciliation.
  - name: AMM Token
    description: Token preparation for AMM participation — mint-and-approve and allowance grants.
  - name: Hub Currency Registry
    description: |
      Hub currency discovery. Central Banks register or remove their own currency, which
      deploys and registers its Hub W-token; anyone may list registered currencies.
  - name: AMM Pair Registry
    description: |
      Two-Central-Bank propose/confirm flow to activate a trading pair, plus public pair
      listing. `GET /api/v2/amm/pairs` is the only supported source of a valid
      `pool_pair` value.
  - name: Circuit Breaker
    description: |
      Asymmetric circuit breaker for the Hub AMM — **1-of-N pause, 2-of-N resume**
      (request + sign). Any single Central Bank can stop the market; restarting it takes
      two. Validated before every swap.
  - name: Transfer Limits
    description: |
      Configurable daily transfer limits (R1-10.1) set by Central Banks. Matched by
      specificity: (participant + currency) > (participant) > (currency) > global; an
      empty string means "all". Enforced at two chokepoints before value moves —
      `POST /api/v2/bridge/lock-mint` and `POST /api/v2/amm/swap/cross-currency` — both
      of which answer **422 TRANSFER_LIMIT_EXCEEDED** when the payer's daily allowance
      is exhausted.
  - name: Oversight
    description: |
      Master Viewing Key oversight — disclosure request / sign (quorum) and status,
      enabling supervised privacy disclosure over Zeto private state.

paths:

  # ===========================================================================
  # Token balances
  # ===========================================================================

  /api/v1/token/balance:
    get:
      tags: [Token]
      summary: Get the calling bank's tCeBM balance
      description: |
        Returns the tCeBM (Zeto privacy token on Paladin) balance of the Paladin identity
        configured internally in the calling bank's payment orchestrator. **No identity
        parameter is required or accepted** — a bank can only read its own balance.

        This is the balance that Reserve Tokenisation fills and that a cross-currency
        swap debits. Settlement verification compares it before and after a swap: the
        decrease should equal `amount_in`, not `max_amount_in`.
      operationId: getTokenBalance
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Balance returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBalanceResponse"
              example:
                balance: "9000000"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/token/fiat-balance:
    get:
      tags: [Token]
      summary: Get the calling bank's fCeBM (fiat ERC-20) balance
      description: |
        Returns the fCeBM balance — the fiat token, an ERC-20 on Besu — of the Besu
        operator address configured internally in the calling bank's payment
        orchestrator. **No address parameter is required or accepted.**

        A deposit approval mints into this balance; a Reserve Tokenisation escrow burns
        from it.

        `Spec divergence:` the platform's summary and field description call this
        balance "tCeBM" as well, which is wrong — it is the ERC-20 fiat token. The
        delivered code and integration test call it fCeBM.
      operationId: getFiatBalance
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Fiat balance returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetFiatBalanceResponse"
              example:
                balance: "1250000"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Fiat token adapter unavailable on this gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "fiat token adapter unavailable"

  # ===========================================================================
  # Escrow lifecycle — deposit, Reserve Tokenisation, redeem
  # ===========================================================================

  /api/v1/payments/deposits:
    post:
      tags: [Escrow]
      summary: Register a fiat deposit request
      description: |
        Step 1 of getting a commercial bank onto the network with value. The bank
        registers its intent to deposit fiat funds; the Central Bank creates a `PENDING`
        deposit record and returns a `deposit_id`.

        Registered **only on commercial-bank gateways** (those with a payment proxy
        handler). The proxy injects `requester_besu_address` from the verified caller
        identity — a client should not send it, and a value sent in the body is
        overwritten.
      operationId: registerDeposit
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDepositRequest"
            example:
              amount: "10000000"
      responses:
        "201":
          description: Deposit registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterDepositResponse"
              example:
                deposit_id: "dep-a1b2c3d4"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      tags: [Escrow]
      summary: List deposits
      description: |
        Returns deposits, optionally filtered by requester. Poll this after
        `approveDeposit` until the record's `status` reads `APPROVED`, then confirm with
        `GET /api/v1/token/fiat-balance`.

        No pagination.
      operationId: listDeposits
      security:
        - CookieAuth: []
      parameters:
        - name: requester_id
          in: query
          required: false
          description: Filter by requester Besu address
          schema:
            type: string
          example: "0x1234abcd..."
      responses:
        "200":
          description: Deposits listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDepositsResponse"
              example:
                deposits:
                  - id: "dep-a1b2c3d4"
                    requester_id: "bank-a"
                    requester_besu_address: "0x1234abcd..."
                    amount: "10000000"
                    status: "APPROVED"
                    fiat_mint_tx_hash: "0x1234..."
                    created_at: "2026-06-18T10:00:00Z"
                total: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/payments/deposits/approve:
    post:
      tags: [Escrow]
      summary: Approve a pending deposit (Central Bank only)
      description: |
        The Central Bank confirms it has received the fiat funds and moves the deposit to
        `APPROVED`. Registered **only on Central Bank gateways**.
      operationId: approveDeposit
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositIdRequest"
            example:
              deposit_id: "dep-a1b2c3d4"
      responses:
        "201":
          description: Deposit approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusAcknowledgement"
              example:
                status: approved
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/payments/deposits/reject:
    post:
      tags: [Escrow]
      summary: Reject a pending deposit (Central Bank only)
      description: Terminal rejection of a pending deposit, with an optional free-text reason.
      operationId: rejectDeposit
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRejectRequest"
            example:
              deposit_id: "dep-a1b2c3d4"
              reason: "funds not received by settlement cut-off"
      responses:
        "200":
          description: Deposit rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReasonAcknowledgement"
              example:
                reason: "funds not received by settlement cut-off"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/payments/deposits/exchange:
    post:
      tags: [Escrow]
      summary: Execute the fiat exchange — mint fCeBM (Central Bank only)
      description: |
        After approving a deposit, the Central Bank triggers the fiat exchange: it mints
        **fCeBM** (the ERC-20 fiat token) to the requester's Besu address on-chain. Also
        proxied by commercial-bank gateways at the same path.

        `Spec divergence:` the platform summary says "mint tCeBM" and the response field
        description says "the tCeBM mint". Both are wrong — the token minted here is the
        ERC-20 fiat token. tCeBM is minted later, by `approveEscrow`.
      operationId: requestFiatExchange
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositIdRequest"
            example:
              deposit_id: "dep-a1b2c3d4"
      responses:
        "201":
          description: Fiat exchange completed — fCeBM minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiatExchangeResponse"
              example:
                mint_tx_hash: "0x1234..."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/payments/escrows:
    post:
      tags: [Escrow]
      summary: Request a tokenisation escrow (fCeBM → tCeBM) — Reserve Tokenisation
      description: |
        **This is Reserve Tokenisation**, and it is a hard precondition for any
        cross-currency swap: the bridge-in handler refuses to move value for a bank that
        does not already hold sufficient tCeBM.

        Requests conversion of fCeBM (ERC-20 on Besu) into tCeBM (Zeto privacy token on
        Paladin). On approval the Central Bank burns the fiat token and mints tCeBM to
        the requester's Paladin identity.

        Registered **only on commercial-bank gateways**.
        `requester_besu_address` is scoped to the verified caller; a value sent in the
        body is overwritten.
      operationId: requestEscrow
      security:
        - CookieAuth: []
      requestBody:
