openapi: 3.0.3

info:
  title: CBWeb3 Toolbox — PvP Settlement Contract (Scenario A)
  version: 2.3.0
  description: |
    Normative interface contract for **Payment-versus-Payment (PvP) cross-border
    settlement** on CBWeb3 **Scenario A** (single-ledger, spoke-to-spoke), as delivered
    in **CBWeb3 API Gateway v2.3.0**.

    Scenario A settles a cross-currency payment as an **atomic swap of two tokenised
    central bank money (tCeBM) legs**, coordinated by a bilateral FX agreement and
    executed by a pair of dual-layer Hash Time-Locked Contracts (HTLCs).

    This contract covers that settlement path **end to end**, in 28 paths:

    | Surface | Paths | Why it is here |
    |---|---|---|
    | Token (`/api/v1/token/*`) | 5 | The balances an HTLC lock actually moves, and the probes a settlement test asserts on. |
    | Reserve lifecycle (`/api/v1/payments/{deposits,escrows,redeems}*`) | 15 | How a bank **obtains** the tCeBM it will lock. A hard precondition, not an optional step. |
    | FX agreement (`/api/v1/payments/fx/agreements*`) | 7 | Agreeing the terms of the swap. |
    | HTLC (`/api/v1/htlc/*`) | 6 | Executing the swap atomically. |

    The reserve lifecycle is included deliberately. **A bank cannot
    `POST /api/v1/htlc/lock` tokens it does not hold**, and tCeBM is obtained only by
    completing deposit → approve → fiat-exchange → escrow → approve. A conformance
    suite without it can assert response shapes against a mock and nothing more.

    > **Scenario A only.** Scenario B (hub-and-spoke) has **no** FX agreement surface
    > and **no** HTLC endpoints whatsoever; it settles via escrow, bridge lock-mint /
    > burn-unlock, and Hub AMM swaps. See `Toolbox/contracts/amm/`. The eight
    > `LockHTLC*` / `HTLCLock` component schemas that appear in the Scenario B platform
    > document are unreferenced copy-paste residue and are deliberately not published.

    ## The settlement flow this contract describes

    Two spokes, A and B, each running a gateway. Bank-A on Spoke-A wants to pay Bank-D
    on Spoke-B, exchanging BRL-denominated tCeBM for ARS-denominated tCeBM.

    0. **Reserve prelude — both banks must already hold tCeBM.**
       `POST /api/v1/payments/deposits` (bank) → `POST .../deposits/approve` (CB) →
       `POST .../deposits/fiat-exchange` (CB, mints fCeBM) →
       `POST /api/v1/payments/escrows` (bank) → `POST .../escrows/approve` (CB, burns
       fCeBM and mints tCeBM) → `GET /api/v1/token/balance` is non-zero. Steps 3 and 5
       below fail without this.
    1. **Agree the terms.** Bank-A calls `POST /api/v1/payments/fx/agreements`,
       specifying both legs, the rate and an expiry. The agreement is created
       `PROPOSED`. The server validates rate consistency
       (`|counter_amount/origin_amount − rate| ≤ FX_RATE_TOLERANCE_PCT`, default 0.1%)
       and that the two currencies differ.
    2. **Counterparty accepts.** The `counterparty_b` party calls
       `POST .../{tradeId}/accept` → `ACCEPTED`. Only now may HTLC locks be associated.
    3. **Initiator locks.** Bank-A calls `POST /api/v1/htlc/lock`. The gateway generates
       a secret **internally**, derives a SHA-256 hash lock from it, records the lock
       metadata on the public layer (Besu) and locks the actual token amount on the
       private layer (Zeto/Paladin). Default timelock: **now + 3600s**.
    4. **Hash lock crosses out-of-band.** The initiator shares `hash_lock` with the
       responder **off-chain**. *There is no API endpoint for this* — see "What is not
       here" below.
    5. **Responder locks.** Bank-D calls `POST /api/v1/htlc/lock-with-hash` supplying
       that `hash_lock`. Default timelock: **now + 1800s** — deliberately *shorter*
       than the initiator's, so the responder can refund first if settlement stalls.
    6. **Initiator settles, revealing the secret.** `POST /api/v1/htlc/settle` on
       Spoke-A. The contract checks `SHA-256(secret) == hash_lock`, then calls Zeto
       `transferLocked()` to release the private tokens to the receiver. The Cacti relay
       broadcasts the revealed secret to Spoke-B, which settles the mirror leg
       automatically.
    7. **Agreement reaches SETTLED**, normally driven by the relay, optionally by
       `POST .../{tradeId}/settle`.

    **Timeout path:** if the secret is never revealed, each side reclaims its own tokens
    via `POST /api/v1/htlc/refund` after its own timelock expires.

    ### The timelock ordering rule is safety-critical

    The initiator's timelock **must** be longer than the responder's. The platform
    expresses this in prose only — nothing in any schema enforces it. A test vector or
    tutorial that inverts the ordering models an **unsafe swap** in which the initiator
    can claim the responder's leg after the responder has lost the ability to refund.

    ## Authentication

    Cookie-based, not bearer. Obtain an `access_token` HttpOnly cookie via the flows in
    `Toolbox/contracts/auth/openapi_auth_v2.3.0.yaml` — commercial banks must complete
    the two-step PKI nonce dance (`/auth/login` → sign nonce → `/auth/wallet/bind`).
    There is no root-level `security` block: every operation declares its own, exactly
    as the platform document does.

    ## What is deliberately not here

    * **Internal relay endpoints.** The platform exposes one relay-facing FX route,
      `GET /internal/v1/payments/fx/agreements`, authenticated by an `X-Relay-Auth`
      shared secret and consumed by the Hyperledger Cacti cross-spoke bridge. It is not
      part of the community surface and is excluded. There are no `/internal` routes for
      HTLC at all.
    * **The cross-spoke choreography itself.** Transferring the `hash_lock` from
      initiator to responder, and broadcasting the revealed secret from Spoke-A to
      Spoke-B, both happen out-of-band via the relay. Neither has an API endpoint in the
      delivered gateway. A single `POST /api/v1/htlc/settle` therefore produces asynchronous
      state changes on a spoke you never called.
    * **The compliance, governance, supervisor, oversight, onboarding, identities,
      statement and PKI-administration surface** — roughly 42 of the Scenario A
      gateway's 69 `/api/v1` paths. Those serve supervisors and regulators rather than
      the settlement integrator this contract targets; they are deferred to a future
      `contracts/compliance/` document, not forgotten.
    * **Routes the platform registers but never documents.** The Scenario A router wires
      `GET /api/v1/statement`, `/api/v1/identities/*`, `/internal/v1/identities/*`,
      `POST /internal/v1/payments/pvp-legs` and `GET /internal/v1/payments/pvp-credits`,
      none of which appear anywhere in the platform's own OpenAPI document. The last two
      are the **only** endpoints on the entire platform whose names contain "pvp", and
      they are relay-internal. This contract records the gap rather than filling it with
      a guess; nothing here is modelled on them.

    ## Conditional availability

    Every endpoint in this contract requires the gateway's payment orchestrator service
    to be wired (`PaymentHandler != nil`). When it is not, the routes are simply never
    registered and a client receives **404**, not 501. A 404 from a conformance run may
    therefore mean "this gateway is not that kind of node" rather than "the
    implementation is non-conformant". Declare a gateway profile before asserting.

    **The reserve lifecycle is split across two gateway roles, and the split is not
    symmetric.** This matters more than any other deployment fact in this document:

    | Operation group | Commercial-bank gateway | Central Bank gateway |
    |---|---|---|
    | `POST` deposits / escrows / redeems | **served** (proxied to the CB) | 404 — the CB receives these over the relay-internal path instead |
    | `GET` deposits / escrows / redeems | served | served |
    | `approve` / `reject` / `fiat-exchange` | 404 | **served**, `ROLE_TREASURY` |
    | `POST /api/v1/token/burn` | 404 | served, `ROLE_TREASURY` |
    | `POST /api/v1/token/mint` | served, **no role gate** | served, `ROLE_TREASURY` |
    | HTLC, FX, `token/transfer`, both balances | served | served |

    So **no single base URL can drive the whole reserve lifecycle.** A test that creates
    a deposit and approves it must hold two sessions against two hosts. This is a
    property of the delivered system, not of this contract.

    Two server-side environment variables change behaviour without being discoverable
    through any endpoint: `FX_RATE_TOLERANCE_PCT` (rate check tightness) and
    `FX_AGREEMENT_HTLC_STRICT` (whether `agreement_id` on an HTLC lock is validated
    against the agreement). A client cannot query either.

    ## Conventions reproduced verbatim from the platform

    * **Path placeholders are camelCase** (`{tradeId}`, `{contractId}`) while every JSON
      body and response field is **snake_case** (`trade_id`, `contract_id`, `hash_lock`,
      `time_lock`, `on_behalf`, `occurred_at_unix`). This is not harmonised here.
    * **Amounts and rates are decimal strings**, never numbers: `"1000000"`, `"0.85"`.
    * **Timestamps are `integer/int64` Unix *seconds***, not milliseconds and not
      RFC 3339: `time_lock`, `expiry_date`, `occurred_at_unix`.
    * **Identities are Paladin `name@node` strings** such as
      `funded_operator@spoke-a-bank-c` — not wallet addresses and not bank codes.
    * **The HTLC's link to an FX agreement is called `agreement_id`, not `trade_id`,**
      even though the value *is* an FX `trade_id`. This cross-domain rename is a real
      trap; it is reproduced as-is.
    * **There is no pagination** anywhere in this surface — no `limit`, `offset`, `page`
      or cursor on either list endpoint. `total` is the length of the returned array.
    * **No `pattern` constraint exists** on any identifier in the platform document.
      Identifier shapes below are conveyed by example only. Do not validate them with
      regexes the platform does not enforce.

    ## Source of truth

    Derived from the delivered Scenario A gateway document
    `scenario-a/backend/services/api-gateway/docs/openapi.yaml`
    (`openapi: 3.0.3`, `info.title: CBWeb3 API Gateway`, `info.version: 2.3.0`),
    cross-checked against `internal/http/router/router.go`.

    Where the delivered implementation and the platform's own document disagree, this
    contract documents **what a client actually observes** and marks the discrepancy
    inline with a `Spec divergence:` paragraph.
