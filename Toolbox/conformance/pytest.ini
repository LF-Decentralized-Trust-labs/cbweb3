[pytest]
testpaths = tests
addopts = -v --tb=short --strict-markers

markers =
    # ---- category -------------------------------------------------------
    happy_path: Happy-path conformance tests
    error: Error-case conformance tests (assert status codes, never error text)
    edge_case: Edge-case and boundary tests

    # ---- execution tier (orthogonal to category) ------------------------
    mock_safe: Single-request shape/status assertions. Run against a Prism mock AND a live gateway.
    live_only: Multi-step state transitions and settlement verification. Skipped automatically when CBWEB3_AUTH_MODE=mock, because Prism is stateless.
    bearer_ok: Operation accepts Bearer as an alternative to the session cookie (12 Scenario B /api/v2 RequireAnyAuth routes). The only tests that run under CBWEB3_AUTH_MODE=bearer.

    # ---- contract domain ------------------------------------------------
    auth: Shared authentication and session surface (contracts/auth)
    pvp: Scenario A PvP settlement surface (contracts/pvp)
    amm: Scenario B hub-and-spoke surface (contracts/amm)

    # ---- sub-domain -----------------------------------------------------
    reserves: Reserve lifecycle — deposits, escrows, redeems, balances
    fx_agreement: FX agreement lifecycle (Scenario A only)
    htlc: Dual-layer HTLC settlement (Scenario A only)
    registry: Hub currency/pair registries, pool status, circuit-breaker reads (Scenario B only)
    amm_swap: AMM quotes and cross-currency swaps (Scenario B only)
    bridge: Bridge lock-mint / burn-unlock and hub reconciliation (Scenario B only)

    # ---- scenario -------------------------------------------------------
    scenario_a: Single-ledger, spoke-to-spoke. Skipped against a scenario-b gateway profile.
    scenario_b: Hub-and-spoke, International Hub. Skipped against a scenario-a gateway profile.
